# SEMANTICALLY INVALID, possibly structurally schema-valid:
# an optional Input is used without dominating input_provided guard.
assessment:
  id: semantic-unguarded-input-assessment
  version: 1
  assessment_title: Missing guard for optional policy Input
  mode: automated
  class: miscellaneous
  specification: {id: scap-ng.pre-alpha.assessment, version: 0.4.1}
  inputs:
    policy-value-input: {datatype: integer, cardinality: zero_or_one, required: false}
  tests:
    needs-policy-test:
      test_title: Requires caller to provide the optional Input
      capability: variable.value
      variable: reference-variable
      require:
        item_requirement: {items_found: one_or_more, items_satisfying: every}
        field_requirement: {values_found: one_or_more, values_matching: every}
        fields: {value: {equals: {input: policy-value-input}}}
      reported_elements: all
  evaluate: {test: needs-policy-test}
  variables:
    reference-variable: {kind: constant, expression: {literal: 1}}
