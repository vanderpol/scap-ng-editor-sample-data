    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Remove any found ".shosts" files from the system. $ sudo rm /[path]/[to]/[file]/.shosts
  organizational_input_requirements: {}
