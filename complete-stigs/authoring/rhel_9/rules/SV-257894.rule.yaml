rule:
  id: SV-257894
  version: r991589
  title: RHEL 9 /etc/gshadow- file must have mode 0000 or less permissive to prevent unauthorized access.
  severity: medium
  role: full
  weight: 10.0
  discussion: The "/etc/gshadow-" file is a backup of "/etc/gshadow", and as such, contains group password hashes. Protection
    of this file is critical for system security.
