rule:
  id: SV-257999
  version: r1155686
  title: RHEL 9 SSH server configuration files' permissions must not be modified.
  severity: medium
  role: full
  weight: 10.0
  discussion: Service configuration files enable or disable features of their respective services, that if configured incorrectly,
    can lead to insecure and vulnerable configurations. Therefore, service configuration files must have correct permissions
    (owner, group owner, mode) to prevent unauthorized changes.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-255115
  - scheme: vulnerability
    value: V-257999
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: 'Run the following commands to restore the correct permissions of OpenSSH server configuration files: $ sudo
      rpm --setugids openssh-server $ sudo rpm --setperms openssh-server'
  organizational_input_requirements: {}
  assessment_choices:
    automated:
      assessment: SV-257999.automated
    manual:
      assessment: SV-257999.manual
  default_assessment_choice: automated
