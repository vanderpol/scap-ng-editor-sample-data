    value: RHEL-09-671020
  - scheme: vulnerability
    value: V-258232
  - scheme: cci
    value: CCI-000068
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
