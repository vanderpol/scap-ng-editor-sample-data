rule:
  id: SV-258232
  version: r1184335
  title: RHEL 9 IP tunnels must use FIPS 140-3 approved cryptographic algorithms.
  severity: high
  role: full
  weight: 10.0
  discussion: Overriding the system crypto policy makes the behavior of the Libreswan service violate expectations, and makes
    system configuration more fragmented.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
