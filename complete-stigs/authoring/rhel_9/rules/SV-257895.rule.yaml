rule:
  id: SV-257895
  version: r991589
  title: RHEL 9 /etc/passwd file must have mode 0644 or less permissive to prevent unauthorized access.
  severity: medium
  role: full
  weight: 10.0
  discussion: If the "/etc/passwd" file is writable by a group-owner or the world the risk of its compromise is increased.
    The file contains the list of accounts on the system and associated information, and protection of this file is critical
    for system security.
  rationale: null
