rule:
  id: SV-257813
  version: r1134899
  title: RHEL 9 must disable storing core dumps.
  severity: medium
  role: full
  weight: 10.0
  discussion: A core dump includes a memory image taken at the time the operating system terminates an application. The memory
    image could contain sensitive data and is generally useful only for developers or system operators trying to debug problems.
    Enabling core dumps on production systems is not recommended; however, there may be overriding operational requirements
    to enable advanced debugging. Permitting temporary enablement of core dumps during such situations must be reviewed through
    local needs and policy.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-213090
  - scheme: vulnerability
    value: V-257813
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - benchmark.rhel_9.condition.kernel-dumps-enabled
  parameters: {}
  remediation:
    guidance: 'Configure the operating system to disable storing core dumps for all users. Add or modify the following line
      in /etc/systemd/coredump.conf: Storage=none'
  organizational_input_requirements: {}
  assessment_choices:
    automated:
      assessment: ng.shared.usr-systemd-coredump-conf-storage-is-set-to-none
    manual:
      assessment: SV-257813.manual
  default_assessment_choice: automated
