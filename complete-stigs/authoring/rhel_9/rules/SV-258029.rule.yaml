rule:
  id: SV-258029
  version: r1045109
  title: RHEL 9 must disable the ability of a user to restart the system from the login screen.
  severity: medium
  role: full
  weight: 10.0
  discussion: A user who is at the console can reboot the system at the login screen. If restart or shutdown buttons are pressed
    at the login screen, this can create the risk of short-term loss of availability of systems due to reboot.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
  warnings: []
  identifiers:
  - scheme: stig
    value: RHEL-09-271095
  - scheme: vulnerability
    value: V-258029
  - scheme: cci
    value: CCI-000366
  references:
  - title: DPMS Target Red Hat Enterprise Linux 9
    publisher: DISA
    type: DPMS Target
    subject: Red Hat Enterprise Linux 9
    identifier: '5551'
  requires: []
  conflicts: []
  applicability:
  - benchmark.rhel_9.condition.gnome-shell-package
  parameters: {}
  remediation:
    guidance: 'Configure RHEL 9 to disable a user''s ability to restart the system. $ gsettings set org.gnome.login-screen
      disable-restart-buttons true Update the dconf system databases: $ sudo dconf update'
  organizational_input_requirements: {}
  assessment_choices:
    automated:
      assessment: ng.shared.dconf-disable-restart-buttons-true
    manual:
      assessment: SV-258029.manual
  default_assessment_choice: automated
