rule:
  id: SV-257855
  version: r1044936
  title: RHEL 9 must prevent code from being executed on file systems that are imported via Network File System (NFS).
  severity: medium
  role: full
  weight: 10.0
  discussion: The "noexec" mount option causes the system not to execute binary files. This option must be used for mounting
    any file system not containing approved binary as they may be incompatible. Executing files from untrusted file systems
    increases the opportunity for nonprivileged users to attain unauthorized administrative access.
  rationale: null
  extensions:
    disa_stig:
      documentable: false
      false_positives: null
      false_negatives: null
      mitigations: null
      potential_impacts: null
      responsibility: null
