assessment:
  id: SV-258224.automated
  version: 2
  assessment_title: RHEL-09-654250 - RHEL 9 must generate audit records for all account creations, modifications,
    disabling, and termination events that affect /var/log/faillock.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-32-bit-invocations-var-log-faillock-test:
      test_title: Audit 32-bit invocations of /var/log/faillock
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/audit.rules
          pattern:
            matches_regex: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+-F\s+path=\/var\/log\/faillock\s+-F\s+perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)\s+-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: all_exist
    audit-64-bit-invocations-var-log-faillock-test:
      test_title: Audit 64-bit invocations of /var/log/faillock
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/audit.rules
          pattern:
            matches_regex: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+-F\s+path=\/var\/log\/faillock\s+-F\s+perm=([rx]*w[rx]*a[rx]*|[rx]*a[rx]*w[rx]*)\s+-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: all_exist
  evaluate:
    all:
    - test: audit-32-bit-invocations-var-log-faillock-test
    - test: audit-64-bit-invocations-var-log-faillock-test
