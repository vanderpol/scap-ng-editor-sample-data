assessment:
  id: SV-258017.automated
  version: 13
  assessment_title: RHEL 9 must prevent a user from overriding the disabling of the graphical user interface autorun
    function.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never-test:
      test_title: Verify gsettings writable org.gnome.desktop.media-handling autorun-never returns false
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Retrieve gsettings writable org.gnome.desktop.media-handling autorun-never
        collect:
          shell: bash
          command: gsettings writable org.gnome.desktop.media-handling autorun-never
          pattern: .+
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: at_least_one_exists_and_all_match
          equals: 'false'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verify-gsettings-writable-org-gnome-desktop-media-handling-autorun-never-test
