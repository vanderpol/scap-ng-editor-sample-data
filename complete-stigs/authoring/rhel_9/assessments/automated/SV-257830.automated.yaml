assessment:
  id: SV-257830.automated
  version: 13
  assessment_title: RHEL 9 must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    os-not-install-packages-from-extra-packages-enterprise-linux-epel-test:
      test_title: The OS must not install packages from the Extra Packages for Enterprise Linux (EPEL) repository.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Retrieve dnf repolist, filter on those that contain 'epel'
        collect:
          shell: bash
          command: dnf repolist
          pattern: epel
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: none_exist
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: os-not-install-packages-from-extra-packages-enterprise-linux-epel-test
