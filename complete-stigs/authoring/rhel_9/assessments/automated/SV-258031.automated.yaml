assessment:
  id: SV-258031.automated
  version: 13
  assessment_title: RHEL 9 must disable the ability of a user to accidentally press Ctrl-Alt-Del and cause a system
    to shut down or reboot.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-rhel-9-configured-ignore-ctrl-alt-del-sequence-in-test:
      test_title: Verify RHEL 9 is configured to ignore the Ctrl-Alt-Del sequence in the GNOME desktop.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Retrieve GNOME desktop logout setting.
        collect:
          shell: bash
          command: gsettings get org.gnome.settings-daemon.plugins.media-keys logout
          pattern: .*
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: at_least_one_exists_and_all_match
          equals: '['''']'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verify-rhel-9-configured-ignore-ctrl-alt-del-sequence-in-test
