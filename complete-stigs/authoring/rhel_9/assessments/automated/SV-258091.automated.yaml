assessment:
  id: SV-258091.automated
  version: 2
  assessment_title: RHEL-09-611010 - RHEL 9 must ensure the password complexity module in the system-auth file is
    configured for three retries or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-security-pwquality-conf-retry-not-greater-than-3-not-test:
      test_title: /etc/security/pwquality.conf:retry not greater than 3 and not 0
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/pwquality.conf
                pattern:
                  matches_regex: ^\s*retry\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  equals: 1
              object_title: in /etc/security/pwquality.conf check for pam_pwquality.so retry equals value
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/pwquality.conf.d
                name:
                  matches_regex: \.conf$
                pattern:
                  matches_regex: ^\s*retry\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  equals: 1
              object_title: in /etc/security/pwquality.conf check for pam_pwquality.so retry equals value
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^[123]$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-security-pwquality-conf-retry-not-greater-than-3-not-test
