assessment:
  id: SV-257931.automated
  version: 13
  assessment_title: All RHEL 9 local files and directories must have a valid owner.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-all-local-files-directories-on-rhel-8-have-valid-test:
      test_title: Verify all local files and directories on RHEL 8 have a valid owner.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Verify all local files and directories on RHEL 8 have a valid owner.  Limit results to the first
          100 failures found.
        collect:
          shell: bash
          command: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser -print | head
            -n 100
          pattern: .*
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - and:
        - exit_status:
            require: at_least_one_exists_and_all_match
            equals: 0
        - stdout_line:
            require: none_exist
            equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verify-all-local-files-directories-on-rhel-8-have-valid-test
