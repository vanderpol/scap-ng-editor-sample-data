assessment:
  id: SV-258021.automated
  version: 13
  assessment_title: RHEL 9 must enable a user session lock until that user re-establishes access using established
    identification and authentication procedures for graphical user sessions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-operating-system-enables-user-s-session-lock-until-that-test:
      test_title: Verify the operating system enables a user's session lock until that user re-establishes access
        using established identification and authentication procedures.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Retrieve org.gnome.desktop.screensaver lock-enabled setting.
        collect:
          shell: bash
          command: gsettings get org.gnome.desktop.screensaver lock-enabled
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: at_least_one_exists_and_all_match
          equals: 'true'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verify-operating-system-enables-user-s-session-lock-until-that-test
