assessment:
  id: SV-257825.automated
  version: 1
  assessment_title: RHEL-09-215010 - RHEL 9 subscription-manager package must be installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    subscription-manager-package-installed-test:
      test_title: subscription-manager package is installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: subscription-manager
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: subscription-manager-package-installed-test
