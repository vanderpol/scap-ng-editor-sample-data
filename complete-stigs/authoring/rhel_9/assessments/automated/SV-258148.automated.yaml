assessment:
  id: SV-258148.automated
  version: 1
  assessment_title: RHEL-09-652050 - RHEL 9 must encrypt via the gtls driver the transfer of audit records offloaded
    onto a different system or media from the system being audited via rsyslog.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    defaultnetstreamdriver-gtls-test:
      test_title: DefaultNetstreamDriver == gtls
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/rsyslog.conf
                pattern:
                  matches_regex: ^\$DefaultNetstreamDriver\s+(\S+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: 'rsyslog.conf: DefaultNetstreamDriver'
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/rsyslog.d
                name:
                  matches_regex: ^.*\.conf$
                pattern:
                  matches_regex: ^\$DefaultNetstreamDriver\s+(\S+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: 'rsyslog.d/*.conf: DefaultNetstreamDriver'
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: DefaultNetstreamDriver
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: gtls
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    streamdriver-gtls-advanced-syntax-test:
      test_title: StreamDriver == gtls (advanced syntax)
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/rsyslog.conf
                pattern:
                  matches_regex: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  greater_than_or_equal: 1
              object_title: 'rsyslog.conf: action for all messages'
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/rsyslog.d
                name:
                  matches_regex: ^.*\.conf$
                pattern:
                  matches_regex: ^\*\.\*\s+action\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  greater_than_or_equal: 1
              object_title: 'rsyslog.d/*.conf: action for all messages'
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: 'rsyslog: action for all messages'
      states:
      - subexpression:
          matches_regex: (?i)(?:^|\n)[^#]*\btype\s*=\s*"omfwd"
      - subexpression:
          matches_regex: (?i)(?:^|\n)[^#]*\bStreamDriver(?:\.Name)?\s*=\s*"gtls"
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_some_match
    streamdriver-not-set-in-module-block-advanced-syntax-test:
      test_title: StreamDriver is not set in a module block (advanced syntax)
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/rsyslog.conf
                pattern:
                  matches_regex: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  greater_than_or_equal: 1
              object_title: 'rsyslog.conf: module blocks'
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/rsyslog.d
                name:
                  matches_regex: ^.*\.conf$
                pattern:
                  matches_regex: ^\s*module\((\s*(?:[^#\)]*(?:#.*$)?\n)*[^#\)]*)\)
                instance:
                  greater_than_or_equal: 1
              object_title: 'rsyslog.d/*.conf: module blocks'
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: 'rsyslog: module blocks'
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?i)(?:^|\n)[^#]*\bStreamDriver(?:\.Name)?\b
      reported_elements: all
      collected_items_require: may_be_absent_and_none_match
  evaluate:
    all:
    - any:
      - test: defaultnetstreamdriver-gtls-test
      - test: streamdriver-gtls-advanced-syntax-test
    - test: streamdriver-not-set-in-module-block-advanced-syntax-test
