assessment:
  id: SV-258241.automated
  version: 13
  assessment_title: RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-rhel-9-set-use-fips-140-3-compliant-systemwide-test:
      test_title: Verify RHEL 9 is set to use a FIPS 140-3-compliant systemwide cryptographic policy.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Retrieve system wide crypto policy(ies).
        collect:
          shell: bash
          command: update-crypto-policies --show
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - and:
        - exit_status:
            equals: 0
        - stdout_line:
            matches_regex: ^FIPS:*
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    verify-current-minimum-crypto-policy-configuration-test:
      test_title: Verify the current minimum crypto-policy configuration.
      capability: independent.textfilecontent54
      object: retrieve-current-minimum-crypto-policy-configuration-object
      states:
      - text:
          datatype: string
          value_match: all
          require: at_least_one_exists_and_all_match
          matches_regex:
          - SHA2-256
          - SHA2-384
          - SHA2-512
          - SHA2-224
          - SHA3-256
          - SHA3-384
          - SHA3-384
          - SHA3-512
          - SHAKE-256
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    verify-no-sha1-algorithms-employed-test:
      test_title: Verify no SHA1 algorithms are employed.
      capability: independent.textfilecontent54
      object: retrieve-current-minimum-crypto-policy-configuration-object
      states:
      - text:
          require: at_least_one_exists_and_all_match
          matches_regex: SHA1-\d
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
    verify-minimum-hash-values-224-test:
      test_title: Verify minimum hash values of 224.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/crypto-policies/state/CURRENT.pol
          pattern:
            matches_regex: ^hash\s*=\s*([^#\n]+)$
          instance:
            greater_than_or_equal: 1
        object_title: Retrieve the current minimum crypto-policy configuration with hash values subexpression.
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: \b[A-Z]+\d*-((\d{1,2}\b)|(1\d\d\b)|(21\d\b)|(22[1-3]\b))
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
    verify-minimum-rsa-size-2048-test:
      test_title: Verify minimum rsa size of 2048.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/crypto-policies/state/CURRENT.pol
          pattern:
            matches_regex: ^\s*min_rsa_size\s*=\s*(\d+)
          instance:
            greater_than_or_equal: 1
        object_title: Retrieve the current minimum rsa size.
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          greater_than_or_equal: 2048
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    all:
    - test: verify-rhel-9-set-use-fips-140-3-compliant-systemwide-test
    - test: verify-current-minimum-crypto-policy-configuration-test
    - not:
        test: verify-no-sha1-algorithms-employed-test
    - not:
        test: verify-minimum-hash-values-224-test
    - test: verify-minimum-rsa-size-2048-test
  shared_objects:
    retrieve-current-minimum-crypto-policy-configuration-object:
      capability: independent.textfilecontent54
      select:
        full_path:
          equals: /etc/crypto-policies/state/CURRENT.pol
        pattern:
          matches_regex: ^hash\s*=\s*.*$
        instance:
          greater_than_or_equal: 1
      object_title: Retrieve the current minimum crypto-policy configuration.
      filesystem: all
      collect:
        ignore_case: false
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
