assessment:
  id: SV-257884.automated
  version: 13
  assessment_title: RHEL 9 library files must have mode 755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    system-library-files-have-mode-755-or-less-permissive-gwrite-test:
      test_title: System Library files have mode 755 or less permissive (gwrite should be = false)
      capability: unix.file
      object:
        capability: unix.file
        object_title: All files in system Library with mode 755 (gwrite should be = false)
        set:
          operator: union
          operands:
          - object:
              capability: unix.file
              select:
                directory:
                  datatype: string
                  value_match: one
                  equals:
                  - /lib
                  - /lib64
                  - /usr/lib
                  - /usr/lib64
                name:
                  matches_regex: .*
              object_title: All files in system Library with mode 755 (gwrite should be = false)
              filesystem: all
            filters:
            - exclude:
                group_write:
                  require: at_least_one_exists_and_all_match
                  equals: false
            - exclude:
                type:
                  require: at_least_one_exists_and_all_match
                  equals: symbolic link
            - exclude:
                type:
                  require: at_least_one_exists_and_all_match
                  equals: directory
      reported_elements: all
      collected_items_require: none_exist
    system-library-files-have-mode-755-or-less-permissive-owrite-test:
      test_title: System Library files have mode 755 or less permissive (owrite should be = false)
      capability: unix.file
      object:
        capability: unix.file
        object_title: All files in system Library with mode 755 (owrite should be = false)
        set:
          operator: union
          operands:
          - object:
              capability: unix.file
              select:
                directory:
                  datatype: string
                  value_match: one
                  equals:
                  - /lib
                  - /lib64
                  - /usr/lib
                  - /usr/lib64
                name:
                  matches_regex: .*
              object_title: All files in system Library with mode 755 (owrite should be = false)
              filesystem: all
            filters:
            - exclude:
                other_write:
                  require: at_least_one_exists_and_all_match
                  equals: false
            - exclude:
                type:
                  require: at_least_one_exists_and_all_match
                  equals: symbolic link
            - exclude:
                type:
                  require: at_least_one_exists_and_all_match
                  equals: directory
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    all:
    - test: system-library-files-have-mode-755-or-less-permissive-gwrite-test
    - test: system-library-files-have-mode-755-or-less-permissive-owrite-test
