assessment:
  id: SV-257923.automated
  version: 13
  assessment_title: RHEL 9 library directories must be group-owned by root or a system account.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    system-library-directories-group-by-root-group-test:
      test_title: System Library directories are group by root group.
      capability: unix.file
      object:
        capability: unix.file
        object_title: All system-wide Library directories not owned by root-group
        set:
          operator: union
          operands:
          - object:
              capability: unix.file
              select:
                directory:
                  datatype: string
                  value_match: one
                  equals:
                  - /lib
                  - /lib64
                  - /usr/lib
                  - /usr/lib64
                name: null
              object_title: All system-wide Library directories not owned by root-group
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
            filters:
            - exclude:
                owner_gid:
                  require: at_least_one_exists_and_all_match
                  less_than: 1000
            - exclude:
                type:
                  require: at_least_one_exists_and_all_match
                  equals: file
            - exclude:
                type:
                  require: at_least_one_exists_and_all_match
                  equals: symbolic link
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: system-library-directories-group-by-root-group-test
