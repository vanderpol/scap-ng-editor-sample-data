assessment:
  id: SV-257829.automated
  version: 1
  assessment_title: RHEL-09-215030 - RHEL 9 must not have the ypserv package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    ypserv-package-not-installed-test:
      test_title: The ypserv package is not installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: ypserv
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: ypserv-package-not-installed-test
