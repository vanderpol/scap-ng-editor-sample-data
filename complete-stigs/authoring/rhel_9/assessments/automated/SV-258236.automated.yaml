assessment:
  id: SV-258236.automated
  version: 1
  assessment_title: RHEL-09-672020 - RHEL 9 crypto policy must not be overridden.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    bind-test:
      test_title: bind
      capability: unix.symlink
      object:
        capability: unix.symlink
        select:
          full_path:
            equals: /etc/crypto-policies/back-ends/bind.config
        object_title: bind
      states:
      - canonical_path:
          require: at_least_one_exists_and_all_match
          equals: /usr/share/crypto-policies/FIPS/bind.txt
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    gnutls-test:
      test_title: gnutls
      capability: unix.symlink
      object:
        capability: unix.symlink
        select:
          full_path:
            equals: /etc/crypto-policies/back-ends/gnutls.config
        object_title: gnutls
      states:
      - canonical_path:
          require: at_least_one_exists_and_all_match
          equals: /usr/share/crypto-policies/FIPS/gnutls.txt
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
