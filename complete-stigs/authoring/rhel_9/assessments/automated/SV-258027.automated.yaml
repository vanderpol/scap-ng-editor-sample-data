assessment:
  id: SV-258027.automated
  version: 13
  assessment_title: RHEL 9 must conceal, via the session lock, information previously visible on the display with
    a publicly viewable image.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    ensure-screensaver-configured-blank-test:
      test_title: Ensure the screensaver is configured to be blank.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Retrieve picture-uri 'writable' configuration from org.gnome.dekstop.screensaver.
        collect:
          shell: bash
          command: gsettings writable org.gnome.desktop.screensaver picture-uri
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - and:
        - stdout_line:
            require: at_least_one_exists_and_all_match
            not_equal: 'true'
        - stderr_line:
            require: none_exist
            equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: ensure-screensaver-configured-blank-test
