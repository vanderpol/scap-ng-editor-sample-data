assessment:
  id: SV-258029.manual
  version: 1
  assessment_title: RHEL 9 must disable the ability of a user to restart the system from the login screen.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, Gnome Shell. If the system
    does not have any graphical user interface installed, this requirement is Not Applicable. Verify RHEL 9 disables a user''s
    ability to restart the system with the following command: $ gsettings get org.gnome.login-screen disable-restart-buttons
    true If "disable-restart-buttons" is "false", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
