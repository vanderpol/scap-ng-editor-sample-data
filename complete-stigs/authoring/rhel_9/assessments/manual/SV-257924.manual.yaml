assessment:
  id: SV-257924.manual
  version: 1
  assessment_title: RHEL 9 audit tools must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit tools are owned by "root" with the following command: $ sudo stat -c "%U %n" /sbin/auditctl
    /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/rsyslogd /sbin/augenrules root /sbin/auditctl root /sbin/aureport
    root /sbin/ausearch root /sbin/autrace root /sbin/auditd root /sbin/rsyslogd root /sbin/augenrules If any audit tools
    do not have an owner of "root", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
