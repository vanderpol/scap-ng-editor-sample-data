assessment:
  id: SV-257811.manual
  version: 1
  assessment_title: RHEL 9 must restrict usage of ptrace to descendant processes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 restricts the usage of ptrace to descendant processes. Check the status of the "kernel.yama.ptrace_scope"
    kernel parameter with the following command: $ sysctl kernel.yama.ptrace_scope kernel.yama.ptrace_scope = 1 If the network
    parameter "kernel.yama.ptrace_scope" is not equal to "1", or nothing is returned, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
