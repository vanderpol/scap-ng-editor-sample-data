assessment:
  id: SV-257802.manual
  version: 1
  assessment_title: RHEL 9 must enable kernel parameters to enforce discretionary access (DAC) control on symlinks.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to enable DAC on symlinks. Check the status of the "fs.protected_symlinks" kernel
    parameter with the following command: $ sudo sysctl fs.protected_symlinks fs.protected_symlinks = 1 If "fs.protected_symlinks"
    is not set to "1" or is missing, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
