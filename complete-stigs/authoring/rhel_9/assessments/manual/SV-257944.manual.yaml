assessment:
  id: SV-257944.manual
  version: 1
  assessment_title: RHEL 9 chronyd service must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the chronyd service is active with the following command: $ systemctl is-active chronyd active If the
    chronyd service is not active, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
