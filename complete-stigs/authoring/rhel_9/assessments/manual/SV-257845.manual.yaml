assessment:
  id: SV-257845.manual
  version: 1
  assessment_title: RHEL 9 must use a separate file system for /var.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/var" with the following command: $ mount
    | grep /var /dev/mapper/rootvg-varlv on /var type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)
    Note: Options displayed for mount may differ. If a separate entry for "/var" is not in use, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
