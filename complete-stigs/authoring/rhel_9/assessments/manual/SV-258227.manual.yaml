assessment:
  id: SV-258227.manual
  version: 1
  assessment_title: RHEL 9 must take appropriate action when a critical audit processing failure occurs.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit service is configured to panic on a critical error with the following command: $ sudo grep
    "\-f" /etc/audit/audit.rules -f 2 If the value for "-f" is not "2", and availability is not documented as an overriding
    concern, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
