assessment:
  id: SV-257849.manual
  version: 1
  assessment_title: RHEL 9 file system automount function must be disabled unless required.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the autofs service is not installed, this requirement is Not Applicable. Verify that the RHEL 9 file
    system automount function has been disabled with the following command: $ systemctl is-enabled autofs masked If the returned
    value is not "masked", "disabled", or "Failed to get unit file state for autofs.service for autofs" and is not documented
    as an operational requirement with the information system security officer (ISSO), this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
