assessment:
  id: SV-258037.manual
  version: 1
  assessment_title: RHEL 9 must enable Linux audit logging for the USBGuard daemon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'To verify that Linux Audit logging is enabled for the USBGuard daemon with the following command: $ sudo grep
    AuditBackend /etc/usbguard/usbguard-daemon.conf AuditBackend=LinuxAudit If "AuditBackend" is not set to "LinuxAudit",
    this is a finding. If the system is virtual machine with no virtual or physical USB peripherals attached, this is not
    a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
