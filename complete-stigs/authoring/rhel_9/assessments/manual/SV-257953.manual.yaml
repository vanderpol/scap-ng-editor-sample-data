assessment:
  id: SV-257953.manual
  version: 1
  assessment_title: RHEL 9 must forward mail from postmaster to the root account using a postfix alias.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify that the administrators are notified in the event of an audit processing failure. Check that the "/etc/aliases"
    file has a defined value for "root". $ sudo grep "postmaster:\s*root$" /etc/aliases If the command does not return a line,
    or the line is commented out, ask the system administrator to indicate how they and the information systems security officer
    (ISSO) are notified of an audit process failure. If there is no evidence of the proper personnel being notified of an
    audit processing failure, this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
