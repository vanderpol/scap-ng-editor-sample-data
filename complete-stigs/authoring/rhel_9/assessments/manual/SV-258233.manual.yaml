assessment:
  id: SV-258233.manual
  version: 1
  assessment_title: RHEL 9 pam_unix.so module must be configured in the password-auth file to use a FIPS 140-3 approved cryptographic
    hashing algorithm for system authentication.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the pam_unix.so module is configured to use sha512 in /etc/pam.d/password-auth with the following
    command: $ grep "^password.*pam_unix.so.*sha512" /etc/pam.d/password-auth password sufficient pam_unix.so sha512 If "sha512"
    is missing, or the line is commented out, this is a finding. If the system administrator (SA) can demonstrate that the
    required configuration is contained in a PAM configuration file included or substacked from the system-auth file, this
    is not a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
