assessment:
  id: SV-258125.manual
  version: 1
  assessment_title: The pcscd socket on RHEL 9 must be active.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "pcscd" socket is active with the following command: $ systemctl is-active pcscd.socket active
    If the pcscd socket is not active, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
