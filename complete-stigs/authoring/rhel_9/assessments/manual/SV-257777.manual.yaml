assessment:
  id: SV-257777.manual
  version: 1
  assessment_title: RHEL 9 must be a vendor-supported release.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the version or RHEL 9 is vendor supported with the following command: $ cat /etc/redhat-release Red Hat
    Enterprise Linux release 9.6 (Plow) If the installed version of RHEL 9 is not supported, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
