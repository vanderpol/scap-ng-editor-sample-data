assessment:
  id: SV-258089.manual
  version: 1
  assessment_title: RHEL 9 fapolicy module must be installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 fapolicyd package is installed with the following command: $ dnf list --installed fapolicyd
    Example output: fapolicyd.x86_64 1.1-103.el9_0 If the "fapolicyd" package is not installed, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
