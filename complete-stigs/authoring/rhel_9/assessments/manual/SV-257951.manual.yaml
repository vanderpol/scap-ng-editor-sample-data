assessment:
  id: SV-257951.manual
  version: 1
  assessment_title: RHEL 9 must be configured to prevent unrestricted mail relaying.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If postfix is not installed, this is Not Applicable. Verify RHEL 9 is configured to prevent unrestricted mail
    relaying with the following command: $ postconf -n smtpd_client_restrictions smtpd_client_restrictions = permit_mynetworks,reject
    If the "smtpd_client_restrictions" parameter contains any entries other than "permit_mynetworks" and "reject", and the
    additional entries have not been documented with the information system security officer (ISSO), this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
