assessment:
  id: SV-257825.manual
  version: 1
  assessment_title: RHEL 9 subscription-manager package must be installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system is not an internet connected system, this requirement is not applicable. Verify that RHEL
    9 subscription-manager package is installed with the following command: $ dnf list --installed subscription-manager Example
    output: subscription-manager.x86_64 1.29.26-3.el9_0 If the "subscription-manager" package is not installed, this is a
    finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
