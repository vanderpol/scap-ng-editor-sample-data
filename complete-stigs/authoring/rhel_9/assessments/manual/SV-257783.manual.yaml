assessment:
  id: SV-257783.manual
  version: 1
  assessment_title: RHEL 9 systemd-journald service must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that "systemd-journald" is active with the following command: $ systemctl is-active systemd-journald
    active If the systemd-journald service is not active, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
