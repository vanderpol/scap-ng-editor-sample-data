assessment:
  id: SV-258042.manual
  version: 1
  assessment_title: RHEL 9 user account passwords must have a 60-day maximum password lifetime restriction.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the maximum time period for existing passwords is restricted to 60 days with the following commands:
    $ sudo awk -F: ''$5 > 60 {printf "%s %d\n", $1, $5}'' /etc/shadow $ sudo awk -F: ''$5 <= 0 {printf "%s %d\n", $1, $5}''
    /etc/shadow If any results are returned that are not associated with a system account, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
