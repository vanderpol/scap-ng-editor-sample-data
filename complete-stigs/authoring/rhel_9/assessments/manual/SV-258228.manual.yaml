assessment:
  id: SV-258228.manual
  version: 1
  assessment_title: RHEL 9 audit system must protect logon UIDs from unauthorized change.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the audit system prevents unauthorized changes to logon UIDs with the following command: $ sudo grep
    -i immutable /etc/audit/audit.rules --loginuid-immutable If the "--loginuid-immutable" option is not returned in the "/etc/audit/audit.rules",
    or the line is commented out, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
