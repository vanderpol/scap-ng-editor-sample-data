assessment:
  id: SV-258169.manual
  version: 1
  assessment_title: RHEL 9 must produce audit records containing information to establish the identity of any individual or
    process associated with the event.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 audit system is configured to resolve audit information before writing to disk, with the
    following command: $ sudo grep log_format /etc/audit/auditd.conf log_format = ENRICHED If the "log_format" option is not
    "ENRICHED", or the line is commented out, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
