assessment:
  id: SV-257950.manual
  version: 1
  assessment_title: RHEL 9 must not have unauthorized IP tunnels configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 does not have unauthorized IP tunnels configured. Determine if the "IPsec" service is active
    with the following command: $ systemctl is-active ipsec Inactive If the "IPsec" service is active, check for configured
    IPsec connections ("conn"), with the following command: $ sudo grep -rni conn /etc/ipsec.conf /etc/ipsec.d/ Verify any
    returned results are documented with the ISSO. If the IPsec tunnels are active and not approved, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
