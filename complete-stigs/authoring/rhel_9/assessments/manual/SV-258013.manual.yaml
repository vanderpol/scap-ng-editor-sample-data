assessment:
  id: SV-258013.manual
  version: 1
  assessment_title: RHEL 9 must prevent a user from overriding the banner-message-enable setting for the graphical user interface.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify RHEL 9
    prevents a user from overriding settings for graphical user interfaces. Determine if the org.gnome.login-screen banner-message-enable
    key is writable with the following command: $ gsettings writable org.gnome.login-screen banner-message-enable false If
    "banner-message-enable" is writable or the result is "true", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
