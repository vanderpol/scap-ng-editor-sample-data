assessment:
  id: SV-258017.manual
  version: 1
  assessment_title: RHEL 9 must prevent a user from overriding the disabling of the graphical user interface autorun function.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify RHEL 9
    disables ability of the user to override the graphical user interface autorun setting. Check that the autorun setting
    is set to prevent user modification with the following command: $ gsettings writable org.gnome.desktop.media-handling
    autorun-never false If "autorun-never" is writable, the result is "true". If this is not documented with the information
    system security officer (ISSO) as an operational requirement, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
