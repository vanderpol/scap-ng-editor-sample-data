assessment:
  id: SV-257885.manual
  version: 1
  assessment_title: RHEL 9 /var/log directory must have mode 0755 or less permissive.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the "/var/log" directory has a mode of "0755" or less permissive with the following command: $ stat
    -c ''%a %n'' /var/log 755 /var/log If "/var/log" does not have a mode of "0755" or less permissive, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
