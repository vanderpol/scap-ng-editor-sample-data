assessment:
  id: SV-257796.manual
  version: 1
  assessment_title: RHEL 9 must enable auditing of processes that start prior to the audit daemon.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that GRUB 2 is configured to enable auditing of processes that start prior to the audit daemon with the
    following commands: Check that the current GRUB 2 configuration enables auditing: $ sudo grubby --info=ALL | grep args
    | grep -v ''audit=1'' If any output is returned, this is a finding. Check that auditing is enabled by default to persist
    in kernel updates: $ grep audit /etc/default/grub GRUB_CMDLINE_LINUX="audit=1" If "audit" is not set to "1", is missing,
    or is commented out, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
