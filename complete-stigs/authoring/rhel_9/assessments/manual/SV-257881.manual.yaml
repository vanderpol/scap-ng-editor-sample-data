assessment:
  id: SV-257881.manual
  version: 1
  assessment_title: RHEL 9 must prevent special devices on non-root local partitions.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify all nonroot local partitions are mounted with the "nodev" option with the following command: $ sudo mount
    | grep ''^/dev\S* on /\S'' | grep --invert-match ''nodev'' If any output is produced, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
