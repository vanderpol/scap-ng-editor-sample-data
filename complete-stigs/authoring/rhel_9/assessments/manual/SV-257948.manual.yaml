assessment:
  id: SV-257948.manual
  version: 1
  assessment_title: RHEL 9 systems using Domain Name Servers (DNS) resolution must have at least two name servers configured.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the system is running in a cloud platform and the cloud provider gives a single, highly available IP
    address for DNS configuration, this control is Not Applicable. Verify the name servers used by the system with the following
    command: $ grep nameserver /etc/resolv.conf nameserver 192.168.1.2 nameserver 192.168.1.3 If fewer than two lines are
    returned that are not commented out, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
