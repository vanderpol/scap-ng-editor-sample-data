assessment:
  id: SV-258100.manual
  version: 1
  assessment_title: RHEL 9 system-auth must be configured to use a sufficient number of hashing rounds.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the number of rounds for the password hashing algorithm is configured with the following command: $ sudo
    grep rounds /etc/pam.d/system-auth password sufficient pam_unix.so sha512 rounds=100000 If a matching line is not returned
    or "rounds" is less than 100000, this a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
