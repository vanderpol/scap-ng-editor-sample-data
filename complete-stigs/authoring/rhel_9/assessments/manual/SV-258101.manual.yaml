assessment:
  id: SV-258101.manual
  version: 1
  assessment_title: RHEL 9 must enforce password complexity rules for the root account.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 enforces password complexity rules for the root account. Check if root user is required to
    use complex passwords with the following command: $ grep enforce_for_root /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    /etc/security/pwquality.conf:enforce_for_root If "enforce_for_root" is commented or missing, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
