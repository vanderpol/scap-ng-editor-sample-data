assessment:
  id: SV-257826.manual
  version: 1
  assessment_title: RHEL 9 must not have a File Transfer Protocol (FTP) server package installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 does not have an FTP server package installed with the following command: $ sudo dnf list --installed
    | grep vsftpd If the "vsftpd" package is installed, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
