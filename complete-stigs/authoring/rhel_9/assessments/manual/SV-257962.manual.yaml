assessment:
  id: SV-257962.manual
  version: 1
  assessment_title: RHEL 9 must use reverse path filtering on all IPv4 interfaces.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 uses reverse path filtering on all IPv4 interfaces. Check the value of the "rp_filter" variable
    with the following command: $ sudo sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.all.rp_filter = 1 If "net.ipv4.conf.all.rp_filter"
    is not set to "1" or is missing, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
