assessment:
  id: SV-257956.manual
  version: 1
  assessment_title: There must be no .shosts files on RHEL 9.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify there are no ".shosts" files on RHEL 9 with the following command: $ sudo find / -name .shosts If a ".shosts"
    file is found, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
