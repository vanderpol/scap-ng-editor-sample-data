assessment:
  id: SV-257818.manual
  version: 1
  assessment_title: The kdump service on RHEL 9 must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that the kdump service is disabled in system boot configuration with the following command: $ sudo systemctl
    is-enabled kdump disabled Verify that the kdump service is not active (i.e., not running) through current runtime configuration
    with the following command: $ sudo systemctl is-active kdump masked Verify that the kdump service is masked with the following
    command: $ sudo systemctl show kdump | grep "LoadState\|UnitFileState" LoadState=masked UnitFileState=masked If the "kdump"
    service is loaded or active, and is not masked, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
