assessment:
  id: SV-258045.manual
  version: 1
  assessment_title: RHEL 9 duplicate User IDs (UIDs) must not exist for interactive users.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 contains no duplicate UIDs for interactive users with the following command: $ sudo awk -F
    ":" ''list[$3]++{print $1, $3}'' /etc/passwd If output is produced and the accounts listed are interactive user accounts,
    this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
