assessment:
  id: SV-257965.manual
  version: 1
  assessment_title: RHEL 9 must use a reverse-path filter for IPv4 network traffic when possible by default.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 uses reverse path filtering on IPv4 interfaces. Check the value of the "net.ipv4.conf.default.rp_filter"
    with the following command: $ sudo sysctl net.ipv4.conf.default.rp_filter net.ipv4.conf.default.rp_filter = 1 If the returned
    line does not have a value of "1", or a line is not returned, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
