assessment:
  id: SV-257850.manual
  version: 1
  assessment_title: RHEL 9 must prevent device files from being interpreted on file systems that contain user home directories.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/home" is mounted with the "nodev" option with the following command: Note: If a separate file system
    has not been created for the user home directories (user home directories are mounted under "/"), this is automatically
    a finding, as the "nodev" option cannot be used on the "/" system. $ mount | grep /home tmpfs on /home type xfs (rw,nodev,nosuid,noexec,seclabel)
    If the "/home" file system is mounted without the "nodev" option, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
