assessment:
  id: SV-257913.manual
  version: 1
  assessment_title: RHEL 9 /etc/shadow- file must be group-owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the group ownership of the "/etc/shadow-" file with the following command: $ sudo stat -c "%G %n" /etc/shadow-
    root /etc/shadow- If "/etc/shadow-" file does not have a group owner of "root", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
