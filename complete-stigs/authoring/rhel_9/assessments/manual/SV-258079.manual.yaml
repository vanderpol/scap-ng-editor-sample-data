assessment:
  id: SV-258079.manual
  version: 1
  assessment_title: RHEL 9 must enable the SELinux targeted policy.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the SELINUX on RHEL 9 is using the targeted policy with the following command: $ sestatus | grep "policy
    name" Loaded policy name: targeted If the loaded policy name is not "targeted", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
