assessment:
  id: SV-258048.manual
  version: 1
  assessment_title: All RHEL 9 interactive users must have a primary group that exists.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that all RHEL 9 interactive users have a valid GID. Check that the interactive users have a valid GID
    with the following command: $ sudo pwck -r If pwck reports "no group" for any interactive user, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
