assessment:
  id: SV-257872.manual
  version: 1
  assessment_title: RHEL 9 must mount /var/log with the nosuid option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/var/log" is mounted with the "nosuid" option: $ mount | grep /var/log /dev/mapper/rhel-var-log on /var/log
    type xfs (rw,nodev,nosuid,noexec,seclabel) If the "/var/log" file system is mounted without the "nosuid" option, this
    is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
