assessment:
  id: SV-257844.manual
  version: 1
  assessment_title: RHEL 9 must use a separate file system for /tmp.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that a separate file system/partition has been created for "/tmp" with the following command: $ mount
    | grep /tmp /dev/mapper/rhel-tmp on /tmp type xfs (rw,nodev,nosuid,noexec,seclabel) If a separate entry for "/tmp" is
    not in use, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
