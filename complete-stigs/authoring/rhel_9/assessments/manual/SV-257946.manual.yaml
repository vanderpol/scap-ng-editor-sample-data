assessment:
  id: SV-257946.manual
  version: 1
  assessment_title: RHEL 9 must disable the chrony daemon from acting as a server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: If the server is serving as an NTP server, this is not applicable. Verify RHEL 9 disables the chrony daemon
    from acting as a server with the following command: $ grep -w port /etc/chrony.conf port 0 If the "port" option is not
    set to "0", is commented out, or is missing, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
