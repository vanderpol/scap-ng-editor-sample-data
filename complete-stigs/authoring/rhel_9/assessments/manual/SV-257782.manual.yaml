assessment:
  id: SV-257782.manual
  version: 1
  assessment_title: RHEL 9 must enable the hardware random number generator entropy gatherer service.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: For RHEL 9 systems running with kernel FIPS mode enabled as specified by RHEL-09-671010, this requirement
    is Not Applicable. Verify that RHEL 9 has enabled the hardware random number generator entropy gatherer service with the
    following command: $ systemctl is-active rngd active If the "rngd" service is not active, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
