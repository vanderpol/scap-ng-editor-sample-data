assessment:
  id: SV-257888.manual
  version: 1
  assessment_title: RHEL 9 permissions of cron configuration files and directories must not be modified from the operating
    system defaults.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Run the following command to verify that the owner, group, and mode of cron configuration files and directories
    match the operating system defaults: $ rpm --verify cronie crontabs | awk ''! ($2 == "c" && $1 ~ /^.\..\.\.\.\..\./) {print
    $0}'' If the command returns any output, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
