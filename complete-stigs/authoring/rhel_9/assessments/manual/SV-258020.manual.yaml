assessment:
  id: SV-258020.manual
  version: 1
  assessment_title: RHEL 9 must prevent a user from overriding the disabling of the graphical user smart card removal action.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Note: This requirement assumes the use of the RHEL 9 default graphical user interface, the GNOME desktop environment.
    If the system does not have any graphical user interface installed, this requirement is Not Applicable. Verify RHEL 9
    disables ability of the user to override the smart card removal action setting. $ gsettings writable org.gnome.settings-daemon.peripherals.smartcard
    removal-action false If "removal-action" is writable and the result is "true", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
