assessment:
  id: SV-257781.manual
  version: 1
  assessment_title: The graphical display manager must not be the default target on RHEL 9 unless approved.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 is configured to boot to the command line: $ systemctl get-default multi-user.target If the
    system default target is not set to "multi-user.target" and the information system security officer (ISSO) lacks a documented
    requirement for a graphical user interface, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
