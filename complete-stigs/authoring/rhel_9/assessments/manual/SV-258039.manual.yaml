assessment:
  id: SV-258039.manual
  version: 1
  assessment_title: RHEL 9 Bluetooth must be disabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 disables the ability to load the Bluetooth kernel module with the following command: $ sudo
    grep -r bluetooth /etc/modprobe.conf /etc/modprobe.d/* install bluetooth /bin/false blacklist bluetooth If the command
    does not return any output, or the lines are commented out, and use of Bluetooth is not documented with the information
    system security officer (ISSO) as an operational requirement, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
