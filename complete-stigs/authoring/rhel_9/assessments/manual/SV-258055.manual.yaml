assessment:
  id: SV-258055.manual
  version: 1
  assessment_title: RHEL 9 must automatically lock the root account until the root account is released by an administrator
    when three unsuccessful logon attempts occur during a 15-minute time period.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to lock the root account after three unsuccessful logon attempts with the command:
    $ sudo grep even_deny_root /etc/security/faillock.conf even_deny_root If the "even_deny_root" option is not set or is
    missing or commented out, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
