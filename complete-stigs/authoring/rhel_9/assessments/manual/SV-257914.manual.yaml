assessment:
  id: SV-257914.manual
  version: 1
  assessment_title: RHEL 9 /var/log directory must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the "/var/log" directory is owned by root with the following command: $ stat -c "%U %n" /var/log root
    /var/log If "/var/log" does not have an owner of "root", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
