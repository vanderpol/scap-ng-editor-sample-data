assessment:
  id: SV-257982.manual
  version: 1
  assessment_title: RHEL 9 must log SSH connection attempts and failures to the server.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 logs SSH connection attempts and failures to the server. Check what the SSH daemon''s "LogLevel"
    option is set to with the following command: $ sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r''
    | tr ''\n'' '' '' | xargs sudo grep -iH ''^\s*loglevel'' LogLevel VERBOSE If a value of "VERBOSE" is not returned or the
    line is commented out or missing, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
