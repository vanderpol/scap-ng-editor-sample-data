assessment:
  id: SV-257957.manual
  version: 1
  assessment_title: RHEL 9 must be configured to use TCP syncookies.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is configured to use IPv4 TCP syncookies. Check the value of all "tcp_syncookies" variables with
    the following command: $ sudo sysctl net.ipv4.tcp_syncookies net.ipv4.tcp_syncookies = 1 If the network parameter "ipv4.tcp_syncookies"
    is not equal to "1" or nothing is returned, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
