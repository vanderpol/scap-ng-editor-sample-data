assessment:
  id: SV-257935.manual
  version: 1
  assessment_title: RHEL 9 must have the firewalld package installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Run the following command to determine if the firewalld package is installed with the following command: $ dnf
    list --installed firewalld Example output: firewalld.noarch 1.0.0-4.el9 If the "firewall" package is not installed, this
    is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
