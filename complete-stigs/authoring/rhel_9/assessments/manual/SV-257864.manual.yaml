assessment:
  id: SV-257864.manual
  version: 1
  assessment_title: RHEL 9 must mount /dev/shm with the noexec option.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify "/dev/shm" is mounted with the "noexec" option with the following command: $ findmnt /dev/shm /dev/shm
    tmpfs tmpfs rw,nodev,nosuid,noexec,seclabel If the mount options for /dev/shm does not include noexec, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
