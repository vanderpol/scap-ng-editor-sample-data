assessment:
  id: SV-258086.manual
  version: 1
  assessment_title: RHEL 9 must require users to reauthenticate for privilege escalation.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that "/etc/sudoers" has no occurrences of "!authenticate" with the following command: $ sudo egrep -iR
    ''!authenticate'' /etc/sudoers /etc/sudoers.d/ If any occurrences of "!authenticate" are returned, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
