assessment:
  id: SV-258230.manual
  version: 1
  assessment_title: RHEL 9 must enable FIPS mode.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 is in FIPS mode with the following command: $ cat /proc/sys/crypto/fips_enabled 1 If the command
    does not return "1", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
