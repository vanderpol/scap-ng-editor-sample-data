assessment:
  id: SV-258081.manual
  version: 1
  assessment_title: RHEL 9 must have policycoreutils package installed.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify RHEL 9 has the policycoreutils package installed with the following command: $ dnf list --installed policycoreutils
    Example output: policycoreutils.x86_64 3.3-6.el9_0 If the "policycoreutils" package is not installed, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
