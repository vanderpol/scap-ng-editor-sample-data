assessment:
  id: SV-258049.manual
  version: 1
  assessment_title: RHEL 9 must disable account identifiers (individuals, groups, roles, and devices) after 35 days of inactivity.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that RHEL 9 account identifiers (individuals, groups, roles, and devices) are disabled after 35 days
    of inactivity with the following command: Check the account inactivity value by performing the following command: $ sudo
    grep -i inactive /etc/default/useradd INACTIVE=35 If "INACTIVE" is set to "-1", a value greater than "35", or is commented
    out, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
