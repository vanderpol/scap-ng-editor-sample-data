rule:
  id: SV-253360
  version: r991589
  title: Insecure logons to an SMB server must be disabled.
  severity: medium
  role: full
  weight: 10.0
  discussion: Insecure guest logons allow unauthenticated access to shared folders. Shared resources on a system must require
    authentication to establish proper access.
