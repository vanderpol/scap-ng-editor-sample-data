    value: WN11-AU-000040
  - scheme: vulnerability
    value: V-253310
  - scheme: cci
    value: CCI-001403
  references:
  - title: DPMS Target Microsoft Windows 11
    publisher: DISA
    type: DPMS Target
    subject: Microsoft Windows 11
    identifier: '5471'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  remediation:
    guidance: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Advanced Audit
      Policy Configuration >> System Audit Policies >> Account Management >> "Audit User Account Management" with "Success"
      selected.
