assessment:
  id: SV-253344.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit Other Policy Change Events Failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Use the AuditPol tool to review the current Audit Policy configuration: Open a Command Prompt with elevated
    privileges ("Run as Administrator"). Enter "AuditPol /get /category:*". Compare the AuditPol settings with the following.
    If the system does not audit the following, this is a finding: Policy Change >> Other Policy Change Events - Failure'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
