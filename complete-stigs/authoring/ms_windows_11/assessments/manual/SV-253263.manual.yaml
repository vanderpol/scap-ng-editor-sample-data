assessment:
  id: SV-253263.manual
  version: 1
  assessment_title: Windows 11 systems must be maintained at a supported servicing level.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Run "winver.exe". If the "About Windows" dialog box does not display "Microsoft Windows 11 Version 22H2 (OS Build
    22621.380)" or greater, this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
