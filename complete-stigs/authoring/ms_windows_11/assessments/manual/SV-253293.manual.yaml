assessment:
  id: SV-253293.manual
  version: 1
  assessment_title: The system must notify the user when a Bluetooth device attempts to connect.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: This is NA if the system does not have Bluetooth, or if Bluetooth is turned off per the organizations policy.
    Search for "Bluetooth". View Bluetooth Settings. Select "More Bluetooth Options" If "Alert me when a new Bluetooth device
    wants to connect" is not checked, this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
