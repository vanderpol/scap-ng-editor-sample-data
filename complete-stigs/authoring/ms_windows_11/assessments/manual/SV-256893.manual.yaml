assessment:
  id: SV-256893.manual
  version: 1
  assessment_title: Internet Explorer must be disabled for Windows 11.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine if IE11 is installed or enabled on Windows 11 semi-annual channel. If IE11 is installed or not disabled
    on Windows 11 semi-annual channel, this is a finding. If IE11 is installed on an unsupported operating system and is enabled
    or installed, this is a finding. For more information, visit: https://learn.microsoft.com/en-us/lifecycle/faq/internet-explorer-microsoft-edge#what-is-the-lifecycle-policy-for-internet-explorer-'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
