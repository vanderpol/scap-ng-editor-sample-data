assessment:
  id: SV-253257.manual
  version: 1
  assessment_title: Secure Boot must be enabled on Windows 11 systems.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the system firmware is configured for Secure Boot. Run "System Information". Under "System Summary", if
    "Secure Boot State" does not display "On", this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
