assessment:
  id: SV-253284.manual
  version: 1
  assessment_title: Structured Exception Handling Overwrite Protection (SEHOP) must be enabled.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify SEHOP is turned on. If the following registry value does not exist or is not configured as specified,
    this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Session Manager\kernel\
    Value Name: DisableExceptionChainValidation Value Type: REG_DWORD Value: 0x00000000 (0)'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
