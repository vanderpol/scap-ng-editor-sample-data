assessment:
  id: SV-278928.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit handle manipulation failures.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Audit Handle Manipulation auditing has been enabled: Computer Configuration >> Windows Settings
    >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit Handle
    Manipulation. If "Audit Handle Manipulation" is not set to "Failure", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
