assessment:
  id: SV-253277.manual
  version: 1
  assessment_title: Simple TCP/IP Services must not be installed on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify Simple TCP/IP Services has not been installed. Run "Services.msc". If "Simple TCP/IP Services" is listed,
    this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
