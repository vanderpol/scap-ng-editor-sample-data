assessment:
  id: SV-278932.manual
  version: 1
  assessment_title: Windows 11 must be configured to audit sensitive privilege use successes.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify that Audit Sensitive Privilege Use auditing has been enabled: Computer Configuration >> Windows Settings
    >> Security Settings >> Advanced Audit Policy Configuration >> System Audit Policies >> Privilege Use >> Audit Sensitive
    Privilege Use. If "Audit Sensitive Privilege Use" is not set to "Success", this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
