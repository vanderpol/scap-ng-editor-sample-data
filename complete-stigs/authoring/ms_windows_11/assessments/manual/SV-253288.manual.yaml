assessment:
  id: SV-253288.manual
  version: 1
  assessment_title: The Server Message Block (SMB) v1 protocol must be disabled on the SMB client.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Different methods are available to disable SMBv1 on Windows 11, if WN11-00-000160is configured, this is NA.
    If the following registry value is not configured as specified, this is a finding: Registry Hive: HKEY_LOCAL_MACHINE Registry
    Path: \SYSTEM\CurrentControlSet\Services\mrxsmb10\ Value Name: Start Type: REG_DWORD Value: 0x00000004 (4)'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
