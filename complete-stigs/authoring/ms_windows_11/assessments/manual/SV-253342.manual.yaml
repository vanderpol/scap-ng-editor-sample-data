assessment:
  id: SV-253342.manual
  version: 1
  assessment_title: Windows 11 permissions for the System event log must prevent access by non-privileged accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the permissions on the System event log (System.evtx). Standard user accounts or groups must not have
    access. The default permissions listed below satisfy this requirement. Eventlog - Full Control SYSTEM - Full Control Administrators
    - Full Control The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory. They may have been moved to
    another folder. If the permissions for these files are not as restrictive as the ACLs listed, this is a finding. Note:
    If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES" has Special Permissions, this would not be a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
