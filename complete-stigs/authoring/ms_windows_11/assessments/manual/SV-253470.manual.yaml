assessment:
  id: SV-253470.manual
  version: 1
  assessment_title: Windows 11 must use multifactor authentication for local and network access to privileged and nonprivileged
    accounts.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: If the system is not a member of a domain, this is Not Applicable. If all of the following settings exist and
    are populated, this is not a finding. \HKLM\SOFTWARE\Microsoft\Cryptography\Calais\Readers \HKLM\SOFTWARE\Microsoft\Cryptography\Calais\SmartCards
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
