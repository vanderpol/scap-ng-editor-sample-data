assessment:
  id: SV-288475.manual
  version: 1
  assessment_title: All Wi-Fi Direct adapters must be disabled on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Determine whether any Wi-Fi Direct adapters exist on the system. Open PowerShell with elevated privileges (run
    as administrator). Enter the following command: Get-NetAdapter -InterfaceDescription "Microsoft Wi-Fi Direct*" -IncludeHidden
    If there are no Wi-Fi Direct adapters configured on the system, no adapter information will display. If any Wi-Fi Direct
    adapters are listed, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
