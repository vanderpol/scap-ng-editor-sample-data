assessment:
  id: SV-268317.manual
  version: 1
  assessment_title: Copilot must be disabled for Windows 11.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Run the following PowerShell command as an administrator: Get-AppxPackage -AllUsers | Where-Object { $_.Name
    -like "*Copilot*" } If Microsoft.Copilot displays, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
