assessment:
  id: SV-253276.manual
  version: 1
  assessment_title: Simple Network Management Protocol (SNMP) must not be installed on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify SNMP has not been installed. Navigate to the Windows\System32 directory. If the "SNMP" application exists,
    this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
