assessment:
  id: SV-253266.manual
  version: 1
  assessment_title: Alternate operating systems must not be permitted on the same system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify the system does not include other operating system installations. Run "Advanced System Settings". Select
    the "Advanced" tab. Click the "Settings" button in the "Startup and Recovery" section. If the drop-down list box "Default
    operating system:" shows any operating system other than Windows 11, this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
