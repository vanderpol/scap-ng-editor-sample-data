assessment:
  id: SV-253389.manual
  version: 1
  assessment_title: Enhanced anti-spoofing for facial recognition must be enabled on Windows 11.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures\ (For GPO-managed systems)
    Or Registry Path: \SOFTWARE\Microsoft\Policies\PassportForWork\Biometrics\ (For Intune-managed systems) Value Name: EnhancedAntiSpoofing
    Or Value Name: FacialFeaturesUseEnhancedAntiSpoofing (For Intune-managed systems) Value Type: REG_DWORD Value: 0x00000001
    (1)'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
