assessment:
  id: SV-253254.manual
  version: 1
  assessment_title: Domain-joined systems must use Windows 11 Enterprise Edition 64-bit version.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Verify domain-joined systems are using Windows 11 Enterprise Edition 64-bit version. For standalone systems,
    this is NA. Open "Settings". Select "System", then "About". If "Edition" is not "Windows 11 Enterprise", this is a finding.
    If "System type" is not "64-bit operating system...", this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
