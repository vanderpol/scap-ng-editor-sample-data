assessment:
  id: SV-253289.manual
  version: 1
  assessment_title: The Secondary Logon service must be disabled on Windows 11.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Run "Services.msc". Locate the "Secondary Logon" service. If the "Startup Type" is not "Disabled" or the "Status"
    is "Running", this is a finding.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
