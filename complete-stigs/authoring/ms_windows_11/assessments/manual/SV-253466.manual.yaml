assessment:
  id: SV-253466.manual
  version: 1
  assessment_title: The system must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy\ (For GPO-managed systems)
    Or Registry Path: \SOFTWARE\Microsoft\PolicyManager\current\device\Cryptography!AllowFipsAlgorithmPolicy_ProviderSet (For
    Intune-managed systems) Value Name: Enabled Value Type: REG_DWORD Value: 1 Warning: Clients with this setting enabled
    will not be able to communicate via digitally encrypted or signed protocols with servers that do not support these algorithms.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
