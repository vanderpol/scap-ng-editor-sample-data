assessment:
  id: SV-253392.automated
  version: 18
  assessment_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-test:
      test_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\DataCollection
          name:
            equals: LimitEnhancedDiagnosticDataWindowsAnalytics
        object_title: DataCollection LimitEnhancedDiagnosticDataWindowsAnalytics Setting
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: '1'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
    enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-2-test:
      test_title: Enhanced diagnostic data must be limited to the minimum required to support Windows Analytics.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\DataCollection
          name:
            equals: AllowTelemetry
        object_title: DataCollection AllowTelemetry Setting
      states:
      - value:
          require: at_least_one_exists_and_all_match
          less_than_or_equal: 1
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
  evaluate:
    any:
    - test: enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-test
    - test: enhanced-diagnostic-data-limited-minimum-required-support-windows-analytics-2-test
