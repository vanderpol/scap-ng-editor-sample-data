assessment:
  id: SV-268317.automated
  version: 18
  assessment_title: Copilot must be disabled for Windows 11.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    run-powershell-command-determine-if-copilot-in-use-if-microsoft-test:
      test_title: Run a PowerShell command to determine if copilot is in use. If Microsoft.Copilot displays, this
        is a finding.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Get-AppxPackage
        collect:
          shell: powershell
          command: Get-AppxPackage -AllUsers | Where-Object { $_.Name -like '*Copilot*' }
          pattern: ''
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: none_exist
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: run-powershell-command-determine-if-copilot-in-use-if-microsoft-test
