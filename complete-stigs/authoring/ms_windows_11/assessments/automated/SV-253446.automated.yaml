assessment:
  id: SV-253446.automated
  version: 18
  assessment_title: The Windows message title for the legal notice must be configured.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    windows-dialog-box-title-legal-banner-configured-title-option-1-test:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 1
      capability: windows.registry
      object: legalnoticecaption-setting-object
      states:
      - value:
          require: at_least_one_exists_and_all_match
          matches_regex: DoD Notice and Consent Banner
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
    windows-dialog-box-title-legal-banner-configured-title-option-2-test:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 2
      capability: windows.registry
      object: legalnoticecaption-setting-object
      states:
      - value:
          require: at_least_one_exists_and_all_match
          matches_regex: US Department of Defense Warning Statement
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
    windows-dialog-box-title-legal-banner-configured-title-option-3-test:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 3
      capability: windows.registry
      object: legalnoticecaption-setting-object
      states:
      - value:
          require: at_least_one_exists_and_all_match
          matches_regex: DoW Notice and Consent Banner
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
    windows-dialog-box-title-legal-banner-configured-title-option-4-test:
      test_title: The Windows dialog box title for the legal banner must be configured. Title Option 4
      capability: windows.registry
      object: legalnoticecaption-setting-object
      states:
      - value:
          require: at_least_one_exists_and_all_match
          matches_regex: US Department of War Warning Statement
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
  evaluate:
    any:
    - test: windows-dialog-box-title-legal-banner-configured-title-option-1-test
    - test: windows-dialog-box-title-legal-banner-configured-title-option-2-test
    - test: windows-dialog-box-title-legal-banner-configured-title-option-3-test
    - test: windows-dialog-box-title-legal-banner-configured-title-option-4-test
  shared_objects:
    legalnoticecaption-setting-object:
      capability: windows.registry
      select:
        hive:
          equals: local_machine
        key:
          equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name:
          equals: LegalNoticeCaption
      object_title: LegalNoticeCaption Setting
