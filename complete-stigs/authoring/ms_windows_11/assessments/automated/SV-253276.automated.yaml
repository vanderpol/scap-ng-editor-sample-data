assessment:
  id: SV-253276.automated
  version: 18
  assessment_title: Simple Network Management Protocol (SNMP) must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    snmp-shall-not-installed-test:
      test_title: SNMP Shall Not Be Installed
      capability: windows.service
      object:
        capability: windows.service
        select:
          service_name:
            equals: SNMP
        object_title: SNMP Service
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: snmp-shall-not-installed-test
