assessment:
  id: SV-253370.automated
  version: 18
  assessment_title: Credential Guard must be running on Windows 11 systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    credential-guard-running-on-windows-11-domain-joined-systems-test:
      test_title: Credential Guard must be running on Windows 11 domain-joined systems.
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: DeviceGuard securityservicesrunning
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              classname:
                selection_match: all
                equals: Win32_DeviceGuard
              namespace:
                selection_match: all
                equals: root\Microsoft\Windows\DeviceGuard
          select:
            fields:
              property:
                selection_match: all
                equals: securityservicesrunning
      states:
      - value:
          record:
            fields:
              securityservicesrunning:
                require: at_least_one_exists_and_all_match
                matches_regex: '1'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
  evaluate:
    test: credential-guard-running-on-windows-11-domain-joined-systems-test
