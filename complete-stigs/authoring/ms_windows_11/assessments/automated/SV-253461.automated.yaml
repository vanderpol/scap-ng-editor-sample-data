assessment:
  id: SV-253461.automated
  version: 2
  assessment_title: WN11-SO-000195 - The system must be configured to prevent the storage of the LAN Manager hash
    of passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-security-do-not-store-lan-manager-hash-value-on-test:
      test_title: '''Network security: Do not store LAN Manager hash value on next password change'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: System\CurrentControlSet\Control\Lsa
          name:
            case_insensitive_equals: NoLMHash
        object_title: Check the contents of HKLM\System\CurrentControlSet\Control\Lsa\NoLMHash
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-security-do-not-store-lan-manager-hash-value-on-test
