assessment:
  id: SV-253382.automated
  version: 2
  assessment_title: WN11-CC-000155 - Solicited Remote Assistance must not be allowed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    configure-solicited-remote-assistance-set-disabled-test:
      test_title: '''Configure Solicited Remote Assistance'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
          name:
            equals: fAllowToGetHelp
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: configure-solicited-remote-assistance-set-disabled-test
