assessment:
  id: SV-253365.automated
  version: 2
  assessment_title: WN11-CC-000060 - Connections to non-domain networks when connected to a domain authenticated network
    must be blocked.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    prohibit-connection-non-domain-networks-when-connected-domain-authenticated-network-test:
      test_title: '''Prohibit connection to non-domain networks when connected to domain authenticated network'' is
        set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Windows\WcmSvc\GroupPolicy\
          name:
            equals: fBlockNonDomain
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: prohibit-connection-non-domain-networks-when-connected-domain-authenticated-network-test
