assessment:
  id: SV-253273.automated
  version: 18
  assessment_title: Accounts must be configured to require password expiration.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    accounts-configured-require-password-expiration-test:
      test_title: Accounts must be configured to require password expiration.
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: Enabled Local Accounts with PasswordExpires=False should not exist
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              class:
                selection_match: all
                equals: Win32_Useraccount
              filter:
                selection_match: all
                equals: PasswordExpires=False and LocalAccount=True and Disabled=false
          select:
            fields:
              unique:
                selection_match: all
                equals: Name,PasswordExpires,Disabled,LocalAccount
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: accounts-configured-require-password-expiration-test
