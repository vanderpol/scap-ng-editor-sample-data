assessment:
  id: SV-253482.automated
  version: 2
  assessment_title: WN11-UR-000025 - The "Allow log on locally" user right must only be assigned to the Administrators
    and Users groups.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    allow-log-on-locally-administrators-users-test:
      test_title: Allow log on locally - Administrators, Users
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_INTERACTIVE_LOGON_NAME
        object_title: null
      states:
      - trustee_name:
          equals: ''
      - trustee_name:
          case_insensitive_equals: Administrators
      - trustee_name:
          case_insensitive_equals: Users
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: allow-log-on-locally-administrators-users-test
