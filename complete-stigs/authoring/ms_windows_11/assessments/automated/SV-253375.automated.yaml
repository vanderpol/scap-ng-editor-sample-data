assessment:
  id: SV-253375.automated
  version: 2
  assessment_title: WN11-CC-000105 - Web publishing and online ordering wizards must be prevented from downloading
    a list of providers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    turn-off-internet-download-web-publishing-online-ordering-wizards-set-test:
      test_title: '''Turn off Internet download for Web publishing and online ordering wizards'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
          name:
            equals: NoWebServices
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: turn-off-internet-download-web-publishing-online-ordering-wizards-set-test
