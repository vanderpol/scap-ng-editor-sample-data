assessment:
  id: SV-253358.automated
  version: 2
  assessment_title: WN11-CC-000038 - WDigest Authentication must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    wdigest-authentication-disabled-test:
      test_title: WDigest Authentication is disabled
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest
          name:
            equals: UseLogonCredential
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: wdigest-authentication-disabled-test
