assessment:
  id: SV-253291.automated
  version: 18
  assessment_title: Bluetooth must be turned off unless approved by the organization.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    bluetooth-radio-turned-off-test:
      test_title: Bluetooth radio must be turned off.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\PolicyManager\current\device\Connectivity
          name:
            equals: AllowBluetooth
        object_title: Verify the Bluetooth radio is turned off
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: '0'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
  evaluate:
    test: bluetooth-radio-turned-off-test
