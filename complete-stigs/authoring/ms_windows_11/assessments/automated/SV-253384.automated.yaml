assessment:
  id: SV-253384.automated
  version: 2
  assessment_title: WN11-CC-000170 - The setting to allow Microsoft accounts to be optional for modern style apps
    must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    allow-microsoft-accounts-optional-set-enabled-test:
      test_title: '''Allow Microsoft accounts to be optional'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            equals: MSAOptional
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: allow-microsoft-accounts-optional-set-enabled-test
