assessment:
  id: SV-253447.automated
  version: 2
  assessment_title: WN11-SO-000085 - Caching of logon credentials must be limited.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    interactive-logon-number-previous-logons-cache-set-10-or-less-test:
      test_title: '''Interactive logon: Number of previous logons to cache'' is set to 10 or less'
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
          name:
            case_insensitive_equals: CachedLogonsCount
        object_title: null
      states:
      - and:
        - type:
            equals: string
        - value:
            less_than_or_equal: 10
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: interactive-logon-number-previous-logons-cache-set-10-or-less-test
