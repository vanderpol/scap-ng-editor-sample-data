assessment:
  id: SV-253469.automated
  version: 2
  assessment_title: WN11-SO-000250 - User Account Control must prompt administrators for consent on the secure desktop.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    user-account-control-behavior-elevation-prompt-administrators-in-admin-approval-test:
      test_title: '''User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode''
        is set to ''Prompt for consent on the secure desktop'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            equals: ConsentPromptBehaviorAdmin
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 2
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: user-account-control-behavior-elevation-prompt-administrators-in-admin-approval-test
