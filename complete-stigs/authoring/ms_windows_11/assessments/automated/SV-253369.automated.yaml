assessment:
  id: SV-253369.automated
  version: 18
  assessment_title: Virtualization-Based Security (VBS) must be enabled on Windows 11 with the platform security level
    configured to Secure Boot or Secure Boot with DMA Protection.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    requiredsecurityproperties-should-return-value-2-test:
      test_title: RequiredSecurityProperties should return a value of 2
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: DeviceGuard requiredsecurityproperties
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              classname:
                selection_match: all
                equals: Win32_DeviceGuard
              namespace:
                selection_match: all
                equals: root\Microsoft\Windows\DeviceGuard
          select:
            fields:
              property:
                selection_match: all
                equals: requiredsecurityproperties
      states:
      - value:
          record:
            fields:
              requiredsecurityproperties:
                require: at_least_one_exists_and_all_match
                matches_regex: '2'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    virtualizationbasedsecuritystatus-should-return-value-2-test:
      test_title: VirtualizationBasedSecurityStatus should return a value of 2
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: DeviceGuard virtualizationbasedsecuritystatus
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              classname:
                selection_match: all
                equals: Win32_DeviceGuard
              namespace:
                selection_match: all
                equals: root\Microsoft\Windows\DeviceGuard
          select:
            fields:
              property:
                selection_match: all
                equals: virtualizationbasedsecuritystatus
      states:
      - value:
          record:
            fields:
              virtualizationbasedsecuritystatus:
                require: at_least_one_exists_and_all_match
                matches_regex: '2'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    all:
    - test: requiredsecurityproperties-should-return-value-2-test
    - test: virtualizationbasedsecuritystatus-should-return-value-2-test
