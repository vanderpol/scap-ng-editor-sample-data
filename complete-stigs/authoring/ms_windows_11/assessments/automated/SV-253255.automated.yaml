assessment:
  id: SV-253255.automated
  version: 18
  assessment_title: Windows 11 systems must have a Trusted Platform Module (TPM) enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    windows-have-tpm-ready-use-test:
      test_title: Windows must have TPM and must be ready to use
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: Check for TPM values
        collect:
          module_name: TrustedPlatformModule
          module_id: null
          module_version: null
          verb: Get
          noun: Tpm
          parameters: null
          select:
            fields:
              property:
                selection_match: all
                equals: tpmpresent,tpmready,tpmenabled
      states:
      - value:
          record:
            fields:
              tpmpresent:
                require: at_least_one_exists_and_all_match
                equals: 'True'
              tpmready:
                require: at_least_one_exists_and_all_match
                equals: 'True'
              tpmenabled:
                require: at_least_one_exists_and_all_match
                equals: 'True'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
    windows-tpm-specific-version-should-version-2-0-test:
      test_title: Windows TPM Specific Version should be version 2.0
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: Check for TPM Specific Version
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              classname:
                selection_match: all
                equals: Win32_TPM
              namespace:
                selection_match: all
                equals: root\cimv2\security\microsofttpm
          select:
            fields:
              property:
                selection_match: all
                equals: specversion
      states:
      - value:
          record:
            fields:
              specversion:
                require: at_least_one_exists_and_all_match
                matches_regex: 2\.0
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
  evaluate:
    all:
    - test: windows-have-tpm-ready-use-test
    - test: windows-tpm-specific-version-should-version-2-0-test
