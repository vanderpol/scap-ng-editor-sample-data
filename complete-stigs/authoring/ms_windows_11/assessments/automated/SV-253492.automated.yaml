assessment:
  id: SV-253492.automated
  version: 2
  assessment_title: WN11-UR-000075 - The "Deny log on as a batch job" user right on domain-joined workstations must
    be configured to prevent access from highly privileged domain accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    deny-log-on-as-batch-job-domain-admins-test:
      test_title: Deny log on as a batch job - Domain Admins
      capability: windows.userright
      object: windows-userright-object
      states:
      - trustee_name:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(?i)(.+\\)?Domain Admins$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
    deny-log-on-as-batch-job-enterprise-admins-test:
      test_title: Deny log on as a batch job - Enterprise Admins
      capability: windows.userright
      object: windows-userright-object
      states:
      - trustee_name:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(?i)(.+\\)?Enterprise Admins$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
  evaluate:
    all:
    - test: deny-log-on-as-batch-job-domain-admins-test
    - test: deny-log-on-as-batch-job-enterprise-admins-test
  shared_objects:
    windows-userright-object:
      capability: windows.userright
      select:
        userright:
          equals: SE_DENY_BATCH_LOGON_NAME
      object_title: null
