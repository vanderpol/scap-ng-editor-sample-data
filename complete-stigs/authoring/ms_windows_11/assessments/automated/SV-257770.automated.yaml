assessment:
  id: SV-257770.automated
  version: 1
  assessment_title: WN11-AU-000585 - Windows 11 must have command line process auditing events enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-process-creation-failure-only-test:
      test_title: Audit - Process Creation - Failure only
      capability: windows.auditeventpolicysubcategories
      states:
      - process_creation:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-process-creation-success-failure-test:
      test_title: Audit - Process Creation - Success and Failure
      capability: windows.auditeventpolicysubcategories
      states:
      - process_creation:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-process-creation-failure-only-test
    - test: audit-process-creation-success-failure-test
