assessment:
  id: SV-253319.automated
  version: 2
  assessment_title: WN11-AU-000081 - Windows 11 must be configured to audit Object Access - File Share failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-file-share-set-failure-test:
      test_title: '''Audit File Share'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - file_share:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-file-share-set-success-failure-test:
      test_title: '''Audit File Share'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - file_share:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-file-share-set-failure-test
    - test: audit-file-share-set-success-failure-test
