assessment:
  id: SV-253433.automated
  version: 2
  assessment_title: WN11-SO-000010 - The built-in guest account must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    built-in-guest-variable:
      title: Built-in Guest
      kind: local
      datatype: string
      expression:
        values:
          object:
            capability: windows.sid_sid
            select:
              trustee_sid:
                matches_regex: ^S-1-5-[0-9-]+-501$
            object_title: Built-in Guest SID
            collect:
              include_group: false
              resolve_group: false
          field: trustee_sid
  tests:
    built-in-guest-account-disabled-test:
      test_title: The built-in guest account is disabled.
      capability: windows.user_sid55
      object:
        capability: windows.user_sid55
        select:
          user_sid:
            datatype: string
            value_match: all
            equals:
              variable: built-in-guest-variable
        object_title: Built-in Guest account
      states:
      - enabled:
          require: at_least_one_exists_and_all_match
          equals: false
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: built-in-guest-account-disabled-test
