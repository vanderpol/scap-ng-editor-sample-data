assessment:
  id: SV-253350.automated
  version: 18
  assessment_title: Camera access from the lock screen must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    camera-access-from-lock-screen-disabled-test:
      test_title: Camera access from the lock screen must be disabled.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\Personalization
          name:
            equals: NoLockScreenCamera
        object_title: Prevent enabling lock screen camera
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: '1'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_only_one_matches
  evaluate:
    test: camera-access-from-lock-screen-disabled-test
