assessment:
  id: SV-253363.automated
  version: 18
  assessment_title: Windows 11 must be configured to prioritize ECC Curves with longer key lengths first.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    merged-multi-string-ssl-ecccurves-setting-variable:
      title: Merged Multi-String SSL - EccCurves Setting
      kind: local
      datatype: string
      expression:
        merge:
          values:
            values:
              object:
                capability: windows.registry
                select:
                  hive:
                    equals: local_machine
                  key:
                    equals: SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002\
                  name:
                    equals: EccCurves
                object_title: SSL - EccCurves Setting
              field: value
          delimiter: ''
          sort: document
          order: ascending
  tests:
    prioritize-ecc-curves-longer-key-lengths-first-nistp384-requirement-test:
      test_title: Prioritize ECC Curves with longer key lengths first. NistP384 Requirement
      capability: variable.value
      states:
      - value:
          require: at_least_one_exists_and_all_match
          matches_regex: ^NistP384\s*NistP256$
      reported_elements: all
      variable: merged-multi-string-ssl-ecccurves-setting-variable
      collected_items_require: at_least_one_exists_and_only_one_matches
  evaluate:
    test: prioritize-ecc-curves-longer-key-lengths-first-nistp384-requirement-test
