assessment:
  id: SV-253435.automated
  version: 2
  assessment_title: WN11-SO-000020 - The built-in administrator account must be renamed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    localdomain-administrator-variable:
      title: localdomain\Administrator
      kind: local
      datatype: string
      expression:
        concat:
        - values:
            object: built-in-administrator-sid-object
            field: trustee_domain
        - literal:
            value: \Administrator
            datatype: string
  tests:
    accounts-rename-administrator-account-not-set-administrator-or-localdomain-administrator-test:
      test_title: '''Accounts: Rename administrator account'' is not set to ''Administrator'' or ''localdomain\Administrator'''
      capability: windows.sid_sid
      object: built-in-administrator-sid-object
      states:
      - trustee_name:
          case_insensitive_not_equal: Administrator
      - trustee_name:
          datatype: string
          value_match: all
          case_insensitive_not_equal:
            variable: localdomain-administrator-variable
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    test: accounts-rename-administrator-account-not-set-administrator-or-localdomain-administrator-test
  shared_objects:
    built-in-administrator-sid-object:
      capability: windows.sid_sid
      select:
        trustee_sid:
          matches_regex: ^S-1-5-[0-9-]+-500$
      object_title: Built-in Administrator SID
      collect:
        include_group: false
        resolve_group: false
