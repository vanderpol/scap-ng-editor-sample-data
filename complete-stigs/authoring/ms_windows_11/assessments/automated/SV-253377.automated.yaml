assessment:
  id: SV-253377.automated
  version: 2
  assessment_title: WN11-CC-000115 - Systems must at least attempt device authentication using certificates.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    if-devicepkinitenabled-exists-it-set-1-test:
      test_title: If 'DevicePKInitEnabled' exists, it is set to 1.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
          name:
            equals: DevicePKInitEnabled
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    test: if-devicepkinitenabled-exists-it-set-1-test
