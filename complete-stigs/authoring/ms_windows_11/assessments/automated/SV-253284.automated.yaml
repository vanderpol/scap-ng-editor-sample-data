assessment:
  id: SV-253284.automated
  version: 2
  assessment_title: WN11-00-000150 - Structured Exception Handling Overwrite Protection (SEHOP) must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    sehop-turned-on-properly-configured-test:
      test_title: SEHOP is turned on and properly configured
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Control\Session Manager\kernel
          name:
            equals: DisableExceptionChainValidation
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: sehop-turned-on-properly-configured-test
