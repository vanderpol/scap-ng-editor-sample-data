assessment:
  id: SV-257592.automated
  version: 18
  assessment_title: Windows 11 must not have portproxy enabled or in use.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    windows-11-not-have-portproxy-enabled-or-in-use-test:
      test_title: Windows 11 must not have portproxy enabled or in use.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            matches_regex: SYSTEM\\CurrentControlSet\\Services\\PortProxy\\v.tov.\\.*
          name:
            matches_regex: .*
        object_title: Ensure no portproxies are configured.
      reported_elements: all
      collected_items_require: none_exist
    windows-11-not-have-portproxy-enabled-or-in-use-2-test:
      test_title: Windows 11 must not have portproxy enabled or in use.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp
          name: null
        object_title: Check registry for existence of v4tov4\tcp
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    all:
    - test: windows-11-not-have-portproxy-enabled-or-in-use-test
    - test: windows-11-not-have-portproxy-enabled-or-in-use-2-test
