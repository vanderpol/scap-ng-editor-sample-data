assessment:
  id: SV-253371.automated
  version: 18
  assessment_title: Virtualization-based protection of code integrity must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-securityservicesrunning-includes-value-2-test:
      test_title: Verify SecurityServicesRunning includes a value of 2
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: DeviceGuard SecurityServicesRunning
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              classname:
                selection_match: all
                equals: Win32_DeviceGuard
              namespace:
                selection_match: all
                equals: root\Microsoft\Windows\DeviceGuard
          select:
            fields:
              property:
                selection_match: all
                equals: securityservicesrunning
      states:
      - value:
          record:
            fields:
              securityservicesrunning:
                require: at_least_one_exists_and_all_match
                matches_regex: '2'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verify-securityservicesrunning-includes-value-2-test
