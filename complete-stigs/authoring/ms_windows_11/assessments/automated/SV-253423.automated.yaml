assessment:
  id: SV-253423.automated
  version: 2
  assessment_title: WN11-CC-000370 - The convenience PIN for Windows 11 must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    turn-on-convenience-pin-sign-in-disabled-test:
      test_title: '''Turn on convenience PIN sign-in'' is ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Windows\System
          name:
            equals: AllowDomainPINLogon
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: turn-on-convenience-pin-sign-in-disabled-test
