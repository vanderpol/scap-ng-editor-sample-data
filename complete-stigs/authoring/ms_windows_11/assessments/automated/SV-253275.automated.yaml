assessment:
  id: SV-253275.automated
  version: 2
  assessment_title: WN11-00-000100 - Internet Information System (IIS) or its subcomponents must not be installed
    on a workstation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    internet-information-services-feature-not-installed-test:
      test_title: '''Internet Information Services'' feature is not installed'
      capability: windows.wmi.query
      object:
        capability: windows.wmi.query
        object_title: null
        collect:
          namespace: root\cimv2
          query: SELECT installstate FROM win32_optionalfeature WHERE name = 'IIS-WebServerRole'
      states:
      - result:
          record:
            fields:
              installstate:
                require: at_least_one_exists_and_some_match
                equals: '2'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: all_exist_and_all_match
    internet-information-services-hostable-web-core-feature-not-installed-test:
      test_title: '''Internet Information Services Hostable Web Core'' feature is not installed'
      capability: windows.wmi.query
      object:
        capability: windows.wmi.query
        object_title: null
        collect:
          namespace: root\cimv2
          query: SELECT installstate FROM win32_optionalfeature WHERE name = 'IIS-HostableWebCore'
      states:
      - result:
          record:
            fields:
              installstate:
                require: at_least_one_exists_and_some_match
                equals: '2'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    all:
    - test: internet-information-services-feature-not-installed-test
    - test: internet-information-services-hostable-web-core-feature-not-installed-test
