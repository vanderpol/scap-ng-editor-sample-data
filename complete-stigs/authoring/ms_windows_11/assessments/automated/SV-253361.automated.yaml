assessment:
  id: SV-253361.automated
  version: 2
  assessment_title: WN11-CC-000044 - Internet connection sharing must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    prohibit-use-internet-connection-sharing-on-your-dns-domain-network-test:
      test_title: '''Prohibit use of Internet Connection Sharing on your DNS domain network'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\Network Connections
          name:
            equals: NC_ShowSharedAccessUI
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: prohibit-use-internet-connection-sharing-on-your-dns-domain-network-test
