assessment:
  id: SV-253489.automated
  version: 2
  assessment_title: WN11-UR-000060 - The "Create symbolic links" user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    create-symbolic-links-administrators-test:
      test_title: Create symbolic links - Administrators
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_CREATE_SYMBOLIC_LINK_NAME
        object_title: null
      states:
      - trustee_name:
          equals: ''
      - trustee_name:
          case_insensitive_equals: Administrators
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: create-symbolic-links-administrators-test
