assessment:
  id: SV-253400.automated
  version: 2
  assessment_title: WN11-CC-000255 - The use of a hardware security device with Windows Hello for Business must be
    enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    use-hardware-security-device-set-enabled-or-not-configured-test:
      test_title: '''Use a hardware security device'' is set to ''Enabled'' or ''Not Configured'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\PassportForWork
          name:
            equals: RequireSecurityDevice
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    test: use-hardware-security-device-set-enabled-or-not-configured-test
