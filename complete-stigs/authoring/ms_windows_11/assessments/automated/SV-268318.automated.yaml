assessment:
  id: SV-268318.automated
  version: 18
  assessment_title: Windows 11 systems must use either Group Policy or an approved Mobile Device Management (MDM)
    product to enforce STIG compliance.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    test-ensure-that-at-least-one-gpo-applied-enabled-test:
      test_title: Test to ensure that at least one GPO applied is enabled
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: Computer GPO's applied
        collect:
          module_name: CimCmdlets
          module_id: null
          module_version: null
          verb: Get
          noun: CimInstance
          parameters:
            fields:
              classname:
                selection_match: all
                equals: RSOP_GPLink
              namespace:
                selection_match: all
                equals: ROOT\RSOP\Computer
          select:
            fields:
              property:
                selection_match: all
                equals: appliedOrder,enabled,GPO,SOM
      states:
      - value:
          record:
            fields:
              enabled:
                require: at_least_one_exists_and_all_match
                equals: 'True'
            require: at_least_one_exists_and_some_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    run-powershell-command-determine-if-mobile-device-management-mdm-product-test:
      test_title: Run a PowerShell command to determine if a Mobile Device Management (MDM) product is in use to enforce
        STIG compliance
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: MDM is managing the device
        collect:
          shell: powershell
          command: Get-Service -name IntuneManagementExtension
          pattern: IntuneManagementExtension
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: at_least_one_exists_and_all_match
          matches_regex: Running
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: test-ensure-that-at-least-one-gpo-applied-enabled-test
    - test: run-powershell-command-determine-if-mobile-device-management-mdm-product-test
