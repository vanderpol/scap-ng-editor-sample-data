assessment:
  id: ng.shared.sssd-conf-pam-cert-auth-true
  version: 1
  assessment_title: Linux must enable certificate-based smart card authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    sssd-conf-pam-cert-auth-true-test:
      test_title: 'sssd.conf: pam_cert_auth = True'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/sssd/sssd.conf
                pattern:
                  matches_regex: ^\s*pam_cert_auth\s*=\s*(.*)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: 'sssd.conf: pam_cert_auth'
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/sssd/conf.d
                name:
                  matches_regex: .+
                pattern:
                  matches_regex: ^\s*pam_cert_auth\s*=\s*(.*)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: '/etc/sssd/conf.d: pam_cert_auth'
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          case_insensitive_equals: 'true'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: sssd-conf-pam-cert-auth-true-test
