assessment:
  id: ng.shared.verify-the-boot-loader-password-is-not-set-to-root-admin-or-adminstrator
  version: 1
  assessment_title: Linux must require a unique superuser's name upon booting into single-user and maintenance modes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-boot-loader-password-not-set-root-admin-or-adminstrator-test:
      test_title: Verify the boot loader password is not set to root, admin, or adminstrator.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/grub2.cfg
          pattern:
            matches_regex: ^\n*[\s#]*set\s+superusers="(root|admin|administrator)"
          instance:
            greater_than_or_equal: 1
        object_title: Retrieve any configuration lines containing root, admin, or administrator.
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(root|admin|administrator)$
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: verify-boot-loader-password-not-set-root-admin-or-adminstrator-test
