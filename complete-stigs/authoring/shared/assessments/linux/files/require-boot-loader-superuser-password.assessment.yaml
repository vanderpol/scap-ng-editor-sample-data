assessment:
  id: ng.shared.linux-must-require-a-boot-loader-superuser-password
  version: 1
  assessment_title: Linux must require a boot loader superuser password.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-grub2-cfg-superusers-exists-has-name-test:
      test_title: /etc/grub2.cfg:superusers exists and has a name.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/grub2.cfg
          pattern:
            matches_regex: ^\s*set\s+superusers\s*=\s*"(\S+)"\s*$
          instance:
            greater_than_or_equal: 1
        object_title: /etc/grub2.cfg:superusers
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^\S+$
      reported_elements: all
      collected_items_require: all_exist_and_all_match
    boot-grub2-user-cfg-grub2-password-exists-has-pbkdf2-sha512-test:
      test_title: /boot/grub2/user.cfg:GRUB2_PASSWORD exists and has a PBKDF2/SHA512 password assigned.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /boot/grub2/user.cfg
          pattern:
            matches_regex: ^\s*GRUB2_PASSWORD=(\S+)\b
          instance:
            greater_than_or_equal: 1
        object_title: /boot/grub2/grubenv:kernelopts
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^grub\.pbkdf2\.sha512\.
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    all:
    - test: etc-grub2-cfg-superusers-exists-has-name-test
    - test: boot-grub2-user-cfg-grub2-password-exists-has-pbkdf2-sha512-test
