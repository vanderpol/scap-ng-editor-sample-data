assessment:
  id: ng.shared.etc-dnf-dnf-conf-localpkg-gpgcheck-is-set-to-true-1-or-yes
  version: 1
  assessment_title: Linux must check the GPG signature of locally installed software packages before installation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-dnf-dnf-conf-localpkg-gpgcheck-set-true-1-or-test:
      test_title: '/etc/dnf/dnf.conf: localpkg_gpgcheck is set to True, 1, or yes.'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/dnf/dnf.conf
          pattern:
            matches_regex: ^\s*localpkg_gpgcheck\s*=\s*(\w+)\b\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(True|1|yes)$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-dnf-dnf-conf-localpkg-gpgcheck-set-true-1-or-test
