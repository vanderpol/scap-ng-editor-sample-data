assessment:
  id: ng.shared.etc-audit-auditd-conf-name-format-hostname-fqd-or-numeric
  version: 1
  assessment_title: Linux must label all offloaded audit logs before sending them to the central log server.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-audit-auditd-conf-name-format-hostname-fqd-or-numeric-test:
      test_title: '/etc/audit/auditd.conf: name_format = hostname, fqd or numeric'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/auditd.conf
          pattern:
            matches_regex: (?i)^\s*name_format\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          matches_regex: (?i)^hostname$
      - subexpression:
          matches_regex: (?i)^fqd$
      - subexpression:
          matches_regex: (?i)^numeric$
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-audit-auditd-conf-name-format-hostname-fqd-or-numeric-test
