assessment:
  id: ng.shared.etc-audit-auditd-conf-admin-space-left-5
  version: 1
  assessment_title: Linux must take action when allocated audit record storage volume reaches 95 percent of the audit
    record storage capacity.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-audit-auditd-conf-admin-space-left-5-test:
      test_title: '/etc/audit/auditd.conf: admin_space_left = 5%'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/auditd.conf
          pattern:
            matches_regex: (?i)^\s*admin_space_left\s*=\s*(\S+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: 5%
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-audit-auditd-conf-admin-space-left-5-test
