assessment:
  id: ng.shared.etc-audit-auditd-conf-action-mail-acct-root
  version: 1
  assessment_title: The Linux system administrator (SA) and/or information system security officer (ISSO) (at a minimum)
    must be alerted of an audit processing failure event.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-audit-auditd-conf-action-mail-acct-root-test:
      test_title: '/etc/audit/auditd.conf: action_mail_acct = root'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/auditd.conf
          pattern:
            matches_regex: (?i)^\s*action_mail_acct\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?i)^root$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-audit-auditd-conf-action-mail-acct-root-test
