assessment:
  id: ng.shared.there-are-no-shosts-files-on-the-system
  version: 1
  assessment_title: Linux file systems must not contain .shosts files.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    there-no-shosts-files-on-system-test:
      test_title: There are no .shosts files on the system.
      capability: unix.file
      object:
        capability: unix.file
        select:
          directory:
            equals: /
          name:
            equals: .shosts
        object_title: null
        filesystem: local
        traversal:
          max_depth: null
          recurse: directories
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: there-no-shosts-files-on-system-test
