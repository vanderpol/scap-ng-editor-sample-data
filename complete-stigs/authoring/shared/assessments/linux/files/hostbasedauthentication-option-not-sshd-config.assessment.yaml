assessment:
  id: ng.shared.hostbasedauthentication-option-is-not-set-to-yes-in-etc-ssh-sshd-config
  version: 1
  assessment_title: Linux must not allow a noncertificate trusted host SSH logon to the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    hostbasedauthentication-option-not-set-yes-in-etc-ssh-sshd-config-test:
      test_title: HostbasedAuthentication option is not set to yes in /etc/ssh/sshd_config and /etc/ssh/sshd_config.d/*.conf.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/ssh/sshd_config
                pattern:
                  matches_regex: ^(?i)\s*HostbasedAuthentication\s+(\w+)$
                instance:
                  equals: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/ssh/sshd_config.d
                name:
                  matches_regex: ^.+\.conf$
                pattern:
                  matches_regex: ^(?i)\s*HostbasedAuthentication\s+(\w+)$
                instance:
                  equals: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(no|"no")$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: hostbasedauthentication-option-not-set-yes-in-etc-ssh-sshd-config-test
