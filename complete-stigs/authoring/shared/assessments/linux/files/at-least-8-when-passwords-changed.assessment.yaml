assessment:
  id: ng.shared.at-least-8-characters-must-change-when-passwords-are-changed
  version: 1
  assessment_title: Linux must require the change of at least eight characters when passwords are changed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    at-least-8-characters-change-when-passwords-changed-test:
      test_title: at least 8 characters must change when passwords are changed
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/pwquality.conf
                pattern:
                  matches_regex: ^\s*difok\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/pwquality.conf.d
                name:
                  matches_regex: \.conf$
                pattern:
                  matches_regex: ^\s*difok\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          greater_than_or_equal: 8
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: at-least-8-characters-change-when-passwords-changed-test
