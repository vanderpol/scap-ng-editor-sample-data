assessment:
  id: ng.shared.the-pam-unix-module-is-included-in-system-auth-and-configured-for-100000
  version: 1
  assessment_title: Linux system-auth must be configured to use a sufficient number of hashing rounds.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    pam-unix-module-included-in-system-auth-configured-100000-or-test:
      test_title: The pam_unix module is included in system-auth and configured for 100000 or more rounds.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/pam.d/system-auth
          pattern:
            matches_regex: ^\s*password\s+sufficient\s+pam_unix\.so\s+[^#\n]*\brounds=(\d+)\b
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          greater_than_or_equal: 100000
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: pam-unix-module-included-in-system-auth-configured-100000-or-test
