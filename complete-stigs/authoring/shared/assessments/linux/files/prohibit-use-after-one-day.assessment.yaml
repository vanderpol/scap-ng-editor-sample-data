assessment:
  id: ng.shared.linux-must-prohibit-the-use-of-cached-authenticators-after-one-day
  version: 1
  assessment_title: Linux must prohibit the use of cached authenticators after one day.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-sssd-sssd-conf-cache-credentials-false-test:
      test_title: /etc/sssd/sssd.conf:cache_credentials = false
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/sssd/sssd.conf
                pattern:
                  matches_regex: ^\s*cache_credentials\s*=\s*true\b$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/sssd/conf.d
                name:
                  matches_regex: ^.+\.conf$
                pattern:
                  matches_regex: ^\s*cache_credentials\s*=\s*true\b$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: true
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      reported_elements: all
      collected_items_require: none_exist
    etc-sssd-sssd-conf-offline-credentials-expiration-1-test:
      test_title: /etc/sssd/sssd.conf:offline_credentials_expiration = 1
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/sssd/sssd.conf
                pattern:
                  matches_regex: ^\s*offline_credentials_expiration\s*=\s*(\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/sssd/conf.d
                name:
                  matches_regex: ^.+\.conf$
                pattern:
                  matches_regex: ^\s*offline_credentials_expiration\s*=\s*(\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: 1
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: etc-sssd-sssd-conf-cache-credentials-false-test
    - test: etc-sssd-sssd-conf-offline-credentials-expiration-1-test
