assessment:
  id: ng.shared.etc-crypto-policies-back-ends-openssh-config-macs-use-fips-140-3-validat-e89b1b31
  version: 1
  assessment_title: Linux SSH server must be configured to use only Message Authentication Codes (MACs) employing
    FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH server connections.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-crypto-policies-back-ends-openssh-config-macs-use-fips-test:
      test_title: '/etc/crypto-policies/back-ends/openssh.config: MACs use FIPS 140-3 validated cryptographic hash
        algorithms'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/crypto-policies/back-ends/opensshserver.config
          pattern:
            matches_regex: ^\s*MACs\s+(\S+)\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          equals: hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
      - subexpression:
          equals: '"hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512"'
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-crypto-policies-back-ends-openssh-config-macs-use-fips-test
