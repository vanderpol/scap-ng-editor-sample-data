assessment:
  id: ng.shared.the-chrony-daemon-is-disabled-from-acting-as-a-server
  version: 1
  assessment_title: Linux must disable the chrony daemon from acting as a server.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    chrony-daemon-disabled-from-acting-as-server-test:
      test_title: The chrony daemon is disabled from acting as a server.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/chrony.conf
          pattern:
            matches_regex: ^[ \t]*port[ \t]+(\d+)[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: chrony-daemon-disabled-from-acting-as-server-test
