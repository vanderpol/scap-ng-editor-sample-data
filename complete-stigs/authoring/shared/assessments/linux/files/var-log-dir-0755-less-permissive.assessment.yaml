assessment:
  id: ng.shared.var-log-directory-has-mode-0755-or-less-permissive
  version: 1
  assessment_title: Linux /var/log directory must have mode 0755 or less permissive.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    var-log-directory-has-mode-0755-or-less-permissive-test:
      test_title: /var/log directory has mode 0755 or less permissive.
      capability: unix.file
      object:
        capability: unix.file
        select:
          directory:
            equals: /var/log
          name: null
        object_title: null
        filesystem: all
      states:
      - and:
        - setuid:
            equals: false
        - setgid:
            equals: false
        - sticky:
            equals: false
        - group_write:
            equals: false
        - other_write:
            equals: false
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: var-log-directory-has-mode-0755-or-less-permissive-test
