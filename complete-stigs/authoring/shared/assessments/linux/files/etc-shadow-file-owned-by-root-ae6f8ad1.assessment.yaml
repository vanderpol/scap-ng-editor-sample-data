assessment:
  id: ng.shared.etc-shadow-file-is-owned-by-root-ae6f8ad1
  version: 1
  assessment_title: Linux /etc/shadow file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-shadow-file-owned-by-root-test:
      test_title: /etc/shadow file is owned by root
      capability: unix.file
      object:
        capability: unix.file
        select:
          full_path:
            equals: /etc/shadow
        object_title: null
        filesystem: all
      states:
      - owner_gid:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-shadow-file-owned-by-root-test
