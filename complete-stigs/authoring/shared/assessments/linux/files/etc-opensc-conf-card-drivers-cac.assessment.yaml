assessment:
  id: ng.shared.etc-opensc-conf-card-drivers-cac
  version: 1
  assessment_title: Linux must use the CAC smart card driver.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-opensc-conf-card-drivers-cac-test:
      test_title: '/etc/opensc.conf: card_drivers = cac'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/opensc.conf
          pattern:
            matches_regex: (?i)^\s*card_drivers\s*=(.*);
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?i)\bcac\b
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-opensc-conf-card-drivers-cac-test
