assessment:
  id: ng.shared.etc-audit-auditd-conf-space-left-action-email
  version: 1
  assessment_title: Linux must notify the system administrator (SA) and information system security officer (ISSO)
    (at a minimum) when allocated audit record storage volume reaches 75 percent utilization.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-audit-auditd-conf-space-left-action-email-test:
      test_title: '/etc/audit/auditd.conf: space_left_action = email'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/auditd.conf
          pattern:
            matches_regex: (?i)^\s*space_left_action\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?i)^email$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-audit-auditd-conf-space-left-action-email-test
