assessment:
  id: ng.shared.named-conf-includes-crypto-policy
  version: 1
  assessment_title: Linux must implement DOD-approved encryption in the bind package.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    named-conf-includes-crypto-policy-test:
      test_title: named.conf includes crypto-policy
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/named.conf
          pattern:
            matches_regex: ^\s*include\s+"(.*)"\s*;\s*$
          instance:
            greater_than_or_equal: 1
        object_title: named.conf includes
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: /etc/crypto-policies/back-ends/bind.config
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
  evaluate:
    test: named-conf-includes-crypto-policy-test
