assessment:
  id: ng.shared.etc-security-faillock-conf-dir-var-log-faillock
  version: 1
  assessment_title: Linux must ensure account lockouts persist.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-security-faillock-conf-dir-var-log-faillock-test:
      test_title: '/etc/security/faillock.conf: dir = var/log/faillock'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/security/faillock.conf
          pattern:
            matches_regex: ^\s*dir\s*=\s*(\S+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: /var/log/faillock
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-security-faillock-conf-dir-var-log-faillock-test
