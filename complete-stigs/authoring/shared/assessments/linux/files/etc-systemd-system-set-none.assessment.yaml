assessment:
  id: ng.shared.etc-systemd-system-conf-ctrlaltdelburstaction-is-set-to-none
  version: 1
  assessment_title: Linux must be configured so that the systemd Ctrl-Alt-Delete burst key sequence is disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-systemd-system-conf-ctrlaltdelburstaction-set-none-test:
      test_title: /etc/systemd/system.conf:CtrlAltDelBurstAction is set to none.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/systemd/system.conf
                pattern:
                  matches_regex: ^\s*CtrlAltDelBurstAction\s*=\s*(\S+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/systemd/system.conf.d
                name:
                  matches_regex: ^.+\.conf$
                pattern:
                  matches_regex: ^\s*CtrlAltDelBurstAction\s*=\s*(\S+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: CtrlAltDelBurstAction in /etc/systemd/system.conf and /etc/systemd/system.conf.d/*
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: none
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-systemd-system-conf-ctrlaltdelburstaction-set-none-test
