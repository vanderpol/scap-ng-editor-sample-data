assessment:
  id: ng.shared.boot-grub2-grub-cfg-file-is-group-owned-by-root
  version: 1
  assessment_title: Linux /boot/grub2/grub.cfg file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    boot-grub2-grub-cfg-file-group-owned-by-root-test:
      test_title: /boot/grub2/grub.cfg file is group-owned by root
      capability: unix.file
      object:
        capability: unix.file
        select:
          full_path:
            equals: /boot/grub2/grub.cfg
        object_title: null
        filesystem: all
      states:
      - owner_gid:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: boot-grub2-grub-cfg-file-group-owned-by-root-test
