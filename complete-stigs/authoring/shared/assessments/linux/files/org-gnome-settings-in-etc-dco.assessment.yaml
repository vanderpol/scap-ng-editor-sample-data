assessment:
  id: ng.shared.org-gnome-settings-daemon-plugins-media-keys-logout-is-locked-in-etc-dco
  version: 1
  assessment_title: Linux must prevent a user from overriding the Ctrl-Alt-Del sequence settings for the graphical
    user interface.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    org-gnome-settings-daemon-plugins-media-keys-logout-locked-in-test:
      test_title: /org/gnome/settings-daemon/plugins/media-keys/logout is locked in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/dconf/db/local.d/locks
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^/org/gnome/settings-daemon/plugins/media-keys/logout$
          instance:
            greater_than_or_equal: 1
        object_title: /org/gnome/settings-daemon/plugins/media-keys/logout in /etc/dconf/db/local.d/locks/*
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: org-gnome-settings-daemon-plugins-media-keys-logout-locked-in-test
