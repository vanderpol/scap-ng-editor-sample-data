assessment:
  id: ng.shared.sshd-config-x11uselocalhost-is-set-to-yes
  version: 1
  assessment_title: Linux SSH daemon must prevent remote hosts from connecting to the proxy display.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    sshd-config-x11uselocalhost-set-yes-test:
      test_title: sshd_config X11UseLocalhost is set to yes.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/ssh/sshd_config
                pattern:
                  matches_regex: ^\s*(?i)X11useLocalhost(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  greater_than_or_equal: 1
              object_title: sshd_config X11UseLocalhost
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/ssh/sshd_config.d
                name:
                  matches_regex: ^.+\.conf$
                pattern:
                  matches_regex: ^\s*(?i)X11useLocalhost(?-i)[ \t]+([\w\"]+)[\s]*(?:|(?:#.*))?$
                instance:
                  equals: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: sshd_config X11UseLocalhost
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(yes|"yes")$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: sshd-config-x11uselocalhost-set-yes-test
