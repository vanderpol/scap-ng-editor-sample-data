assessment:
  id: ng.shared.linux-must-be-configured-to-disable-the-firewire-kernel-module
  version: 1
  assessment_title: Linux must be configured to disable the FireWire kernel module.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-modprobe-d-contains-file-that-contains-install-firewire-core-test:
      test_title: /etc/modprobe.d contains a file that contains 'install firewire-core /bin/false'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/modprobe.d
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^[ \t]*install[ \t]+firewire-core[ \t]+/bin/false[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
    etc-modprobe-d-contains-file-that-contains-blacklist-firewire-core-test:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist firewire-core'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/modprobe.d
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^[ \t]*blacklist[ \t]+firewire-core[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
    etc-modprobe-conf-contains-install-firewire-core-bin-false-test:
      test_title: /etc/modprobe.conf contains 'install firewire-core /bin/false'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/modprobe.conf
          pattern:
            matches_regex: ^[ \t]*install[ \t]+firewire-core[ \t]+/bin/false[ \t]*$
          instance:
            equals: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
    etc-modprobe-conf-contains-blacklist-firewire-core-test:
      test_title: /etc/modprobe.conf contains 'blacklist firewire-core'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/modprobe.conf
          pattern:
            matches_regex: ^[ \t]*blacklist[ \t]+firewire-core[ \t]*$
          instance:
            equals: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    any:
    - all:
      - test: etc-modprobe-d-contains-file-that-contains-install-firewire-core-test
      - test: etc-modprobe-d-contains-file-that-contains-blacklist-firewire-core-test
    - all:
      - test: etc-modprobe-conf-contains-install-firewire-core-bin-false-test
      - test: etc-modprobe-conf-contains-blacklist-firewire-core-test
