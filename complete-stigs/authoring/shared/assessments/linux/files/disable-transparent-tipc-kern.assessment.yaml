assessment:
  id: ng.shared.linux-must-disable-the-transparent-inter-process-communication-tipc-kern
  version: 1
  assessment_title: Linux must disable the Transparent Inter Process Communication (TIPC) kernel module.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-modprobe-d-contains-file-that-contains-install-tipc-bin-test:
      test_title: /etc/modprobe.d contains a file that contains 'install tipc /bin/false'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/modprobe.d
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^[ \t]*install[ \t]+tipc[ \t]+/bin/false[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
    etc-modprobe-d-contains-file-that-contains-blacklist-tipc-test:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist tipc'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/modprobe.d
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^[ \t]*blacklist[ \t]+tipc[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    all:
    - test: etc-modprobe-d-contains-file-that-contains-install-tipc-bin-test
    - test: etc-modprobe-d-contains-file-that-contains-blacklist-tipc-test
