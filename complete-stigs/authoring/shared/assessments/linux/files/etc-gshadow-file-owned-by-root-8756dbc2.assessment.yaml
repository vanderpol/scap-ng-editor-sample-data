assessment:
  id: ng.shared.etc-gshadow-file-is-owned-by-root-8756dbc2
  version: 1
  assessment_title: Linux /etc/gshadow file must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-gshadow-file-owned-by-root-test:
      test_title: /etc/gshadow file is owned by root
      capability: unix.file
      object:
        capability: unix.file
        select:
          full_path:
            equals: /etc/gshadow
        object_title: null
        filesystem: all
      states:
      - owner_uid:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-gshadow-file-owned-by-root-test
