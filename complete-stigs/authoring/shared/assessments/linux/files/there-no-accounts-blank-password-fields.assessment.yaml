assessment:
  id: ng.shared.there-are-no-accounts-in-etc-shadow-that-have-blank-password-fields
  version: 1
  assessment_title: Linux must not have accounts configured with blank or null passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    there-no-accounts-in-etc-shadow-that-have-blank-password-test:
      test_title: There are no accounts in /etc/shadow that have blank password fields.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/shadow
          pattern:
            matches_regex: '^[^:]+::[^:]*:[^:]*:'
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: there-no-accounts-in-etc-shadow-that-have-blank-password-test
