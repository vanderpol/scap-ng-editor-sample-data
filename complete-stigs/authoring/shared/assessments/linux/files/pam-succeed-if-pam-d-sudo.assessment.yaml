assessment:
  id: ng.shared.pam-succeed-if-is-not-present-in-etc-pam-d-sudo
  version: 1
  assessment_title: Linux must not be configured to bypass password requirements for privilege escalation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    pam-succeed-if-not-present-in-etc-pam-d-sudo-test:
      test_title: pam_succeed_if is not present in /etc/pam.d/sudo
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/pam.d/sudo
          pattern:
            matches_regex: ^\s*[^#\n]*\bpam_succeed_if\b
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: pam-succeed-if-not-present-in-etc-pam-d-sudo-test
