assessment:
  id: ng.shared.etc-login-defs-encrypt-method-sha512
  version: 1
  assessment_title: Linux must be configured to use the shadow file to store only encrypted representations of passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-login-defs-encrypt-method-sha512-test:
      test_title: /etc/login.defs:ENCRYPT_METHOD >= SHA512
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/login.defs
          pattern:
            matches_regex: ^\s*ENCRYPT_METHOD\s+([^#\r\n]*)
          instance:
            greater_than_or_equal: 1
        object_title: /etc/login.defs:ENCRYPT_METHOD
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: SHA512
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-login-defs-encrypt-method-sha512-test
