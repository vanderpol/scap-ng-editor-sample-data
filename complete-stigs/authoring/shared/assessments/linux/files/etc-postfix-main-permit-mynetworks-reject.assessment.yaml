assessment:
  id: ng.shared.etc-postfix-main-cf-smtpd-client-restrictions-permit-mynetworks-reject
  version: 1
  assessment_title: Linux must be configured to prevent unrestricted mail relaying.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-postfix-main-cf-smtpd-client-restrictions-permit-mynetworks-reject-test:
      test_title: '/etc/postfix/main.cf: smtpd_client_restrictions = permit_mynetworks,reject'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/postfix/main.cf
          pattern:
            matches_regex: ^smtpd_client_restrictions[ \t]*=[ \t]*permit_mynetworks[, \t]+reject[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: etc-postfix-main-cf-smtpd-client-restrictions-permit-mynetworks-reject-test
