assessment:
  id: ng.shared.etc-audit-auditd-conf-freq-1-100
  version: 1
  assessment_title: Linux must periodically flush audit records to disk to prevent the loss of audit records.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-audit-auditd-conf-freq-1-100-test:
      test_title: '/etc/audit/auditd.conf: freq = 1-100'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/auditd.conf
          pattern:
            matches_regex: (?i)^\s*freq\s*=\s*(\S+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          greater_than_or_equal: 1
      - subexpression:
          less_than_or_equal: 100
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-audit-auditd-conf-freq-1-100-test
