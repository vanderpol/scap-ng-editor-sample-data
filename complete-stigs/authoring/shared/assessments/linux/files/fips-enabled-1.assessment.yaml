assessment:
  id: ng.shared.fips-enabled-1
  version: 1
  assessment_title: Linux must enable FIPS mode.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    fips-enabled-1-test:
      test_title: fips_enabled == 1
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /proc/sys/crypto/fips_enabled
          pattern:
            matches_regex: ^(\d+)$
          instance:
            greater_than_or_equal: 1
        object_title: /proc/sys/crypto/fips_enabled
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: 1
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: fips-enabled-1-test
