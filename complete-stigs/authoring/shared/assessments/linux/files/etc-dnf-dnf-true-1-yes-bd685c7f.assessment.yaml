assessment:
  id: ng.shared.etc-dnf-dnf-conf-clean-requirements-on-remove-is-set-to-true-1-or-yes
  version: 1
  assessment_title: Linux must remove all software components after updated versions have been installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-dnf-dnf-conf-clean-requirements-on-remove-set-true-test:
      test_title: '/etc/dnf/dnf.conf: clean_requirements_on_remove is set to True, 1 or yes'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/dnf/dnf.conf
          pattern:
            matches_regex: ^[ \t]*clean_requirements_on_remove[ \t]*=[ \t]*(?:True|1|yes)[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: etc-dnf-dnf-conf-clean-requirements-on-remove-set-true-test
