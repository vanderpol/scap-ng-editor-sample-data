assessment:
  id: ng.shared.etc-chrony-conf-cmdport-option-is-set-to-0
  version: 1
  assessment_title: Linux must disable network management of the chrony daemon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-chrony-conf-cmdport-option-set-0-test:
      test_title: '/etc/chrony.conf: cmdport option is set to 0'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/chrony.conf
          pattern:
            matches_regex: ^[ \t]*cmdport[ \t]+0[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: etc-chrony-conf-cmdport-option-set-0-test
