assessment:
  id: ng.shared.linux-must-audit-all-uses-of-the-truncate-ftruncate-creat-open-openat-an
  version: 1
  assessment_title: Linux must audit all uses of the truncate, ftruncate, creat, open, openat, and open_by_handle_at
    system calls.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-32-bit-invocations-truncate-syscall-exit-eperm-test:
      test_title: Audit 32-bit invocations of truncate syscall with exit EPERM
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/audit.rules
          pattern:
            matches_regex: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+truncate\s+|(\s+|,)truncate(\s+|,))).*-F\s+exit=-EPERM\s+-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
    audit-64-bit-invocations-truncate-syscall-exit-eperm-test:
