assessment:
  id: ng.shared.etc-profile-umask-077
  version: 1
  assessment_title: Linux must define default permissions for the system default profile.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-profile-umask-077-test:
      test_title: /etc/profile:umask == 077
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/profile
          pattern:
            matches_regex: ^(?i)\s*umask\s+([^#\s]+)
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: '077'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-profile-umask-077-test
