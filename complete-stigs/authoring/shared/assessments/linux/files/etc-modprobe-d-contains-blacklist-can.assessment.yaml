assessment:
  id: ng.shared.etc-modprobe-d-contains-a-file-that-contains-blacklist-can
  version: 1
  assessment_title: Linux must be configured to disable the Controller Area Network (CAN) kernel module.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-modprobe-d-contains-file-that-contains-blacklist-can-test:
      test_title: /etc/modprobe.d contains a file that contains 'blacklist can'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/modprobe.d
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^[ \t]*blacklist[ \t]+can[ \t]*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: etc-modprobe-d-contains-file-that-contains-blacklist-can-test
