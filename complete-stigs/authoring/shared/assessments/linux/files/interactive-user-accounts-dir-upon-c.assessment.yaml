assessment:
  id: ng.shared.all-local-interactive-user-accounts-are-assigned-a-home-directory-upon-c
  version: 1
  assessment_title: Linux local interactive user accounts must be assigned a home directory upon creation.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    all-local-interactive-user-accounts-assigned-home-directory-upon-creation-test:
      test_title: All local interactive user accounts are assigned a home directory upon creation
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/login.defs
          pattern:
            matches_regex: ^\s*CREATE_HOME\s+([^#\s]+)
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^(yes|"yes")$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: all-local-interactive-user-accounts-assigned-home-directory-upon-creation-test
