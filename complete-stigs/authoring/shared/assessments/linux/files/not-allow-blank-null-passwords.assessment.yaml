assessment:
  id: ng.shared.linux-must-not-allow-blank-or-null-passwords
  version: 1
  assessment_title: Linux must not allow blank or null passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    there-no-instances-nullok-in-etc-pam-d-system-auth-test:
      test_title: There are no instances of nullok in /etc/pam.d/system-auth.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/pam.d/system-auth
          pattern:
            matches_regex: \bnullok\b
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: none_exist
    there-no-instances-nullok-in-etc-pam-d-password-auth-test:
      test_title: There are no instances of nullok in /etc/pam.d/password-auth.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/pam.d/password-auth
          pattern:
            matches_regex: \bnullok\b
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    all:
    - test: there-no-instances-nullok-in-etc-pam-d-system-auth-test
    - test: there-no-instances-nullok-in-etc-pam-d-password-auth-test
