assessment:
  id: ng.shared.linux-must-audit-all-uses-of-the-setxattr-fsetxattr-lsetxattr-removexatt
  version: 1
  assessment_title: Linux must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and
    lremovexattr system calls.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    pattern-audit-rule-32-bit-invocations-lsetxattr-system-call-variable:
      title: Pattern for audit rule for 32-bit invocations of lsetxattr system call.
      kind: local
      datatype: string
      expression:
        concat:
        - literal: ^\s*-a\s+(?:always,exit|exit,always)
        - literal: \s+-F\s+arch=b32
        - literal: \s+(?:-S\s+[,\w]+\s+)*
        - literal: -S\s+[,\w]*\b
        - literal:
            value: lsetxattr
            datatype: string
        - literal: \b[,\w]*
        - literal: \s+(?:-S\s+[,\w]+\s+)*
        - literal: -F\s+auid>=1000\s+-F\s+auid!=(?:4294967295|-1|unset)
        - literal: (?:\s+(?:-k\s+|-F\s+key=)[-\w]+)*\s*$
    pattern-audit-rule-64-bit-invocations-lsetxattr-system-call-variable:
      title: Pattern for audit rule for 64-bit invocations of lsetxattr system call.
      kind: local
      datatype: string
      expression:
        concat:
        - literal: ^\s*-a\s+(?:always,exit|exit,always)
        - literal: \s+-F\s+arch=b64
        - literal: \s+(?:-S\s+[,\w]+\s+)*
        - literal: -S\s+[,\w]*\b
        - literal:
            value: lsetxattr
            datatype: string
        - literal: \b[,\w]*
        - literal: \s+(?:-S\s+[,\w]+\s+)*
        - literal: -F\s+auid>=1000\s+-F\s+auid!=(?:4294967295|-1|unset)
        - literal: (?:\s+(?:-k\s+|-F\s+key=)[-\w]+)*\s*$
    pattern-audit-rule-32-bit-invocations-lsetxattr-system-call-by-variable:
      title: Pattern for audit rule for 32-bit invocations of lsetxattr system call by root user.
      kind: local
      datatype: string
      expression:
        concat:
        - literal: ^\s*-a\s+(?:always,exit|exit,always)
        - literal: \s+-F\s+arch=b32
        - literal: \s+(?:-S\s+[,\w]+\s+)*
        - literal: -S\s+[,\w]*\b
        - literal:
            value: lsetxattr
            datatype: string
        - literal: \b[,\w]*
        - literal: \s+(?:-S\s+[,\w]+\s+)*
        - literal: -F\s+auid=0
        - literal: (?:\s+(?:-k\s+|-F\s+key=)[-\w]+)*\s*$
    pattern-audit-rule-32-bit-invocations-lsetxattr-system-call-by-2-variable:
