assessment:
  id: ng.shared.linux-must-limit-the-number-of-concurrent-sessions-to-ten-for-all-accoun
  version: 1
  assessment_title: Linux must limit the number of concurrent sessions to ten for all accounts and/or account types.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    limits-conf-limits-d-conf-maxlogins-set-10-or-less-test:
      test_title: limits.conf and limits.d/*.conf:maxlogins is set to 10 or less by default
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/limits.conf
                pattern:
                  matches_regex: ^\s*\*\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: default maxlogins in /etc/security/limits.conf
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/limits.d
                name:
                  matches_regex: .*\.conf$
                pattern:
                  matches_regex: ^\s*\*\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: default maxlogins in /etc/security/limits.d/*.conf
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: all default maxlogins settings in /etc/security/limits.conf and /etc/security/limits.d/*.conf
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          less_than_or_equal: 10
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    limits-conf-limits-d-conf-maxlogins-set-10-or-less-2-test:
      test_title: limits.conf and limits.d/*.conf:maxlogins is set to 10 or less for non-default domains
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/limits.conf
                pattern:
                  matches_regex: ^\s*[^#*\s]+\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: non-default maxlogins in /etc/security/limits.conf
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/limits.d
                name:
                  matches_regex: .*\.conf$
                pattern:
                  matches_regex: ^\s*[^#*\s]+\s+(?:(?:hard)|(?:-))\s+maxlogins\s+(\d+)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: non-default maxlogins in /etc/security/limits.d/*.conf
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: all non-default maxlogins settings in /etc/security/limits.conf and /etc/security/limits.d/*.conf
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          less_than_or_equal: 10
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    all:
    - test: limits-conf-limits-d-conf-maxlogins-set-10-or-less-test
    - test: limits-conf-limits-d-conf-maxlogins-set-10-or-less-2-test
