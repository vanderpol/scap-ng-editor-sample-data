assessment:
  id: ng.shared.etc-security-faillock-conf-fail-interval-900-and-0
  version: 1
  assessment_title: Linux must automatically lock an account when three unsuccessful logon attempts occur during a
    15-minute time period.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-security-faillock-conf-fail-interval-900-0-test:
      test_title: /etc/security/faillock.conf:fail_interval <=900 and !=0
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/security/faillock.conf
          pattern:
            matches_regex: ^\s*fail_interval\s*=\s*([\d]+)\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          less_than_or_equal: 900
      - subexpression:
          not_equal: 0
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-security-faillock-conf-fail-interval-900-0-test
