assessment:
  id: ng.shared.linux-must-clear-the-page-allocator-to-prevent-use-after-free-attacks
  version: 1
  assessment_title: Linux must clear the page allocator to prevent use-after-free attacks.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    bls-options-contain-page-poison-1-test:
      test_title: BLS options contain page_poison=1
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /boot/loader/entries
          name:
            matches_regex: ^.*\.conf$
          pattern:
            matches_regex: ^options\s+(.*)$
          instance:
            greater_than_or_equal: 1
        object_title: BLS options
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (^|\s)page_poison=1(\s|$)
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    etc-default-grub-page-poison-1-test:
      test_title: /etc/default/grub page_poison=1
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/default/grub
          pattern:
            matches_regex: ^GRUB_CMDLINE_LINUX="(.*)"
          instance:
            greater_than_or_equal: 1
        object_title: /etc/default/grub GRUB_CMDLINE_LINUX
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (^|\s)page_poison=1(\s|$)
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    all:
    - test: bls-options-contain-page-poison-1-test
    - test: etc-default-grub-page-poison-1-test
