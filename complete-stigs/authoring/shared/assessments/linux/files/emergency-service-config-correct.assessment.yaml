assessment:
  id: ng.shared.emergency-service-config-correct
  version: 1
  assessment_title: Linux must require authentication to access emergency mode.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    emergency-service-config-correct-test:
      test_title: emergency.service config correct
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /usr/lib/systemd/system/emergency.service
          pattern:
            matches_regex: ^ExecStart=(.*)$
          instance:
            greater_than_or_equal: 1
        object_title: /usr/lib/systemd/system/emergency.service ExecStart
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: -/usr/lib/systemd/systemd-sulogin-shell emergency
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: emergency-service-config-correct-test
