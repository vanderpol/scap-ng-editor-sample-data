assessment:
  id: ng.shared.linux-must-be-configured-so-that-successful-unsuccessful-uses-of-the-umo
  version: 1
  assessment_title: Linux must be configured so that successful/unsuccessful uses of the umount2 system call generate
    an audit record.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-32-bit-invocations-umount2-syscall-test:
      test_title: Audit 32-bit invocations of umount2 syscall
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/audit.rules
          pattern:
            matches_regex: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b32\s+(?:.*(-S\s+umount2\s+|(\s+|,)umount2(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            greater_than_or_equal: 1
        object_title: 32-bit umount2 syscall
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: all_exist
    audit-64-bit-invocations-umount2-syscall-test:
      test_title: Audit 64-bit invocations of umount2 syscall
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/audit/audit.rules
          pattern:
            matches_regex: ^\s*-a\s+(always,exit|exit,always)\s+-F\s+arch=b64\s+(?:.*(-S\s+umount2\s+|(\s+|,)umount2(\s+|,))).*-F\s+auid>=1000\s+-F\s+auid!=(4294967295|-1|unset)(\s+(-k\s+|-F\s+key=)[-\w]+)*\s*$
          instance:
            greater_than_or_equal: 1
        object_title: 64-bit umount2 syscall
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: all_exist
  evaluate:
    all:
    - test: audit-32-bit-invocations-umount2-syscall-test
    - test: audit-64-bit-invocations-umount2-syscall-test
