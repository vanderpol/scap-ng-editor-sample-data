assessment:
  id: ng.shared.linux-must-prevent-a-user-from-overriding-the-disabling-of-the-graphical-76d9c75a
  version: 1
  assessment_title: Linux must prevent a user from overriding the disabling of the graphical user interface automount
    function.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    check-that-etc-dconf-profile-user-system-db-at-minimum-test:
      test_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/dconf/profile/user
          pattern:
            matches_regex: ^\s*system-db\s*:\s*local\s*$
          instance:
            greater_than_or_equal: 1
        object_title: check that /etc/dconf/profile/user:system-db is at minimum set to local
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
    org-gnome-desktop-media-handling-automount-open-in-etc-dconf-test:
      test_title: /org/gnome/desktop/media-handling/automount-open in /etc/dconf/db/local.d/locks/*
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          directory:
            equals: /etc/dconf/db/local.d/locks
          name:
            matches_regex: .*
          pattern:
            matches_regex: ^/org/gnome/desktop/media-handling/automount-open$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    all:
    - test: check-that-etc-dconf-profile-user-system-db-at-minimum-test
    - test: org-gnome-desktop-media-handling-automount-open-in-etc-dconf-test
