assessment:
  id: ng.shared.etc-shadow-file-is-owned-by-root-83d2c6d9
  version: 1
  assessment_title: Linux /etc/shadow file must be owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-shadow-file-owned-by-root-test:
      test_title: /etc/shadow file is owned by root.
      capability: unix.file
      object:
        capability: unix.file
        select:
          directory:
            equals: /etc
          name:
            equals: shadow
        object_title: /etc/shadow file
        filesystem: all
      states:
      - owner_uid:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: etc-shadow-file-owned-by-root-test
