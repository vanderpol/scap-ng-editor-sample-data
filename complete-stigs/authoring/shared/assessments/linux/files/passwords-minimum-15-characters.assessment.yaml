assessment:
  id: ng.shared.passwords-must-have-a-minimum-of-15-characters
  version: 1
  assessment_title: Linux passwords must be created with a minimum of 15 characters.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    passwords-have-minimum-15-characters-test:
      test_title: passwords must have a minimum of 15 characters
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/pwquality.conf
                pattern:
                  matches_regex: ^\s*minlen\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/pwquality.conf.d
                name:
                  matches_regex: \.conf$
                pattern:
                  matches_regex: ^\s*minlen\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          greater_than_or_equal: 15
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: passwords-have-minimum-15-characters-test
