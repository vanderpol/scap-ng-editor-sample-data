assessment:
  id: ng.shared.no-active-password-hash-in-etc-shadow-has-a-prefix-other-than-6
  version: 1
  assessment_title: Linux must employ FIPS 140-3 approved cryptographic hashing algorithms for all stored passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    no-active-password-hash-in-etc-shadow-has-prefix-other-test:
      test_title: No active password hash in /etc/shadow has a prefix other than '$6$'.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/shadow
                pattern:
                  matches_regex: '^[^:]+:([^:]*):'
                instance:
                  greater_than_or_equal: 1
              object_title: Extract password hashes from /etc/shadow.
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters:
            - exclude:
                subexpression:
                  require: at_least_one_exists_and_all_match
                  matches_regex: ^[!*]
            - exclude:
                subexpression:
                  require: at_least_one_exists_and_all_match
                  matches_regex: ^[$][6][$]
        object_title: Filter out acceptable shadow password entries.
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    test: no-active-password-hash-in-etc-shadow-has-prefix-other-test
