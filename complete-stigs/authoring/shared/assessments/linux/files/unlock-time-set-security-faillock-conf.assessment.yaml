assessment:
  id: ng.shared.unlock-time-is-set-to-0-in-etc-security-faillock-conf
  version: 1
  assessment_title: Linux must maintain an account lock until the locked account is released by an administrator.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    unlock-time-set-0-in-etc-security-faillock-conf-test:
      test_title: unlock_time is set to 0 in /etc/security/faillock.conf
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/security/faillock.conf
          pattern:
            matches_regex: ^\s*unlock_time\s*=\s*([\d]+)\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: unlock-time-set-0-in-etc-security-faillock-conf-test
