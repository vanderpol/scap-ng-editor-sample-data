assessment:
  id: ng.shared.the-maximum-number-of-repeating-characters-of-the-same-character-class-b
  version: 1
  assessment_title: Linux must require the maximum number of repeating characters of the same character class be limited
    to four when passwords are changed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    maximum-number-repeating-characters-same-character-class-limited-four-when-test:
      test_title: The maximum number of repeating characters of the same character class be limited to four when passwords
        are changed.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/pwquality.conf
                pattern:
                  matches_regex: ^\s*maxclassrepeat\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/pwquality.conf.d
                name:
                  matches_regex: \.conf$
                pattern:
                  matches_regex: ^\s*maxclassrepeat\s*=\s*(-?\d*)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              traversal:
                max_depth: null
                recurse: symlinks_and_directories
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: null
      states:
      - subexpression:
          less_than_or_equal: 4
      - subexpression:
          greater_than: 0
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: maximum-number-repeating-characters-same-character-class-limited-four-when-test
