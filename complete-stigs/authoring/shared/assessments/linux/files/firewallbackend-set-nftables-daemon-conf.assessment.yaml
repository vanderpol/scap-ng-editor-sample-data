assessment:
  id: ng.shared.firewallbackend-is-set-to-nftables-in-etc-usbguard-usbguard-daemon-conf
  version: 1
  assessment_title: Linux must enable Linux audit logging for the USBGuard daemon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    firewallbackend-set-nftables-in-etc-usbguard-usbguard-daemon-conf-test:
      test_title: FirewallBackend is set to nftables in /etc/usbguard/usbguard-daemon.conf.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/usbguard/usbguard-daemon.conf
          pattern:
            matches_regex: ^\s*AuditBackend\s*=\s*(\w+)\s*(?:#.*)?$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          equals: LinuxAudit
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: firewallbackend-set-nftables-in-etc-usbguard-usbguard-daemon-conf-test
