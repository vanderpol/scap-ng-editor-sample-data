assessment:
  id: ng.shared.linux-must-use-cryptographic-mechanisms-to-protect-the-integrity-of-audi
  version: 1
  assessment_title: Linux must use cryptographic mechanisms to protect the integrity of audit tools.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-aide-conf-has-selection-line-usr-sbin-auditctl-test:
      test_title: /etc/aide.conf has a selection line for /usr/sbin/auditctl.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/aide.conf
          pattern:
            matches_regex: ^\s*/usr/sbin/auditctl\s+\S+
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
