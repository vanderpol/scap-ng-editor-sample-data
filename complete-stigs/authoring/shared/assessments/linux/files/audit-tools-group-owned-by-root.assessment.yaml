assessment:
  id: ng.shared.the-audit-tools-are-group-owned-by-root
  version: 1
  assessment_title: Linux audit tools must be group-owned by root.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-tools-group-owned-by-root-test:
      test_title: The audit tools are group-owned by root.
      capability: unix.file
      object:
        capability: unix.file
        select:
          full_path:
            datatype: string
            value_match: one_or_more
            equals:
            - /sbin/auditctl
            - /sbin/aureport
            - /sbin/ausearch
            - /sbin/autrace
            - /sbin/auditd
            - /sbin/rsyslogd
            - /sbin/augenrules
        object_title: audit tools
        filesystem: all
      states:
      - owner_gid:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: audit-tools-group-owned-by-root-test
