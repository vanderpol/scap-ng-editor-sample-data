assessment:
  id: ng.shared.sssd-config-certificate-verification-ocsp-dgst-sha512
  version: 1
  assessment_title: Linux must implement certificate status checking for multifactor authentication (MFA).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    sssd-config-certificate-verification-ocsp-dgst-sha512-test:
      test_title: 'sssd config: certificate_verification: ocsp_dgst=sha512'
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/sssd/sssd.conf
                pattern:
                  matches_regex: ^\s*certificate_verification\s*=\s*(.*)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: 'sssd.conf: certificate_verification'
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/sssd/conf.d
                name:
                  matches_regex: ^[^.].*\.conf$
                pattern:
                  matches_regex: ^\s*certificate_verification\s*=\s*(.*)\s*$
                instance:
                  greater_than_or_equal: 1
              object_title: '/etc/sssd/conf.d/*.conf: certificate_verification'
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: 'sssd config: certificate_verification'
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?i)(^|,)ocsp_dgst=sha512(,|$)
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: sssd-config-certificate-verification-ocsp-dgst-sha512-test
