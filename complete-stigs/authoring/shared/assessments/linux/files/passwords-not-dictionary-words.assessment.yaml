assessment:
  id: ng.shared.passwords-must-not-be-dictionary-words
  version: 1
  assessment_title: Linux must prevent the use of dictionary words for passwords.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    passwords-not-dictionary-words-test:
      test_title: passwords must not be dictionary words
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/security/pwquality.conf
                pattern:
                  matches_regex: ^\s*dictcheck\s*=\s*([-\d]+)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/security/pwquality.conf.d
                name:
                  matches_regex: \.conf$
                pattern:
                  matches_regex: ^\s*dictcheck\s*=\s*([-\d]+)\s*(?:#.*)?$
                instance:
                  greater_than_or_equal: 1
              object_title: null
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: all pwquality configuration files
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          not_equal: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: passwords-not-dictionary-words-test
