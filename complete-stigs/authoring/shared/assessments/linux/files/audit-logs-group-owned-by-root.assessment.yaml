assessment:
  id: ng.shared.audit-logs-are-group-owned-by-root
  version: 1
  assessment_title: Linux audit logs must be group-owned by root or by a restricted logging group to prevent unauthorized
    read access.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    audit-data-directory-from-etc-audit-auditd-conf-variable:
      title: audit data directory from /etc/audit/auditd.conf
      kind: local
      datatype: string
      expression:
        values:
          object:
            capability: independent.textfilecontent54
            select:
              full_path:
                equals: /etc/audit/auditd.conf
              pattern:
                matches_regex: ^\s*log_file\s*=\s*(\S+)\s*(?:#.*)?$
              instance:
                greater_than_or_equal: 1
            object_title: null
            filesystem: all
            collect:
              ignore_case: false
              multiline: true
              singleline: false
              item_creation: all_object_elements_fullfilled
          field: subexpression
  tests:
    audit-logs-group-owned-by-root-test:
      test_title: audit logs are group-owned by root
      capability: unix.file
      object:
        capability: unix.file
        select:
          full_path:
            datatype: string
            value_match: all
            equals:
              variable: audit-data-directory-from-etc-audit-auditd-conf-variable
        object_title: Audit log file location
        filesystem: all
      states:
      - owner_gid:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: audit-logs-group-owned-by-root-test
