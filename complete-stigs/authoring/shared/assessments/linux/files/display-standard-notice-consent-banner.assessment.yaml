assessment:
  id: ng.shared.linux-must-display-the-standard-mandatory-dod-notice-and-consent-banner
  version: 1
  assessment_title: Linux must display the Standard Mandatory DOD Notice and Consent Banner before granting local
    or remote access to the system via a SSH logon.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    etc-ssh-sshd-config-banner-etc-issue-test:
      test_title: /etc/ssh/sshd_config:banner == /etc/issue
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/ssh/sshd_config
                pattern:
                  matches_regex: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
                instance:
                  greater_than_or_equal: 1
              object_title: Pull value of /etc/ssh/sshd_config:banner
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/ssh/sshd_config.d
                name:
                  matches_regex: .+
                pattern:
                  matches_regex: ^\s*(?i)banner(?-i)[ \t\"]+([\w\/]+)[\"\s]*(?:|(?:#.*))?$
                instance:
                  greater_than_or_equal: 1
              object_title: Pull value of /etc/ssh/sshd_config.d:banner
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: all sshd_config and sshd_config.d/* files
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^\/.+$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    etc-ssh-sshd-config-banner-none-test:
      test_title: /etc/ssh/sshd_config:banner == none
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        set:
          operator: union
          operands:
          - object:
              capability: independent.textfilecontent54
              select:
                full_path:
                  equals: /etc/ssh/sshd_config
                pattern:
                  matches_regex: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
                instance:
                  greater_than_or_equal: 1
              object_title: Pull value of /etc/ssh/sshd_config:banner
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
          - object:
              capability: independent.textfilecontent54
              select:
                directory:
                  equals: /etc/ssh/sshd_config.d
                name:
                  matches_regex: .+
                pattern:
                  matches_regex: ^\s*(?i)banner(?-i)[ \t]*(?:none[\s]*|(?:#.*))?$
                instance:
                  greater_than_or_equal: 1
              object_title: Pull value of /etc/ssh/sshd_config.d:banner
              filesystem: all
              collect:
                ignore_case: false
                multiline: true
                singleline: false
                item_creation: all_object_elements_fullfilled
            filters: []
        object_title: all sshd_config and sshd_config.d/* files
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    all:
    - test: etc-ssh-sshd-config-banner-etc-issue-test
    - test: etc-ssh-sshd-config-banner-none-test
