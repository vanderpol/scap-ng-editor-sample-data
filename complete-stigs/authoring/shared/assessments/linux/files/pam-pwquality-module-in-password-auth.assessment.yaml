assessment:
  id: ng.shared.the-pam-pwquality-module-is-included-in-password-auth
  version: 1
  assessment_title: Linux must ensure the password complexity module is enabled in the password-auth file.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    pam-pwquality-module-included-in-password-auth-test:
      test_title: The pam_pwquality module is included in password-auth.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/pam.d/password-auth
          pattern:
            matches_regex: ^\s*password\s+(?:required|requisite)\s+pam_pwquality\.so\b
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: pam-pwquality-module-included-in-password-auth-test
