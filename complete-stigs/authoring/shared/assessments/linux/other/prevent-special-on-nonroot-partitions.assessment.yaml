assessment:
  id: ng.shared.linux-must-prevent-special-devices-on-nonroot-local-partitions
  version: 1
  assessment_title: Linux must prevent special devices on nonroot local partitions.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    device-files-mounted-nodev-option-mounts-on-ignored-test:
      test_title: Device files are mounted with the nodev option.  Mounts on '/' are ignored.
      capability: linux.partition
      object:
        capability: linux.partition
        set:
          operator: union
          operands:
          - object:
              capability: linux.partition
              select:
                mount_point:
                  matches_regex: ^/\S+$
              object_title: null
            filters:
            - include:
                device:
                  require: at_least_one_exists_and_all_match
                  matches_regex: ^/dev\S*$
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: nodev
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
    device-files-configured-in-etc-fstab-use-nodev-option-mounts-test:
      test_title: Device files are configured in /etc/fstab to use the nodev option.  Mounts on '/' are ignored.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/fstab
          pattern:
            matches_regex: ^\s*/dev\S*\s+/\S+\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?:^nodev$|^nodev,|,nodev$|,nodev,)
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    all:
    - test: device-files-mounted-nodev-option-mounts-on-ignored-test
    - test: device-files-configured-in-etc-fstab-use-nodev-option-mounts-test
