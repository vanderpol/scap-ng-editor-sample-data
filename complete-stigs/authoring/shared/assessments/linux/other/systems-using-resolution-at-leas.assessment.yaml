assessment:
  id: ng.shared.linux-systems-using-domain-name-servers-dns-resolution-must-have-at-leas
  version: 1
  assessment_title: Linux systems using Domain Name Servers (DNS) resolution must have at least two name servers configured.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    count-unique-name-servers-variable:
      title: count of unique name servers
      kind: local
      datatype: integer
      expression:
        count:
          unique:
            values:
              object: etc-resolv-conf-nameserver-entries-object
              field: subexpression
  tests:
    system-using-dns-test:
      test_title: The system is using DNS
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/nsswitch.conf
          pattern:
            matches_regex: ^\s*hosts:\s*(.*)$
          instance:
            greater_than_or_equal: 1
        object_title: /etc/nsswitch.conf hosts entry
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (^|\s)dns(\s|$)
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    etc-resolv-conf-contains-at-least-one-nameserver-entry-test:
      test_title: /etc/resolv.conf contains at least one nameserver entry
      capability: independent.textfilecontent54
      object: etc-resolv-conf-nameserver-entries-object
      reported_elements: all
      collected_items_require: at_least_one_exists
    etc-resolv-conf-configured-at-least-two-name-servers-test:
      test_title: /etc/resolv.conf is configured with at least two name servers
      capability: variable.value
      states:
      - value:
          require: at_least_one_exists_and_all_match
          greater_than_or_equal: 2
      reported_elements: all
      variable: count-unique-name-servers-variable
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - not:
        test: system-using-dns-test
    - all:
      - test: system-using-dns-test
      - test: etc-resolv-conf-contains-at-least-one-nameserver-entry-test
      - test: etc-resolv-conf-configured-at-least-two-name-servers-test
  shared_objects:
    etc-resolv-conf-nameserver-entries-object:
      capability: independent.textfilecontent54
      select:
        full_path:
          equals: /etc/resolv.conf
        pattern:
          matches_regex: ^nameserver\s+(.*)$
        instance:
          greater_than_or_equal: 1
      object_title: /etc/resolv.conf nameserver entries
      filesystem: all
      collect:
        ignore_case: false
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
