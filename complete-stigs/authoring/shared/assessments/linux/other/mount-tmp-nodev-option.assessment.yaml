assessment:
  id: ng.shared.linux-must-mount-tmp-with-the-nodev-option
  version: 1
  assessment_title: Linux must mount /tmp with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    mount-options-tmp-in-etc-fstab-variable:
      title: Mount options for /tmp in /etc/fstab
      kind: local
      datatype: string
      expression:
        split:
          value:
            values:
              object: independent-textfilecontent54-object
              field: subexpression
          delimiter: ','
  tests:
    tmp-mounted-nodev-option-test:
      test_title: /tmp is mounted with the nodev option
      capability: linux.partition
      object:
        capability: linux.partition
        select:
          mount_point:
            equals: /tmp
        object_title: null
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: nodev
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    tmp-configured-nodev-option-in-etc-fstab-test:
      test_title: /tmp is configured with the nodev option in /etc/fstab
      capability: variable.value
      states:
      - value:
          require: at_least_one_exists_and_some_match
          equals: nodev
      reported_elements: all
      variable: mount-options-tmp-in-etc-fstab-variable
      collected_items_require: at_least_one_exists_and_all_match
    tmp-configured-in-etc-fstab-test:
      test_title: /tmp is configured in /etc/fstab
      capability: independent.textfilecontent54
      object: independent-textfilecontent54-object
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    all:
    - test: tmp-mounted-nodev-option-test
    - test: tmp-configured-nodev-option-in-etc-fstab-test
    - test: tmp-configured-in-etc-fstab-test
  shared_objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        full_path:
          equals: /etc/fstab
        pattern:
          matches_regex: ^\s*[^#\s]+\s+/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
        instance:
          equals: 1
      object_title: null
      filesystem: all
      collect:
        ignore_case: false
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
