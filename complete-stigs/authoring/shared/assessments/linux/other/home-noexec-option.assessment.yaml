assessment:
  id: ng.shared.home-has-noexec-option
  version: 1
  assessment_title: Linux must prevent code from being executed on file systems that contain user home directories.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    home-has-noexec-option-test:
      test_title: /home has noexec option
      capability: linux.partition
      object:
        capability: linux.partition
        select:
          mount_point:
            matches_regex: .*\/home
        object_title: /home
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: noexec
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: home-has-noexec-option-test
