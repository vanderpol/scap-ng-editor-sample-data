assessment:
  id: ng.shared.package-pcsc-lite-is-installed
  version: 1
  assessment_title: Linux must have the pcsc-lite package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    package-pcsc-lite-installed-test:
      test_title: package pcsc-lite is installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: pcsc-lite
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: package-pcsc-lite-installed-test
