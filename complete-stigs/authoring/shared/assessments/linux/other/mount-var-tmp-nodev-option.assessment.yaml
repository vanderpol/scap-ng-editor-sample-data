assessment:
  id: ng.shared.linux-must-mount-var-tmp-with-the-nodev-option
  version: 1
  assessment_title: Linux must mount /var/tmp with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    if-var-tmp-mounted-it-mounted-nodev-option-test:
      test_title: If /var/tmp is mounted, it is mounted with the nodev option
      capability: linux.partition
      object:
        capability: linux.partition
        select:
          mount_point:
            equals: /var/tmp
        object_title: null
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: nodev
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
    if-var-tmp-configured-in-etc-fstab-it-configured-nodev-test:
      test_title: If /var/tmp is configured in /etc/fstab, it is configured with the nodev option
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/fstab
          pattern:
            matches_regex: ^\s*[^#\s]+\s+/var/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            equals: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: (?:^nodev$|^nodev,|,nodev$|,nodev,)
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    all:
    - test: if-var-tmp-mounted-it-mounted-nodev-option-test
    - test: if-var-tmp-configured-in-etc-fstab-it-configured-nodev-test
