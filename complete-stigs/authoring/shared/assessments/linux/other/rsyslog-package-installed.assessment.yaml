assessment:
  id: ng.shared.the-rsyslog-package-is-installed
  version: 1
  assessment_title: Linux must have the rsyslog package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    rsyslog-package-installed-test:
      test_title: The rsyslog package is installed.
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: rsyslog
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: all_exist
  evaluate:
    test: rsyslog-package-installed-test
