assessment:
  id: ng.shared.linux-must-mount-tmp-with-the-nosuid-option
  version: 1
  assessment_title: Linux must mount /tmp with the nosuid option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    tmp-mounted-nosuid-option-test:
      test_title: /tmp is mounted with the nosuid option
      capability: linux.partition
      object:
        capability: linux.partition
        select:
          mount_point:
            equals: /tmp
        object_title: null
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: nosuid
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    tmp-configured-nosuid-option-in-etc-fstab-test:
      test_title: /tmp is configured with the nosuid option in /etc/fstab
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/fstab
          pattern:
            matches_regex: ^\s*[^#\s]+\s+/tmp\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            equals: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^.*nosuid.*$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    all:
    - test: tmp-mounted-nosuid-option-test
    - test: tmp-configured-nosuid-option-in-etc-fstab-test
