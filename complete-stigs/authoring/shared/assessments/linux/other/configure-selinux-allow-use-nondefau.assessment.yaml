assessment:
  id: ng.shared.linux-must-configure-selinux-context-type-to-allow-the-use-of-a-nondefau
  version: 1
  assessment_title: Linux must configure SELinux context type to allow the use of a nondefault faillock tally directory.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    faillock-directory-variable:
      title: faillock directory
      kind: local
      datatype: string
      expression:
        values:
          object: etc-security-faillock-conf-dir-object
          field: subexpression
  tests:
    configured-faillock-directory-has-correct-selinux-context-test:
      test_title: configured faillock directory has correct selinux context
      capability: linux.selinuxsecuritycontext
      object:
        capability: linux.selinuxsecuritycontext
        select:
          directory:
            datatype: string
            value_match: all
            equals:
              variable: faillock-directory-variable
          name: null
        object_title: configured faillock directory selinux context
        filesystem: all
      states:
      - type:
          require: at_least_one_exists_and_all_match
          equals: faillog_t
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    etc-security-faillock-conf-dir-option-exists-test:
      test_title: /etc/security/faillock.conf dir option exists
      capability: independent.textfilecontent54
      object: etc-security-faillock-conf-dir-object
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    all:
    - test: configured-faillock-directory-has-correct-selinux-context-test
    - test: etc-security-faillock-conf-dir-option-exists-test
  shared_objects:
    etc-security-faillock-conf-dir-object:
      capability: independent.textfilecontent54
      select:
        full_path:
          equals: /etc/security/faillock.conf
        pattern:
          matches_regex: ^\s*dir\s*=\s*(.*)\s*$
        instance:
          greater_than_or_equal: 1
      object_title: /etc/security/faillock.conf dir
      filesystem: all
      collect:
        ignore_case: false
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
