assessment:
  id: ng.shared.package-nss-tools-is-installed
  version: 1
  assessment_title: Linux must have the nss-tools package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    package-nss-tools-installed-test:
      test_title: package nss-tools is installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: nss-tools
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: package-nss-tools-installed-test
