assessment:
  id: ng.shared.linux-passwords-must-have-a-24-hour-minimum-password-lifetime-restrictio
  version: 1
  assessment_title: Linux passwords must have a 24-hour minimum password lifetime restriction in /etc/shadow.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    uid-user-nobody-variable:
      title: UID for user nobody
      kind: local
      datatype: integer
      expression:
        values:
          object:
            capability: independent.textfilecontent54
            select:
              full_path:
                equals: /etc/passwd
              pattern:
                matches_regex: '^nobody:[^:]*:([0-9]+):'
              instance:
                equals: 1
            object_title: null
            filesystem: all
            collect:
              ignore_case: false
              multiline: true
              singleline: false
              item_creation: all_object_elements_fullfilled
          field: subexpression
  tests:
    root-does-not-have-minimum-password-age-0-or-blank-test:
      test_title: Root does not have a minimum password age of 0 or blank
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/shadow
          pattern:
            matches_regex: '^root:[^:]*:[^:]*:0*:'
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: none_exist
    non-system-users-do-not-have-minimum-password-age-0-test:
      test_title: Non-system users do not have a minimum password age of 0 or blank
      capability: unix.password
      object:
        capability: unix.password
        object_title: Users with a password age of zero minus system users
        set:
          operator: union
          operands:
          - object:
              capability: unix.password
              for_each:
                item: match
                in: independent-textfilecontent54-2-object
              select:
                username:
                  from: match.subexpression
              object_title: Users with a password age of zero minus system users
            filters:
            - exclude:
                user_id:
                  require: at_least_one_exists_and_all_match
                  less_than: 1000
            - exclude:
                user_id:
                  datatype: integer
                  value_match: all
                  require: at_least_one_exists_and_all_match
                  equals:
                    variable: uid-user-nobody-variable
      reported_elements: all
      collected_items_require: none_exist
  evaluate:
    all:
    - test: root-does-not-have-minimum-password-age-0-or-blank-test
    - test: non-system-users-do-not-have-minimum-password-age-0-test
  shared_objects:
    independent-textfilecontent54-2-object:
      capability: independent.textfilecontent54
      select:
        full_path:
          equals: /etc/shadow
        pattern:
          matches_regex: '^([^:]*):[^:]*:[^:]*:0*:'
        instance:
          greater_than_or_equal: 1
      object_title: null
      filesystem: all
      collect:
        ignore_case: false
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
