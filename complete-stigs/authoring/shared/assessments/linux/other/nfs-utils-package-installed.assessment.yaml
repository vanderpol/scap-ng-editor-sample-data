assessment:
  id: ng.shared.nfs-utils-package-is-installed
  version: 1
  assessment_title: Linux must not have the nfs-utils package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    nfs-utils-package-installed-test:
      test_title: nfs-utils package is installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: nfs-utils
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    not:
      test: nfs-utils-package-installed-test
