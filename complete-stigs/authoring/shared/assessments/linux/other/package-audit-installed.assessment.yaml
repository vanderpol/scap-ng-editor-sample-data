assessment:
  id: ng.shared.package-audit-is-installed
  version: 1
  assessment_title: Linux must have the audit package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    package-audit-installed-test:
      test_title: package audit is installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: audit
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: all_exist
  evaluate:
    test: package-audit-installed-test
