assessment:
  id: ng.shared.linux-must-mount-var-log-audit-with-the-noexec-option
  version: 1
  assessment_title: Linux must mount /var/log/audit with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    var-log-audit-mounted-noexec-option-test:
      test_title: /var/log/audit is mounted with the noexec option
      capability: linux.partition
      object:
        capability: linux.partition
        select:
          mount_point:
            equals: /var/log/audit
        object_title: null
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: noexec
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    var-log-audit-configured-noexec-option-in-etc-fstab-test:
      test_title: /var/log/audit is configured with the noexec option in /etc/fstab
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/fstab
          pattern:
            matches_regex: ^\s*[^#\s]+\s+/var/log/audit\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$
          instance:
            equals: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      states:
      - subexpression:
          require: at_least_one_exists_and_all_match
          matches_regex: ^.*noexec.*$
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    all:
    - test: var-log-audit-mounted-noexec-option-test
    - test: var-log-audit-configured-noexec-option-in-etc-fstab-test
