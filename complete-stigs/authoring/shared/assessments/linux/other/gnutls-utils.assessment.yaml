assessment:
  id: ng.shared.gnutls-utils
  version: 1
  assessment_title: Linux must have the gnutls-utils package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    gnutls-utils-test:
      test_title: gnutls-utils
      capability: linux.rpminfo
      object:
