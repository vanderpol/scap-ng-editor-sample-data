assessment:
  id: ng.shared.opensc-package-is-installed
  version: 1
  assessment_title: Linux must have the opensc package installed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    opensc-package-installed-test:
      test_title: opensc package is installed
      capability: linux.rpminfo
      object:
        capability: linux.rpminfo
        select:
          package_name:
            equals: opensc
        object_title: null
        collect:
          include_file_paths: false
      reported_elements: all
      collected_items_require: at_least_one_exists
  evaluate:
    test: opensc-package-installed-test
