assessment:
  id: ng.shared.linux-must-use-a-separate-file-system-for-the-system-audit-data-path
  version: 1
  assessment_title: Linux must use a separate file system for the system audit data path.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    regex-find-audit-data-partition-in-etc-fstab-variable:
      title: regex to find audit data partition in /etc/fstab
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ^[^# \t]+\s+
            datatype: string
        - values:
            object: independent-textfilecontent54-object
            field: subexpression
        - literal:
            value: \s+
            datatype: string
  tests:
    there-separate-file-system-audit-data-directory-test:
      test_title: There is a separate file system for audit data directory.
      capability: linux.partition
      object:
        capability: linux.partition
        for_each:
          item: match
          in: independent-textfilecontent54-object
        select:
          mount_point:
            from: match.subexpression
        object_title: null
      reported_elements: all
      collected_items_require: all_exist
    there-separate-file-system-configured-audit-data-directory-test:
      test_title: There is a separate file system configured for audit data directory.
      capability: independent.textfilecontent54
      object:
        capability: independent.textfilecontent54
        select:
          full_path:
            equals: /etc/fstab
          pattern:
            datatype: string
            value_match: one_or_more
            matches_regex:
              variable: regex-find-audit-data-partition-in-etc-fstab-variable
          instance:
            greater_than_or_equal: 1
        object_title: null
        filesystem: all
        collect:
          ignore_case: false
          multiline: true
          singleline: false
          item_creation: all_object_elements_fullfilled
      reported_elements: all
      collected_items_require: all_exist
  evaluate:
    all:
    - test: there-separate-file-system-audit-data-directory-test
    - test: there-separate-file-system-configured-audit-data-directory-test
  shared_objects:
    independent-textfilecontent54-object:
      capability: independent.textfilecontent54
      select:
        full_path:
          equals: /etc/audit/auditd.conf
        pattern:
          matches_regex: ^\s*log_file\s*=\s*(\S+)/\S+\s*$
        instance:
          greater_than_or_equal: 1
      object_title: null
      filesystem: all
      collect:
        ignore_case: true
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
