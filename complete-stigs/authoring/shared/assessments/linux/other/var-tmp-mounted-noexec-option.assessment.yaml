assessment:
  id: ng.shared.var-tmp-is-mounted-with-the-noexec-option
  version: 1
  assessment_title: Linux must mount /var/tmp with the noexec option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    var-tmp-mounted-noexec-option-test:
      test_title: /var/tmp is mounted with the noexec option
      capability: linux.partition
      object:
        capability: linux.partition
        select:
          mount_point:
            equals: /var/tmp
        object_title: null
      states:
      - mount_options:
          require: at_least_one_exists_and_some_match
          equals: noexec
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: var-tmp-mounted-noexec-option-test
