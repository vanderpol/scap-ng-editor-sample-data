assessment:
  id: ng.shared.net-ipv6-conf-default-accept-redirects-is-set-to-0-in-kernel
  version: 1
  assessment_title: Linux must prevent IPv6 Internet Control Message Protocol (ICMP) redirect messages from being
    accepted.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    net-ipv6-conf-default-accept-redirects-set-0-in-kernel-test:
      test_title: net.ipv6.conf.default.accept_redirects is set to 0 in kernel
      capability: unix.sysctl
      object:
        capability: unix.sysctl
        select:
          name:
            equals: net.ipv6.conf.default.accept_redirects
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: net-ipv6-conf-default-accept-redirects-set-0-in-kernel-test
