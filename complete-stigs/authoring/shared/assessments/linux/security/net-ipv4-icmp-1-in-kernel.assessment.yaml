assessment:
  id: ng.shared.net-ipv4-icmp-echo-ignore-broadcasts-is-set-to-1-in-kernel
  version: 1
  assessment_title: Linux must not respond to Internet Control Message Protocol (ICMP) echoes sent to a broadcast
    address.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    net-ipv4-icmp-echo-ignore-broadcasts-set-1-in-kernel-test:
      test_title: net.ipv4.icmp_echo_ignore_broadcasts is set to 1 in kernel
      capability: unix.sysctl
      object:
        capability: unix.sysctl
        select:
          name:
            equals: net.ipv4.icmp_echo_ignore_broadcasts
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: 1
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: net-ipv4-icmp-echo-ignore-broadcasts-set-1-in-kernel-test
