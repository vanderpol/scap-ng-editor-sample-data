assessment:
  id: ng.shared.net-ipv4-conf-default-rp-filter-setting-in-kernel-is-set-to-1
  version: 1
  assessment_title: Linux must use a reverse-path filter for IPv4 network traffic, when possible, by default.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    net-ipv4-conf-default-rp-filter-setting-in-kernel-set-test:
      test_title: net.ipv4.conf.default.rp_filter setting in kernel is set to 1
      capability: unix.sysctl
      object:
        capability: unix.sysctl
        select:
          name:
            equals: net.ipv4.conf.default.rp_filter
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: 1
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: net-ipv4-conf-default-rp-filter-setting-in-kernel-set-test
