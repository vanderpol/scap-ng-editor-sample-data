assessment:
  id: ng.shared.net-ipv4-conf-all-accept-redirects-is-set-to-0-in-kernel
  version: 1
  assessment_title: Linux must ignore Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP)
    redirect messages.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    net-ipv4-conf-all-accept-redirects-set-0-in-kernel-test:
      test_title: net.ipv4.conf.all.accept_redirects is set to 0 in kernel
      capability: unix.sysctl
      object:
        capability: unix.sysctl
        select:
          name:
            equals: net.ipv4.conf.all.accept_redirects
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: 0
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: net-ipv4-conf-all-accept-redirects-set-0-in-kernel-test
