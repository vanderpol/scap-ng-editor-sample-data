assessment:
  id: ng.shared.linux-user-account-passwords-must-have-a-60-day-maximum-password-lifetim
  version: 1
  assessment_title: Linux user account passwords must have a 60-day maximum password lifetime restriction.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    pattern-match-lines-starting-usernames-system-users-variable:
      title: Pattern to match lines starting with usernames of system users
      kind: local
      datatype: string
      expression:
        concat:
        - literal:
            value: ^
            datatype: string
        - values:
            object:
              capability: unix.password
              object_title: interactive non-anonymous users
              set:
                operator: union
                operands:
                - object:
                    capability: unix.password
                    select:
                      username:
                        matches_regex: .*
                    object_title: interactive non-anonymous users
                  filters:
                  - include:
                      user_id:
                        require: at_least_one_exists_and_all_match
                        greater_than_or_equal: 1000
                  - include:
                      user_id:
                        datatype: integer
                        value_match: all
                        require: at_least_one_exists_and_all_match
                        not_equal:
                        - 65534
                        - 65535
                        - 4294967294
                        - 4294967295
            field: username
        - literal:
            value: $
            datatype: string
  tests:
    no-password-in-etc-shadow-has-maximum-password-age-0-test:
      test_title: No password in /etc/shadow has a maximum password age of 0 or greater than 60
      capability: unix.shadow
      object:
        capability: unix.shadow
        object_title: /etc/shadow max password ages for non-system users
        set:
          operator: union
          operands:
          - object:
              capability: unix.shadow
              select:
                username:
                  matches_regex: .+
              object_title: /etc/shadow max password ages for non-system users
            filters:
            - include:
                username:
                  datatype: string
                  value_match: one_or_more
                  require: at_least_one_exists_and_all_match
                  matches_regex:
                    variable: pattern-match-lines-starting-usernames-system-users-variable
      states:
      - chg_req:
          greater_than: 0
      - chg_req:
          less_than_or_equal: 60
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: may_be_absent_and_all_match
    root-password-in-etc-shadow-does-not-have-maximum-password-test:
      test_title: Root password in /etc/shadow does not have a maximum password age of 0 or greater than 60
      capability: unix.shadow
      object:
        capability: unix.shadow
        select:
          username:
            equals: root
        object_title: /etc/shadow max password age for root
      states:
      - chg_req:
          greater_than: 0
      - chg_req:
          less_than_or_equal: 60
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: all_exist_and_all_match
  evaluate:
    all:
    - test: no-password-in-etc-shadow-has-maximum-password-age-0-test
    - test: root-password-in-etc-shadow-does-not-have-maximum-password-test
