assessment:
  id: ng.shared.linux-library-files-must-be-owned-by-root
  version: 1
  assessment_title: Linux library files must be owned by root.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'Verify the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and "/usr/lib64"
    are owned by root with the following command: $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name ''*.so*'' ! -user
    root -exec stat -c "%n %U" {} + If any output is returned, this is a finding.'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
