assessment:
  id: ng.shared.fapolicyd-service-is-active
  version: 1
  assessment_title: Linux must enable the fapolicy module.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    fapolicyd-service-active-test:
      test_title: fapolicyd.service is active
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: fapolicyd.service
          property:
            equals: ActiveState
        object_title: fapolicyd.service ActiveState
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: active
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: fapolicyd-service-active-test
