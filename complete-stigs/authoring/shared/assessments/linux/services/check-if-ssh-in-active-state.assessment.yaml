assessment:
  id: ng.shared.check-if-ssh-is-in-active-state
  version: 1
  assessment_title: Linux networked systems must have and implement SSH to protect the confidentiality and integrity
    of transmitted and received information, as well as information during preparation for transmission.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    check-if-ssh-in-active-state-test:
      test_title: Check if SSH is in 'active' state
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: sshd.service
          property:
            equals: ActiveState
        object_title: sshd.service ActiveState
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: active
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: check-if-ssh-in-active-state-test
