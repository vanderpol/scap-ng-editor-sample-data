assessment:
  id: ng.shared.linux-debug-shell-systemd-service-must-be-disabled
  version: 1
  assessment_title: Linux debug-shell systemd service must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    debug-shell-service-loadstate-masked-if-it-exists-test:
      test_title: debug-shell.service LoadState is masked if it exists.
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: debug-shell.service
          property:
            equals: LoadState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: masked
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
    debug-shell-service-unitfilestate-masked-if-it-exists-test:
      test_title: debug-shell.service UnitFileState is masked if it exists.
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: debug-shell.service
          property:
            equals: UnitFileState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: masked
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    all:
    - test: debug-shell-service-loadstate-masked-if-it-exists-test
    - test: debug-shell-service-unitfilestate-masked-if-it-exists-test
