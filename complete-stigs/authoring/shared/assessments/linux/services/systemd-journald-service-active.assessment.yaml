assessment:
  id: ng.shared.the-systemd-journald-service-is-active
  version: 1
  assessment_title: Linux systemd-journald service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    systemd-journald-service-active-test:
      test_title: The systemd-journald service is active.
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: systemd-journald.service
          property:
            equals: ActiveState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: active
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: systemd-journald-service-active-test
