assessment:
  id: ng.shared.chronyd-service-is-active
  version: 1
  assessment_title: Linux must enable the chronyd service.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    chronyd-service-active-test:
      test_title: chronyd service is active
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: chronyd.service
          property:
            equals: ActiveState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: active
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: chronyd-service-active-test
