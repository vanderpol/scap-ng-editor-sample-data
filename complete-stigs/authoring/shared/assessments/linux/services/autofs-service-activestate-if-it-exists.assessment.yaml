assessment:
  id: ng.shared.autofs-service-activestate-is-inactive-if-it-exists
  version: 1
  assessment_title: Linux file system automount function must be disabled unless required.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    autofs-service-activestate-inactive-if-it-exists-test:
      test_title: autofs.service ActiveState is inactive if it exists.
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: autofs.service
          property:
            equals: ActiveState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: inactive
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    test: autofs-service-activestate-inactive-if-it-exists-test
