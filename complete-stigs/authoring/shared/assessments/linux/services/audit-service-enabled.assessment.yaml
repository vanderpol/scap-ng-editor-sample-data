assessment:
  id: ng.shared.linux-audit-service-must-be-enabled
  version: 1
  assessment_title: Linux audit service must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    auditd-service-active-test:
      test_title: auditd.service is active
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: auditd.service
          property:
            equals: ActiveState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: active
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    auditd-service-running-test:
      test_title: auditd.service is running
      capability: linux.systemdunitproperty
      object:
        capability: linux.systemdunitproperty
        select:
          unit:
            equals: auditd.service
          property:
            equals: SubState
        object_title: null
      states:
      - value:
          require: at_least_one_exists_and_all_match
          equals: running
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    all:
    - test: auditd-service-active-test
    - test: auditd-service-running-test
