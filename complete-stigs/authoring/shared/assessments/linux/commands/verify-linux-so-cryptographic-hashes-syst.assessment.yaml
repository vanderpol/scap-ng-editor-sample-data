assessment:
  id: ng.shared.verify-that-linux-is-configured-so-that-the-cryptographic-hashes-of-syst
  version: 1
  assessment_title: Linux must be configured so that the cryptographic hashes of system files match vendor values.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verify-that-rhel-9-configured-so-that-cryptographic-hashes-system-test:
      test_title: Verify that RHEL 9 is configured so that the cryptographic hashes of system files match vendor values.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Verify that RHEL 9 is configured so that the cryptographic hashes of system files match vendor
          values.
        collect:
          shell: bash
          command: rpm -Va --noconfig | awk '$1 ~ /..5/ && $2 != "c"'
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: none_exist
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verify-that-rhel-9-configured-so-that-cryptographic-hashes-system-test
