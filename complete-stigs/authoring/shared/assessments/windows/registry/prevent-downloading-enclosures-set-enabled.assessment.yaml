assessment:
  id: ng.shared.prevent-downloading-of-enclosures-is-set-to-enabled
  version: 1
  assessment_title: Attachments must be prevented from being downloaded from RSS feeds.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    prevent-downloading-enclosures-set-enabled-test:
      test_title: '''Prevent downloading of enclosures'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds
          name:
            equals: DisableEnclosureDownload
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: prevent-downloading-enclosures-set-enabled-test
