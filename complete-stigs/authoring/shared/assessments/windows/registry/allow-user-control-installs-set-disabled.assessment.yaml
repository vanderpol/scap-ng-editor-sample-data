assessment:
  id: ng.shared.allow-user-control-over-installs-is-set-to-disabled
  version: 1
  assessment_title: Users must be prevented from changing installation options.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    allow-user-control-over-installs-set-disabled-test:
      test_title: '''Allow user control over installs'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\Installer
          name:
            equals: EnableUserControl
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: allow-user-control-over-installs-set-disabled-test
