assessment:
  id: ng.shared.local-admin-accounts-filtered-token-policy-is-enabled
  version: 1
  assessment_title: Local administrator accounts must have their privileged token filtered to prevent elevated privileges
    from being used over the network on domain systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    local-admin-accounts-filtered-token-policy-enabled-test:
      test_title: Local admin accounts filtered token policy is enabled
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            case_insensitive_equals: LocalAccountTokenFilterPolicy
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: local-admin-accounts-filtered-token-policy-enabled-test
