assessment:
  id: ng.shared.outgoing-secure-channel-traffic-is-signed
  version: 1
  assessment_title: Outgoing secure channel traffic must be signed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    outgoing-secure-channel-traffic-signed-test:
      test_title: Outgoing secure channel traffic is signed.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
          name:
            case_insensitive_equals: SignSecureChannel
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: outgoing-secure-channel-traffic-signed-test
