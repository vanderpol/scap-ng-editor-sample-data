assessment:
  id: ng.shared.disallow-winrm-from-storing-runas-credentials-is-set-to-enabled
  version: 1
  assessment_title: The Windows Remote Management (WinRM) service must not store RunAs credentials.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    disallow-winrm-from-storing-runas-credentials-set-enabled-test:
      test_title: '''Disallow WinRM from storing RunAs credentials'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Windows\WinRM\Service
          name:
            equals: DisableRunAs
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: disallow-winrm-from-storing-runas-credentials-set-enabled-test
