assessment:
  id: ng.shared.verifies-user-account-control-admin-approval-mode-for-the-built-in-admin
  version: 1
  assessment_title: User Account Control approval mode for the built-in Administrator must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verifies-user-account-control-admin-approval-mode-built-in-administrator-test:
      test_title: 'Verifies ''User Account Control: Admin Approval Mode for the Built-in Administrator account'' is
        set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            equals: FilterAdministratorToken
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verifies-user-account-control-admin-approval-mode-built-in-administrator-test
