assessment:
  id: ng.shared.the-dow-root-ca-certificates-must-be-installed-in-the-trusted-root-store
  version: 1
  assessment_title: The DoW Root CA certificates must be installed in the Trusted Root Store.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    dod-root-ca-3-certificate-expiring-12-30-2029-installed-test:
      test_title: The DoD Root CA 3 Certificate expiring 12/30/2029 is installed into the Trusted Root Store.
      capability: windows.registry
      object:
        capability: windows.registry
        set:
          operator: union
          operands:
          - object:
              capability: windows.registry
              set:
                operator: union
                operands:
                - object:
                    capability: windows.registry
                    select:
                      hive:
                        equals: local_machine
                      key:
                        equals: SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\D73CA91102A2204A36459ED32213B467D7CE97FB
                      name:
                        matches_regex: ^.+$
                    object_title: null
                  filters: []
                - object:
                    capability: windows.registry
                    select:
                      hive:
                        equals: local_machine
                      key:
                        equals: SOFTWARE\Microsoft\EnterpriseCertificates\Root\Certificates\D73CA91102A2204A36459ED32213B467D7CE97FB
                      name:
                        matches_regex: ^.+$
                    object_title: null
                  filters: []
              object_title: null
            filters: []
          - object:
              capability: windows.registry
              select:
                hive:
                  equals: local_machine
                key:
                  equals: SOFTWARE\Policies\Microsoft\SystemCertificates\Root\Certificates\D73CA91102A2204A36459ED32213B467D7CE97FB
                name:
                  matches_regex: ^.+$
              object_title: null
            filters: []
        object_title: null
      reported_elements: all
      collected_items_require: at_least_one_exists
