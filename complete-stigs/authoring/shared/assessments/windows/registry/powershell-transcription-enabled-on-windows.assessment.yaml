assessment:
  id: ng.shared.powershell-transcription-is-enabled-on-windows
  version: 1
  assessment_title: PowerShell Transcription must be enabled on Windows.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    powershell-transcription-enabled-on-windows-11-test:
      test_title: PowerShell Transcription is enabled on Windows 11
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
          name:
            equals: EnableTranscripting
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: powershell-transcription-enabled-on-windows-11-test
