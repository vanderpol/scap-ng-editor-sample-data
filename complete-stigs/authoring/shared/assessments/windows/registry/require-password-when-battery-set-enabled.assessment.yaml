assessment:
  id: ng.shared.require-a-password-when-a-computer-wakes-on-battery-is-set-to-enabled
  version: 1
  assessment_title: Users must be prompted for a password on resume from sleep (on battery).
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    require-password-when-computer-wakes-on-battery-set-enabled-test:
      test_title: '''Require a password when a computer wakes (on battery)'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51
          name:
            equals: DCSettingIndex
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: require-password-when-computer-wakes-on-battery-set-enabled-test
