assessment:
  id: ng.shared.verifies-sign-in-last-interactive-user-automatically-after-a-system-init
  version: 1
  assessment_title: Automatically signing in the last interactive user after a system-initiated restart must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verifies-sign-in-last-interactive-user-automatically-after-system-initiated-test:
      test_title: Verifies 'Sign-in last interactive user automatically after a system-initiated restart' is set to
        'Disabled'
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            equals: DisableAutomaticRestartSignOn
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verifies-sign-in-last-interactive-user-automatically-after-system-initiated-test
