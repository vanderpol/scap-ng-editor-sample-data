assessment:
  id: ng.shared.turn-on-powershell-script-block-logging-is-set-to-enabled
  version: 1
  assessment_title: PowerShell script block logging must be enabled on Windows.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    turn-on-powershell-script-block-logging-set-enabled-test:
      test_title: '''Turn on PowerShell Script Block Logging'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
          name:
            case_insensitive_equals: EnableScriptBlockLogging
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: turn-on-powershell-script-block-logging-set-enabled-test
