assessment:
  id: ng.shared.configure-windows-smartscreen-is-set-to-enabled
  version: 1
  assessment_title: The Microsoft Defender SmartScreen for Explorer must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    configure-windows-smartscreen-set-enabled-test:
      test_title: '''Configure Windows SmartScreen'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Windows\System
          name:
            equals: EnableSmartScreen
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: configure-windows-smartscreen-set-enabled-test
