assessment:
  id: ng.shared.verifies-do-not-display-network-selection-ui-is-set-to-enabled
  version: 1
  assessment_title: The network selection user interface (UI) must not be displayed on the logon screen.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verifies-do-not-display-network-selection-ui-set-enabled-test:
      test_title: Verifies 'Do not display network selection UI' is set to 'Enabled'
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\System
          name:
            equals: DontDisplayNetworkSelectionUI
        object_title: HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontDisplayNetworkSelectionUI
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verifies-do-not-display-network-selection-ui-set-enabled-test
