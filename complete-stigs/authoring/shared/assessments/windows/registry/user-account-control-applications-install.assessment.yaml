assessment:
  id: ng.shared.user-account-control-only-elevate-uiaccess-applications-that-are-install
  version: 1
  assessment_title: User Account Control must only elevate UIAccess applications that are installed in secure locations.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    user-account-control-only-elevate-uiaccess-applications-that-installed-in-test:
      test_title: '''User Account Control: Only elevate UIAccess applications that are installed in secure locations''
        is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            equals: EnableSecureUIAPaths
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: user-account-control-only-elevate-uiaccess-applications-that-installed-in-test
