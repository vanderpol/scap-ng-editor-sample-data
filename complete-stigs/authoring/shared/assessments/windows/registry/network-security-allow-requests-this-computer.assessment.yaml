assessment:
  id: ng.shared.network-security-allow-pku2u-authentication-requests-to-this-computer-to
  version: 1
  assessment_title: PKU2U authentication using online identities must be prevented.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-security-allow-pku2u-authentication-requests-this-computer-use-online-test:
      test_title: '''Network Security: Allow PKU2U authentication requests to this computer to use online identities''
        is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Control\LSA\pku2u
          name:
            equals: AllowOnlineID
        object_title: Check the registry value at HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\LSA\pku2u\AllowOnlineID
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-security-allow-pku2u-authentication-requests-this-computer-use-online-test
