assessment:
  id: ng.shared.allow-unencrypted-traffic-is-set-to-disabled-33d612cd
  version: 1
  assessment_title: The Windows Remote Management (WinRM) client must not allow unencrypted traffic.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    allow-unencrypted-traffic-set-disabled-test:
      test_title: '''Allow unencrypted traffic'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Windows\WinRM\Client
          name:
            equals: AllowUnencryptedTraffic
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: allow-unencrypted-traffic-set-disabled-test
