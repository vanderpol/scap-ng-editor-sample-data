assessment:
  id: ng.shared.network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-is-set
  version: 1
  assessment_title: Anonymous enumeration of SAM accounts must not be allowed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-access-do-not-allow-anonymous-enumeration-sam-accounts-set-test:
      test_title: '''Network access: Do not allow anonymous enumeration of SAM accounts'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: System\CurrentControlSet\Control\Lsa
          name:
            case_insensitive_equals: RestrictAnonymousSAM
        object_title: Check for HKLM\System\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-access-do-not-allow-anonymous-enumeration-sam-accounts-set-test
