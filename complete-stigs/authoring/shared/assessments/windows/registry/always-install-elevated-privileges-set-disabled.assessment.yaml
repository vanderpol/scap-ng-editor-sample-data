assessment:
  id: ng.shared.always-install-with-elevated-privileges-is-set-to-disabled
  version: 1
  assessment_title: The Windows Installer feature "Always install with elevated privileges" must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    always-install-elevated-privileges-set-disabled-test:
      test_title: '''Always install with elevated privileges'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\Installer
          name:
            equals: AlwaysInstallElevated
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: always-install-elevated-privileges-set-disabled-test
