assessment:
  id: ng.shared.disallow-digest-authentication-is-set-to-enabled
  version: 1
  assessment_title: The Windows Remote Management (WinRM) client must not use Digest authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    disallow-digest-authentication-set-enabled-test:
      test_title: '''Disallow Digest authentication'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Windows\WinRM\Client
          name:
            equals: AllowDigest
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: disallow-digest-authentication-set-enabled-test
