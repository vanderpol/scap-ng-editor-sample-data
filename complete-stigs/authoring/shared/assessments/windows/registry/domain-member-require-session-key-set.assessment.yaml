assessment:
  id: ng.shared.domain-member-require-strong-windows-2000-or-later-session-key-is-set-to
  version: 1
  assessment_title: The system must be configured to require a strong session key.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    domain-member-require-strong-windows-2000-or-later-session-key-test:
      test_title: '''Domain member: Require strong (Windows 2000 or Later) session key'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
          name:
            equals: RequireStrongKey
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: domain-member-require-strong-windows-2000-or-later-session-key-test
