assessment:
  id: ng.shared.turn-off-inventory-collector-is-set-to-enabled
  version: 1
  assessment_title: The Application Compatibility Program Inventory must be prevented from collecting data and sending
    the information to Microsoft.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    turn-off-inventory-collector-set-enabled-test:
      test_title: '''Turn off Inventory Collector'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\AppCompat
          name:
            equals: DisableInventory
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: turn-off-inventory-collector-set-enabled-test
