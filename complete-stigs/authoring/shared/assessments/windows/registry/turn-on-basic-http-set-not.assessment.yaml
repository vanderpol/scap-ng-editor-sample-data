assessment:
  id: ng.shared.turn-on-basic-feed-authentication-over-http-is-set-to-not-configured-or
  version: 1
  assessment_title: Basic authentication for RSS feeds over HTTP must not be used.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    turn-on-basic-feed-authentication-over-http-set-not-configured-test:
      test_title: '''Turn on Basic feed authentication over HTTP'' is set to ''Not Configured'' or ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Policies\Microsoft\Internet Explorer\Feeds
          name:
            equals: AllowBasicAuthInClear
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    test: turn-on-basic-feed-authentication-over-http-set-not-configured-test
