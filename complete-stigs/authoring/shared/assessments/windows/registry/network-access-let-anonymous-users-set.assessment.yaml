assessment:
  id: ng.shared.network-access-let-everyone-permissions-apply-to-anonymous-users-is-set
  version: 1
  assessment_title: The system must be configured to prevent anonymous users from having the same rights as the Everyone
    group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-access-let-everyone-permissions-apply-anonymous-users-set-disabled-test:
      test_title: '''Network access: Let Everyone permissions apply to anonymous users'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Control\Lsa
          name:
            case_insensitive_equals: EveryoneIncludesAnonymous
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-access-let-everyone-permissions-apply-anonymous-users-set-disabled-test
