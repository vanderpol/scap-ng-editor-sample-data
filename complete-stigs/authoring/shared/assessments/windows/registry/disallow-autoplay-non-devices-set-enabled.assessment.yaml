assessment:
  id: ng.shared.disallow-autoplay-for-non-volume-devices-is-set-to-enabled
  version: 1
  assessment_title: Autoplay must be turned off for non-volume devices.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    disallow-autoplay-non-volume-devices-set-enabled-test:
      test_title: '''Disallow Autoplay for non-volume devices'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\Explorer
          name:
            equals: NoAutoplayfornonVolume
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: disallow-autoplay-non-volume-devices-set-enabled-test
