assessment:
  id: ng.shared.microsoft-network-client-digitally-sign-communications-always-is-set-to
  version: 1
  assessment_title: The Windows SMB client must be configured to always perform SMB packet signing.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    microsoft-network-client-digitally-sign-communications-always-set-enabled-test:
      test_title: '''Microsoft Network Client: Digitally sign communications (always)'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: System\CurrentControlSet\Services\LanmanWorkstation\Parameters
          name:
            equals: RequireSecuritySignature
        object_title: Check the registry value store at HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: microsoft-network-client-digitally-sign-communications-always-set-enabled-test
