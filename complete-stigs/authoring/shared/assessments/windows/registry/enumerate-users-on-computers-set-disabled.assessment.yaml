assessment:
  id: ng.shared.enumerate-local-users-on-domain-joined-computers-is-set-to-disabled
  version: 1
  assessment_title: Local users on domain-joined computers must not be enumerated.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    enumerate-local-users-on-domain-joined-computers-set-disabled-test:
      test_title: '''Enumerate local users on domain-joined computers'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SOFTWARE\Policies\Microsoft\Windows\System
          name:
            case_insensitive_equals: EnumerateLocalUsers
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: enumerate-local-users-on-domain-joined-computers-set-disabled-test
