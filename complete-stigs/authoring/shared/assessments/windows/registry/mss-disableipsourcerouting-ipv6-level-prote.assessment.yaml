assessment:
  id: ng.shared.mss-disableipsourcerouting-ipv6-ip-source-routing-protection-level-prote
  version: 1
  assessment_title: IPv6 source routing must be configured to highest protection.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    mss-disableipsourcerouting-ipv6-ip-source-routing-protection-level-protects-against-test:
      test_title: '''MSS: (DisableIPSourceRouting IPv6) IP source routing protection level (protects against packet
        spoofing)'' is set to ''Highest protection, source routing is completely disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: System\CurrentControlSet\Services\Tcpip6\Parameters
          name:
            equals: DisableIPSourceRouting
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 2
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: mss-disableipsourcerouting-ipv6-ip-source-routing-protection-level-protects-against-test
