assessment:
  id: ng.shared.restrict-unauthenticated-rpc-clients-is-set-to-enabled-and-authenticated
  version: 1
  assessment_title: Unauthenticated RPC clients must be restricted from connecting to the RPC server.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    restrict-unauthenticated-rpc-clients-set-enabled-authenticated-test:
      test_title: '''Restrict Unauthenticated RPC clients'' is set to ''Enabled'' and ''Authenticated'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SOFTWARE\Policies\Microsoft\Windows NT\Rpc
          name:
            case_insensitive_equals: RestrictRemoteClients
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: restrict-unauthenticated-rpc-clients-set-enabled-authenticated-test
