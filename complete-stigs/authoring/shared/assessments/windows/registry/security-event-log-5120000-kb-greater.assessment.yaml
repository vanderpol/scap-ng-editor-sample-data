assessment:
  id: ng.shared.the-security-event-log-size-is-configured-to-5120000-kb-or-greater
  version: 1
  assessment_title: The security event log size must be configured to a value that holds at least one week's worth
    of audit records.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    security-event-log-size-configured-5120000-kb-or-greater-test:
      test_title: The Security event log size is configured to 5120000 KB or greater
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SOFTWARE\Policies\Microsoft\Windows\EventLog\Security
          name:
            case_insensitive_equals: MaxSize
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            greater_than_or_equal: 5120000
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: security-event-log-size-configured-5120000-kb-or-greater-test
