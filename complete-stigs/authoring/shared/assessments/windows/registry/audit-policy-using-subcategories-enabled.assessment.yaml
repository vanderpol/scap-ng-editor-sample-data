assessment:
  id: ng.shared.audit-policy-using-subcategories-is-enabled
  version: 1
  assessment_title: Audit policy using subcategories must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-policy-using-subcategories-enabled-test:
      test_title: Audit policy using subcategories is enabled.
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SYSTEM\CurrentControlSet\Control\Lsa
          name:
            case_insensitive_equals: SCENoApplyLegacyAuditPolicy
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: audit-policy-using-subcategories-enabled-test
