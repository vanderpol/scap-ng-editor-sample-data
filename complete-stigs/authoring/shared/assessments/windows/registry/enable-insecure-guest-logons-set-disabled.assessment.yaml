assessment:
  id: ng.shared.enable-insecure-guest-logons-is-set-to-disabled
  version: 1
  assessment_title: Insecure logons to an SMB server must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    enable-insecure-guest-logons-set-disabled-test:
      test_title: '''Enable insecure guest logons'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation
          name:
            equals: AllowInsecureGuestAuth
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: enable-insecure-guest-logons-set-disabled-test
