assessment:
  id: ng.shared.network-security-minimum-session-security-for-ntlm-ssp-based-including-s
  version: 1
  assessment_title: The system must be configured to meet the minimum session security requirement for NTLM SSP based
    servers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-security-minimum-session-security-ntlm-ssp-based-including-secure-test:
      test_title: '''Network security: Minimum session security for NTLM SSP based (including secure RPC) servers''
        is set to ''Require NTLMv2 session security'' and ''Require 128-bit encryption'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
          name:
            equals: NTLMMinServerSec
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 537395200
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-security-minimum-session-security-ntlm-ssp-based-including-secure-test
