assessment:
  id: ng.shared.verifies-user-account-control-behavior-of-the-elevation-prompt-for-stand
  version: 1
  assessment_title: User Account Control must automatically deny elevation requests for standard users.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    verifies-user-account-control-behavior-elevation-prompt-standard-users-set-test:
      test_title: 'Verifies ''User Account Control: Behavior of the elevation prompt for standard users'' is set to
        ''Automatically deny elevation requests'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: Software\Microsoft\Windows\CurrentVersion\Policies\System
          name:
            equals: ConsentPromptBehaviorUser
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: verifies-user-account-control-behavior-elevation-prompt-standard-users-set-test
