assessment:
  id: ng.shared.domain-member-digitally-encrypt-secure-channel-data-when-possible-is-set
  version: 1
  assessment_title: Outgoing secure channel traffic must be encrypted.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    domain-member-digitally-encrypt-secure-channel-data-when-possible-set-test:
      test_title: '''Domain member: Digitally encrypt secure channel data (when possible)'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: System\CurrentControlSet\Services\Netlogon\Parameters
          name:
            equals: SealSecureChannel
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: domain-member-digitally-encrypt-secure-channel-data-when-possible-set-test
