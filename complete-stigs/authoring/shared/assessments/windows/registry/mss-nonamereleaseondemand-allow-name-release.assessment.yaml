assessment:
  id: ng.shared.mss-nonamereleaseondemand-allow-computer-to-ignore-netbios-name-release
  version: 1
  assessment_title: The system must be configured to ignore NetBIOS name release requests except from WINS servers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except-test:
      test_title: '''MSS: (NoNameReleaseOnDemand) Allow computer to ignore NetBIOS name release requests except from
        WINS servers'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: System\CurrentControlSet\Services\Netbt\Parameters
          name:
            equals: NoNameReleaseOnDemand
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: mss-nonamereleaseondemand-allow-computer-ignore-netbios-name-release-requests-except-test
