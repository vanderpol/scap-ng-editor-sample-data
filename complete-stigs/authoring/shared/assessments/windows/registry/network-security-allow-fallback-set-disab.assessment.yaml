assessment:
  id: ng.shared.network-security-allow-localsystem-null-session-fallback-is-set-to-disab
  version: 1
  assessment_title: NTLM must be prevented from falling back to a Null session.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-security-allow-localsystem-null-session-fallback-set-disabled-test:
      test_title: '''Network security: Allow LocalSystem NULL session fallback'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SYSTEM\CurrentControlSet\Control\LSA\MSV1_0
          name:
            equals: allownullsessionfallback
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-security-allow-localsystem-null-session-fallback-set-disabled-test
