assessment:
  id: ng.shared.microsoft-network-client-send-unencrypted-password-to-connect-to-third-p
  version: 1
  assessment_title: Unencrypted passwords must not be sent to third-party SMB Servers.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    microsoft-network-client-send-unencrypted-password-connect-third-party-smb-test:
      test_title: '''Microsoft Network Client: Send unencrypted password to connect to third-party SMB servers'' is
        set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            case_insensitive_equals: SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
          name:
            case_insensitive_equals: EnablePlainTextPassword
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: microsoft-network-client-send-unencrypted-password-connect-third-party-smb-test
