assessment:
  id: ng.shared.do-not-allow-passwords-to-be-saved-is-set-to-enabled
  version: 1
  assessment_title: Passwords must not be saved in the Remote Desktop Client.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    do-not-allow-passwords-saved-set-enabled-test:
      test_title: '''Do not allow passwords to be saved'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
          name:
            equals: DisablePasswordSaving
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: do-not-allow-passwords-saved-set-enabled-test
