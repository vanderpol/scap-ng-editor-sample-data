assessment:
  id: ng.shared.turn-off-shell-protocol-protected-mode-is-set-to-disabled
  version: 1
  assessment_title: File Explorer shell protocol must run in protected mode.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    turn-off-shell-protocol-protected-mode-set-disabled-test:
      test_title: '''Turn off shell protocol protected mode'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
          name:
            equals: PreXPSP2ShellProtocolBehavior
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: may_be_absent_and_all_match
  evaluate:
    test: turn-off-shell-protocol-protected-mode-set-disabled-test
