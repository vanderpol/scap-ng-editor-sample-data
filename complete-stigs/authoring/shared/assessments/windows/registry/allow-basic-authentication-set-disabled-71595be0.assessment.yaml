assessment:
  id: ng.shared.allow-basic-authentication-is-set-to-disabled-71595be0
  version: 1
  assessment_title: The Windows Remote Management (WinRM) service must not use Basic authentication.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    allow-basic-authentication-set-disabled-test:
      test_title: '''Allow Basic authentication'' is set to ''Disabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\WinRM\Service
          name:
            equals: AllowBasic
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 0
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: allow-basic-authentication-set-disabled-test
