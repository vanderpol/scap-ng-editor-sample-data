assessment:
  id: ng.shared.remote-host-allows-delegation-of-non-exportable-credentials-is-set-to-en
  version: 1
  assessment_title: Windows must be configured to enable Remote host allows delegation of non-exportable credentials.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    remote-host-allows-delegation-non-exportable-credentials-set-enabled-test:
      test_title: '''Remote host allows delegation of non-exportable credentials'' is set to ''Enabled'''
      capability: windows.registry
      object:
        capability: windows.registry
        select:
          hive:
            equals: local_machine
          key:
            equals: SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation
          name:
            equals: AllowProtectedCreds
        object_title: null
      states:
      - and:
        - type:
            equals: dword
        - value:
            equals: 1
        state_fields_require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: remote-host-allows-delegation-non-exportable-credentials-set-enabled-test
