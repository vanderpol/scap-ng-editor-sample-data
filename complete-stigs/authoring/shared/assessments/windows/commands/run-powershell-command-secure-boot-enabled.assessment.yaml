assessment:
  id: ng.shared.run-a-powershell-command-to-determine-if-secure-boot-must-be-enabled
  version: 1
  assessment_title: Secure Boot must be enabled on Windows systems.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    run-powershell-command-determine-if-secure-boot-enabled-test:
      test_title: Run a PowerShell command to determine if Secure Boot must be enabled.
      capability: independent.shellcommand
      object:
        capability: independent.shellcommand
        object_title: Run a PowerShell command to determine if secure boot is enabled
        collect:
          shell: powershell
          command: Confirm-SecureBootUEFI
          pattern: ''
          error_if_exit_status_not_0: false
          error_if_stderr_exists: false
      states:
      - stdout_line:
          require: at_least_one_exists_and_all_match
          equals: 'True'
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: run-powershell-command-determine-if-secure-boot-enabled-test
