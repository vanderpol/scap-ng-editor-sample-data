assessment:
  id: ng.shared.unified-extensible-firmware-interface-uefi-firmware-must-exist-and-be-co
  version: 1
  assessment_title: Windows systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured
    to run in UEFI mode, not Legacy BIOS.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    unified-extensible-firmware-interface-uefi-firmware-exist-configured-run-in-test:
      test_title: Unified Extensible Firmware Interface (UEFI) firmware must exist and be configured to run in UEFI
        mode, not Legacy BIOS.
      capability: windows.cmdlet
      object:
        capability: windows.cmdlet
        object_title: Secure Boot State Setting
        collect:
          module_name: Microsoft.Powershell.Management
          module_id: null
          module_version: null
          verb: Get
          noun: ComputerInfo
          parameters: null
          select:
            fields:
              property:
                selection_match: all
                equals: biosfirmwaretype
      states:
      - value:
          record:
            fields:
              biosfirmwaretype:
                require: at_least_one_exists_and_all_match
                case_insensitive_equals: UEFI
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: at_least_one_exists_and_some_match
  evaluate:
    test: unified-extensible-firmware-interface-uefi-firmware-exist-configured-run-in-test
