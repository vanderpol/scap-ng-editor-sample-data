assessment:
  id: ng.shared.the-telnet-client-is-not-installed-on-the-system
  version: 1
  assessment_title: The Telnet Client must not be installed on the system.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    telnet-client-not-installed-on-system-test:
      test_title: The Telnet Client is not installed on the system
      capability: windows.wmi.query
      object:
        capability: windows.wmi.query
        object_title: null
        collect:
          namespace: root\cimv2
          query: SELECT installstate FROM win32_optionalfeature WHERE name = 'TelnetClient'
      states:
      - result:
          record:
            fields:
              installstate:
                require: at_least_one_exists_and_some_match
                equals: '2'
            require: at_least_one_exists_and_all_match
      reported_elements: all
      collected_items_require: all_exist_and_all_match
  evaluate:
    test: telnet-client-not-installed-on-system-test
