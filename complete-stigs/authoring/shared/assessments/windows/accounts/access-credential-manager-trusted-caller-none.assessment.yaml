assessment:
  id: ng.shared.access-credential-manager-as-a-trusted-caller-none
  version: 1
  assessment_title: The "Access Credential Manager as a trusted caller" user right must not be assigned to any groups
    or accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    access-credential-manager-as-trusted-caller-none-test:
      test_title: Access Credential Manager as a trusted caller - None
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_TRUSTED_CREDMAN_ACCESS_NAME
        object_title: null
      states:
      - trustee_name:
          require: at_least_one_exists_and_all_match
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: access-credential-manager-as-trusted-caller-none-test
