assessment:
  id: ng.shared.manage-auditing-and-security-log-administrators
  version: 1
  assessment_title: The "Manage auditing and security log" user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    manage-auditing-security-log-administrators-test:
      test_title: Manage auditing and security log - Administrators
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_SECURITY_NAME
        object_title: null
      states:
      - trustee_name:
          equals: ''
      - trustee_name:
          case_insensitive_equals: Administrators
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: manage-auditing-security-log-administrators-test
