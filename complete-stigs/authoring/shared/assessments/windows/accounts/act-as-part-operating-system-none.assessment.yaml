assessment:
  id: ng.shared.act-as-part-of-the-operating-system-none
  version: 1
  assessment_title: The "Act as part of the operating system" user right must not be assigned to any groups or accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    act-as-part-operating-system-none-test:
      test_title: Act as part of the operating system - None
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_TCB_NAME
        object_title: null
      states:
      - trustee_name:
          require: at_least_one_exists_and_all_match
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: act-as-part-operating-system-none-test
