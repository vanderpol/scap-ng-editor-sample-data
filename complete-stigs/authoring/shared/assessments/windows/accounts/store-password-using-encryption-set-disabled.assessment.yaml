assessment:
  id: ng.shared.store-password-using-reversible-encryption-is-set-to-disabled
  version: 1
  assessment_title: Reversible password encryption must be disabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    store-password-using-reversible-encryption-set-disabled-test:
      test_title: '''Store password using reversible encryption'' is set to ''Disabled'''
      capability: windows.passwordpolicy
      states:
      - reversible_encryption:
          require: at_least_one_exists_and_all_match
          equals: false
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: store-password-using-reversible-encryption-set-disabled-test
