assessment:
  id: ng.shared.password-must-meet-complexity-requirements-is-set-to-enabled
  version: 1
  assessment_title: The built-in Microsoft password complexity filter must be enabled.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    password-meet-complexity-requirements-set-enabled-test:
      test_title: '''Password must meet complexity requirements'' is set to ''Enabled'''
      capability: windows.passwordpolicy
      states:
      - password_complexity:
          require: at_least_one_exists_and_all_match
          equals: true
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: password-meet-complexity-requirements-set-enabled-test
