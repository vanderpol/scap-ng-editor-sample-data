assessment:
  id: ng.shared.create-a-token-object-none
  version: 1
  assessment_title: The "Create a token object" user right must not be assigned to any groups or accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    create-token-object-none-test:
      test_title: Create a token object - None
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_CREATE_TOKEN_NAME
        object_title: null
      states:
      - trustee_name:
          require: at_least_one_exists_and_all_match
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: create-token-object-none-test
