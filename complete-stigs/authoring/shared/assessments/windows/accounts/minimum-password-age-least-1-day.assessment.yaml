assessment:
  id: ng.shared.minimum-password-age-is-set-to-at-least-1-day
  version: 1
  assessment_title: The minimum password age must be configured to at least 1 day.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    minimum-password-age-set-at-least-1-day-test:
      test_title: '''Minimum Password Age'' is set to at least ''1'' day'
      capability: windows.passwordpolicy
      states:
      - min_passwd_age:
          require: at_least_one_exists_and_all_match
          greater_than_or_equal: 86400
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: minimum-password-age-set-at-least-1-day-test
