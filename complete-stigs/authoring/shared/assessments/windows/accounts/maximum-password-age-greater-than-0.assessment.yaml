assessment:
  id: ng.shared.maximum-password-age-is-set-to-60-days-or-less-but-greater-than-0
  version: 1
  assessment_title: The maximum password age must be configured to 60 days or less.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    maximum-password-age-set-60-days-or-less-but-greater-test:
      test_title: Maximum Password Age is set to 60 days or less, but greater than 0.
      capability: windows.passwordpolicy
      states:
      - max_passwd_age:
          less_than_or_equal: 5184000
      - max_passwd_age:
          greater_than: 0
      reported_elements: all
      states_match: all
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: maximum-password-age-set-60-days-or-less-but-greater-test
