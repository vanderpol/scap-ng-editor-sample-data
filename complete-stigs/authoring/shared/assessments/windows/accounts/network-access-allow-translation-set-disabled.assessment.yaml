assessment:
  id: ng.shared.network-access-allow-anonymous-sid-name-translation-is-set-to-disabled
  version: 1
  assessment_title: Anonymous SID/Name translation must not be allowed.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    network-access-allow-anonymous-sid-name-translation-set-disabled-test:
      test_title: '''Network access: Allow anonymous SID/Name translation'' is set to ''Disabled'''
      capability: windows.passwordpolicy
      states:
      - anonymous_name_lookup:
          require: at_least_one_exists_and_all_match
          equals: false
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: network-access-allow-anonymous-sid-name-translation-set-disabled-test
