assessment:
  id: ng.shared.back-up-files-and-directories-administrators
  version: 1
  assessment_title: The "Back up files and directories" user right must only be assigned to the Administrators group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    back-up-files-directories-administrators-test:
      test_title: Back up files and directories - Administrators
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_BACKUP_NAME
        object_title: null
      states:
      - trustee_name:
          equals: ''
      - trustee_name:
          case_insensitive_equals: Administrators
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: back-up-files-directories-administrators-test
