assessment:
  id: ng.shared.force-shutdown-from-a-remote-system-administrators
  version: 1
  assessment_title: The "Force shutdown from a remote system" user right must only be assigned to the Administrators
    group.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    force-shutdown-from-remote-system-administrators-test:
      test_title: Force shutdown from a remote system - Administrators
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_REMOTE_SHUTDOWN_NAME
        object_title: null
      states:
      - trustee_name:
          equals: ''
      - trustee_name:
          case_insensitive_equals: Administrators
      reported_elements: all
      states_match: any
      state_fields_require: at_least_one_exists_and_all_match
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: force-shutdown-from-remote-system-administrators-test
