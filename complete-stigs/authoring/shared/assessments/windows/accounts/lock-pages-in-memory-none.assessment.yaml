assessment:
  id: ng.shared.lock-pages-in-memory-none
  version: 1
  assessment_title: The "Lock pages in memory" user right must not be assigned to any groups or accounts.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    lock-pages-in-memory-none-test:
      test_title: Lock pages in memory - None
      capability: windows.userright
      object:
        capability: windows.userright
        select:
          userright:
            equals: SE_LOCK_MEMORY_NAME
        object_title: null
      states:
      - trustee_name:
          require: at_least_one_exists_and_all_match
          equals: ''
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    test: lock-pages-in-memory-none-test
