assessment:
  id: ng.shared.a-host-based-firewall-must-be-installed-and-enabled-on-the-system
  version: 1
  assessment_title: A host-based firewall must be installed and enabled on the system.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: Determine if a host-based firewall is installed and enabled on the system. If a host-based firewall is not installed
    and enabled on the system, this is a finding. The configuration requirements will be determined by the applicable firewall
    STIG.
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
