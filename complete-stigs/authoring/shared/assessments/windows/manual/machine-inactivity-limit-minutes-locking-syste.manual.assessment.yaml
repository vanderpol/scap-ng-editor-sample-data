assessment:
  id: ng.shared.the-machine-inactivity-limit-must-be-set-to-15-minutes-locking-the-syste
  version: 1
  assessment_title: The machine inactivity limit must be set to 15 minutes, locking the system with the screensaver.
  mode: manual
  purpose: assessment
  class: compliance
  procedure: 'If the following registry value does not exist or is not configured as specified, this is a finding: Registry
    Hive: HKEY_LOCAL_MACHINE Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ Value Name: InactivityTimeoutSecs
    Value Type: REG_DWORD Value: 0x00000384 (900) (or less, excluding "0" which is effectively disabled)'
  response:
    type: compliance
    choices:
    - value: pass
      label: Pass
      outcome: 'true'
    - value: fail
      label: Fail
      outcome: 'false'
    - value: unknown
      label: Unknown
      outcome: unknown
    - value: not_applicable
      label: Not applicable
      outcome: not_applicable
    allow_comment: true
    allow_evidence: true
