assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-system-system-integrity-failures
  version: 1
  assessment_title: The system must be configured to audit System - System Integrity failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-system-integrity-failure-only-test:
      test_title: Audit - System Integrity - Failure only
      capability: windows.auditeventpolicysubcategories
      states:
      - system_integrity:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-system-integrity-success-failure-test:
      test_title: Audit - System Integrity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      states:
      - system_integrity:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-system-integrity-failure-only-test
    - test: audit-system-integrity-success-failure-test
