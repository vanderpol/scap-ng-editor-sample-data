assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-system-security-state-change-succ
  version: 1
  assessment_title: The system must be configured to audit System - Security State Change successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-security-state-change-success-only-test:
      test_title: Audit - Security State Change - Success only
      capability: windows.auditeventpolicysubcategories
      states:
      - security_state_change:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-security-state-change-success-failure-test:
      test_title: Audit - Security State Change - Success and Failure
      capability: windows.auditeventpolicysubcategories
      states:
      - security_state_change:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-security-state-change-success-only-test
    - test: audit-security-state-change-success-failure-test
