assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-account-logon-credential-validati-5c3249ac
  version: 1
  assessment_title: The system must be configured to audit Account Logon - Credential Validation successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-credential-validation-set-success-test:
      test_title: '''Audit Credential Validation'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      states:
      - credential_validation:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-credential-validation-set-success-failure-test:
      test_title: '''Audit Credential Validation'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - credential_validation:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-credential-validation-set-success-test
    - test: audit-credential-validation-set-success-failure-test
