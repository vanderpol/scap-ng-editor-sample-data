assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-system-ipsec-driver-failures
  version: 1
  assessment_title: The system must be configured to audit System - IPsec Driver failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-ipsec-driver-failure-only-test:
      test_title: Audit - IPSec Driver - Failure only
      capability: windows.auditeventpolicysubcategories
      states:
      - ipsec_driver:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-ipsec-driver-success-failure-test:
      test_title: Audit - IPSec Driver - Success and Failure
      capability: windows.auditeventpolicysubcategories
      states:
      - ipsec_driver:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-ipsec-driver-failure-only-test
    - test: audit-ipsec-driver-success-failure-test
