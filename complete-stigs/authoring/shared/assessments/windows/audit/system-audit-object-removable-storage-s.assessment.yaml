assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-object-access-removable-storage-s
  version: 1
  assessment_title: The system must be configured to audit Object Access - Removable Storage successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-object-access-removable-storage-success-only-test:
      test_title: Audit - Object Access - Removable Storage - Success Only
      capability: windows.auditeventpolicysubcategories
      states:
      - removable_storage:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-object-access-removable-storage-success-failure-test:
      test_title: Audit - Object Access - Removable Storage - Success and Failure
      capability: windows.auditeventpolicysubcategories
      states:
      - removable_storage:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-object-access-removable-storage-success-only-test
    - test: audit-object-access-removable-storage-success-failure-test
