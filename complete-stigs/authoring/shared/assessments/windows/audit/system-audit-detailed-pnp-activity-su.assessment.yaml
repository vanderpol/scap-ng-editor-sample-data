assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-detailed-tracking-pnp-activity-su
  version: 1
  assessment_title: The system must be configured to audit Detailed Tracking - PNP Activity successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-detailed-tracking-pnp-activity-success-only-test:
      test_title: Audit - Detailed Tracking - PNP Activity - Success Only
      capability: windows.auditeventpolicysubcategories
      states:
      - pnp_activity:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-detailed-tracking-pnp-activity-success-failure-test:
      test_title: Audit - Detailed Tracking - PNP Activity - Success and Failure
      capability: windows.auditeventpolicysubcategories
      states:
      - pnp_activity:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-detailed-tracking-pnp-activity-success-only-test
    - test: audit-detailed-tracking-pnp-activity-success-failure-test
