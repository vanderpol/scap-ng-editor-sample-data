assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-policy-change-audit-policy-change
  version: 1
  assessment_title: The system must be configured to audit Policy Change - Audit Policy Change successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-audit-policy-change-set-success-test:
      test_title: '''Audit Audit Policy Change'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      states:
      - audit_policy_change:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-audit-policy-change-set-success-failure-test:
      test_title: '''Audit Audit Policy Change'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - audit_policy_change:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-audit-policy-change-set-success-test
    - test: audit-audit-policy-change-set-success-failure-test
