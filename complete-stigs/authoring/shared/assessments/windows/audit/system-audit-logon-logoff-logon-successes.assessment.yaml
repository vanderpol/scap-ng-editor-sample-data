assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-logon-logoff-logon-successes
  version: 1
  assessment_title: The system must be configured to audit Logon/Logoff - Logon successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-logon-set-success-test:
      test_title: '''Audit Logon'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      states:
      - logon:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-logon-set-success-failure-test:
      test_title: '''Audit Logon'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - logon:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-logon-set-success-test
    - test: audit-logon-set-success-failure-test
