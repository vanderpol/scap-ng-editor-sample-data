assessment:
  id: ng.shared.windows-must-be-configured-to-audit-registry-failures
  version: 1
  assessment_title: Windows must be configured to audit registry failures.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-registry-set-failure-test:
      test_title: '''Audit Registry'' is set to ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - registry:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-registry-set-success-failure-test:
      test_title: '''Audit Registry'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - registry:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-registry-set-failure-test
    - test: audit-registry-set-success-failure-test
