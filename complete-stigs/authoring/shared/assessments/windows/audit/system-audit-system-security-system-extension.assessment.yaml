assessment:
  id: ng.shared.the-system-must-be-configured-to-audit-system-security-system-extension
  version: 1
  assessment_title: The system must be configured to audit System - Security System Extension successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-security-system-extension-set-success-test:
      test_title: '''Audit Security System Extension'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      states:
      - security_system_extension:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-security-system-extension-set-success-failure-test:
      test_title: '''Audit Security System Extension'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - security_system_extension:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-security-system-extension-set-success-test
    - test: audit-security-system-extension-set-success-failure-test
