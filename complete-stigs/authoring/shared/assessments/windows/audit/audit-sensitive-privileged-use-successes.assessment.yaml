assessment:
  id: ng.shared.windows-must-be-configured-to-audit-sensitive-privileged-use-successes
  version: 1
  assessment_title: Windows must be configured to audit sensitive privileged use successes.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  tests:
    audit-sensitive-privilege-use-set-success-test:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Success'''
      capability: windows.auditeventpolicysubcategories
      states:
      - sensitive_privilege_use:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
    audit-sensitive-privilege-use-set-success-failure-test:
      test_title: '''Audit Sensitive Privilege Use'' is set to ''Success'' and ''Failure'''
      capability: windows.auditeventpolicysubcategories
      states:
      - sensitive_privilege_use:
          require: at_least_one_exists_and_all_match
          equals: AUDIT_SUCCESS_FAILURE
      reported_elements: all
      collected_items_require: at_least_one_exists_and_all_match
  evaluate:
    any:
    - test: audit-sensitive-privilege-use-set-success-test
    - test: audit-sensitive-privilege-use-set-success-failure-test
