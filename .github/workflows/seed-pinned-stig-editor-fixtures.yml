name: Seed pinned source-backed editor fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/seed_pinned_stig_fixtures.py'
      - 'tools/test_seed_pinned_stig_fixtures.py'
      - '.github/workflows/seed-pinned-stig-editor-fixtures.yml'

permissions:
  contents: write

concurrency:
  group: pinned-real-editor-fixtures-main
  cancel-in-progress: false

jobs:
  seed-real-source-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test fail-closed fixture selector without network
        run: PYTHONPATH=tools python -m unittest -v test_seed_pinned_stig_fixtures
      - name: Download verified r3 review source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.4.0-joval-meeting-preview-20261015-r3 \
            --repo vanderpol/scap-ng \
            --pattern scap-ng-v0.4-joval-six-stig-yaml.zip \
            --pattern REVIEW-MANIFEST.json \
            --dir work
          test -s work/scap-ng-v0.4-joval-six-stig-yaml.zip
          test -s work/REVIEW-MANIFEST.json
      - name: Extract exact source bytes and validate Rule / dependency closure
        run: |
          python tools/seed_pinned_stig_fixtures.py \
            --source-zip work/scap-ng-v0.4-joval-six-stig-yaml.zip \
            --review-manifest work/REVIEW-MANIFEST.json
      - name: Verify copied fixtures against pinned release archive
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path("manifests/pinned-real-stig-fixtures.json").read_text())
          assert r["counts"]["cases"]==6
          assert r["counts"]["source_rules"]==6
          assert r["counts"]["unique_assessments"]>=1
          for x in r["files"]:
              assert hashlib.sha256(Path(x["path"]).read_bytes()).hexdigest()==x["sha256"], x["path"]
          print("Verified",r["counts"]["files"],"byte-preserved authoring source files")
          PY
      - name: Commit pinned text-only source and provenance to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add focused-fixtures/source-backed manifests/pinned-real-stig-fixtures.json
          if git diff --cached --quiet; then
            echo "Pinned real-source editor fixtures are unchanged."
          else
            git commit -m "Seed checked six-STIG editor sources from r3 (Refs #1)"
            git push origin HEAD:main
          fi
