name: Current 0.4 editor fixture integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact requirements-first canonical example revision
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: 463675f3b931e596c922352a131cb3c515ab2265
          path: canonical
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.24,<5'
      - run: python scripts/check_fixtures.py --canonical-root canonical
