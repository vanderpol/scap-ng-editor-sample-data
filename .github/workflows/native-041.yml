name: Native 0.4.1 language fixture admission

on:
  pull_request:
    paths:
      - 'fixtures/native-041/**'
      - 'scripts/check_native_041.py'
      - '.github/workflows/native-041.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/native-041/**'
      - 'scripts/check_native_041.py'
      - '.github/workflows/native-041.yml'
  workflow_dispatch:

jobs:
  native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout editor fixture repository
        uses: actions/checkout@v4
      - name: Checkout pinned canonical SCAP-NG 0.4.1
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: 5ee55288b369da26f308f40813e545b78dff2753
          path: canonical
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture validation dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.24,<5' 'referencing>=0.35,<1'
      - name: Assert valid Assessments and policy documents, reject negative grammar
        run: python scripts/check_native_041.py --canonical-root canonical
